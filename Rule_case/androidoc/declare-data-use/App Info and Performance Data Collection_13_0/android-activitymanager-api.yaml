rules:
- id: android-activitymanager-api
  languages:
    - java
  message: The app uses the ActivityManager API, which may access user data related to app info and performance.
  metadata:
    category: Android Security
    technology: Android
    cwe: CWE-200  # 信息暴露
    owasp: "M1: Improper Platform Usage"
  severity: INFO
  patterns:
    - pattern-either:
        - pattern: $MANAGER.getRunningAppProcesses()
        - pattern: $MANAGER.getRunningTasks(...)
        - pattern: $MANAGER.getRunningServices(...)
    - metavariable-type:
        metavariable: $MANAGER
        type: android.app.ActivityManager
