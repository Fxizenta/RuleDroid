rules:
- id: android-batterymanager-api
  languages:
  - java
  message: |
      The app uses the BatteryManager API to retrieve battery-related information.
      If this is used to infer user behavior, ensure compliance with data privacy guidelines.
  metadata:
    category: Android Security
    technology: Android
    cwe: CWE-200  # 信息泄露
    owasp-mobile: M4  # 隐私数据泄露
  severity: INFO
  patterns:
    - pattern-either:
        # BatteryManager 变量声明 + 使用
        - pattern: |
            BatteryManager $X = (BatteryManager) $Y.getSystemService(Context.BATTERY_SERVICE);
            ...
            $X.getIntProperty($PROPERTY);
        - pattern: |
            BatteryManager $X = (BatteryManager) $Y.getSystemService(Context.BATTERY_SERVICE);
            ...
            $X.getLongProperty($PROPERTY);
        - pattern: |
            BatteryManager $X = (BatteryManager) $Y.getSystemService(Context.BATTERY_SERVICE);
            ...
            IntentFilter $FILTER = new IntentFilter(Intent.ACTION_BATTERY_CHANGED);
            Intent $BATTERY_STATUS = $Y.registerReceiver(null, $FILTER);
            int $LEVEL = $BATTERY_STATUS.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
