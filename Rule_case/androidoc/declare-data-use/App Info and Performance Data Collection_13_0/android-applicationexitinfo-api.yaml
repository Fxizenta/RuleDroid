rules:
- id: android-applicationexitinfo-api
  languages:
  - java
  message: The app uses the ApplicationExitInfo API, which may access user data related to app info and performance. Ensure it is not used to handle sensitive user data insecurely.
  metadata:
    category: Android Security
    technology: Android
  severity: INFO
  patterns:
    - pattern-either:
        - pattern: $INFO.getReason()
        - pattern: $INFO.getTimestamp()
        - pattern: $INFO.getProcessName()
        - pattern: $INFO.getTraceInputStream()
    - metavariable-type:
        metavariable: $INFO
        type: android.app.ApplicationExitInfo
