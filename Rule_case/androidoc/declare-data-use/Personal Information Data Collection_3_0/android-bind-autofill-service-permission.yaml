rules:
  - id: android-bind-autofill-service-permission
    languages:
      - xml
    message: >
      The app declares an AutofillService component protected by
      BIND_AUTOFILL_SERVICE. Review its handling of personal information and
      ensure the service is intentionally present.
    metadata:
      category: Personal Information Data Collection
      references:
        - "https://developer.android.com/reference/android/Manifest.permission#BIND_AUTOFILL_SERVICE"
      remediation: >
        Review the necessity of using the BIND_AUTOFILL_SERVICE permission.
        Ensure compliance with privacy policies and obtain user consent when necessary.
    severity: INFO
    pattern: <service ... android:permission="android.permission.BIND_AUTOFILL_SERVICE" ...> ... </service>
    paths:
      include: ["**/AndroidManifest.xml"]
