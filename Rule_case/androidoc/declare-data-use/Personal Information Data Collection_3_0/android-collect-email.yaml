rules:
  - id: android-collect-email
    languages:
      - java
    message: >
      The app collects the user's email address, which is personal information.
      Ensure this data is handled securely and complies with privacy policies.
    severity: INFO
    patterns:
      - pattern: $USER.getEmail()
      - metavariable-type:
          metavariable: $USER
          type: com.google.firebase.auth.FirebaseUser
    metadata:
      references:
        - "https://developer.android.com/topic/security/best-practices"
        - "https://www.privacyinternational.org/learn/what-are-personal-data-and-sensitive-data"
      category: Personal Information Data Collection
    remediation: >
      Avoid collecting sensitive personal information, such as email addresses, unless necessary.
      Ensure compliance with privacy regulations and obtain user consent where applicable. Consider encrypting personal data in transit and at rest.
    min-version: 1.31.0
