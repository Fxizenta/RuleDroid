rules:
  - id: android-manifest-audio-permissions
    languages: [xml]
    message: "Permission declarations related to audio data collection or media access are detected in AndroidManifest.xml. Please confirm whether the relevant permission applications are necessary and fully protected."
    metadata:
      category: privacy
      references:
        - https://developer.android.com/guide/topics/permissions/overview
    paths:
      include:
        - '**/AndroidManifest.xml'
        - '**/AndroidManifest.xml'
    patterns:
      - pattern-either:
          - pattern: <uses-permission ... android:name="android.permission.CAPTURE_AUDIO_OUTPUT" ...>
          - pattern: <uses-permission ... android:name="android.permission.RECORD_AUDIO" ...>
          - pattern: <uses-permission ... android:name="android.permission.READ_MEDIA_AUDIO" ...>
    severity: INFO
