rules:
- id: android-service-missing-exported-attribute
  languages:
  - xml
  message: "\u8BE5 service \u5305\u542B intent-filter\uFF0C\u4F46\u672A\u663E\u5F0F\
    \u58F0\u660E android:exported \u5C5E\u6027\u3002 \u8BF7\u6839\u636E\u9884\u671F\
    \u884C\u4E3A\u6DFB\u52A0 android:exported=\"true\" \u6216 android:exported=\"\
    false\"\uFF0C\u4EE5\u786E\u4FDD service \u7684\u5B89\u5168\u914D\u7F6E\u3002\n"
  metadata:
    cwe: '264'
    owasp-mobile: M1
    reference: https://developer.android.com/guide/topics/manifest/service-element
  paths:
    include: ["**/AndroidManifest.xml"]
  patterns:
    - pattern: |
        <service ...>
          ...
          <intent-filter ...> ... </intent-filter>
          ...
        </service>
    - pattern-not: |
        <service ... android:exported=$EXPORTED ...>
          ...
        </service>
  severity: WARNING
