rules:
  - id: android-sharedpreferences-insecure-mode
    languages:
      - java
      - kotlin
    name: "Using the unsafe SharedPreferences pattern"
    message: "Do not use MODE_WORLD_READABLE or MODE_WORLD_WRITEABLE to access SharedPreferences, always use MODE_PRIVATE. EncryptedSharedPreferences is recommended for additional security."
    metadata:
      category: security
      technology: android
    severity: ERROR
    patterns:
      - pattern: getSharedPreferences(..., $MODE)
      - metavariable-regex:
          metavariable: $MODE
          regex: .*(?:MODE_WORLD_READABLE|MODE_WORLD_WRITEABLE).*
