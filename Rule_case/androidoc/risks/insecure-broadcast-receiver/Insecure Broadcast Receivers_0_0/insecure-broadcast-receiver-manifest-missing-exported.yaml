rules:
- id: insecure-broadcast-receiver-manifest-missing-exported
  languages:
    - xml
  message: "A Broadcast Receiver declaration was detected in AndroidManifest.xml that contained an <intent-filter> but did not explicitly set the android:exported attribute. Due to the presence of the intent-filter, the default android:exported value is \"true\", which may result in external calls. If this is unintentional, set android:exported=\"false\" in the Receiver."
  name: "Unsafe Broadcast Receiver (android:exported is not explicitly specified in the Manifest)"
  paths:
    include:
      - '**/AndroidManifest.xml'
  patterns:
    - pattern: |
        <receiver ...>
          ...
          <intent-filter ...> ... </intent-filter>
          ...
        </receiver>
    - pattern-not: |
        <receiver ... android:exported=$EXPORTED ...>
          ...
        </receiver>
  severity: WARNING
