  - id: log-info-disclosure-sensitive-parameter-kotlin
    languages: [kotlin]
    message: >-
      A Kotlin parameter whose name identifies sensitive data is logged directly
      or through a local alias. Remove or redact the value before logging.
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-532
    patterns:
      - pattern-either:
          - pattern: Log.$LOG_METHOD($TAG, $SENSITIVE)
          - pattern: Timber.$LOG_METHOD($SENSITIVE, ...)
          - pattern: $LOGGER.$LOG_METHOD($SENSITIVE, ...)
          - pattern: $LOG_METHOD($SENSITIVE)
          - pattern: |
              val $ALIAS = $SENSITIVE
              ...
              Log.$LOG_METHOD($TAG, $ALIAS)
          - pattern: |
              val $ALIAS = $SENSITIVE
              ...
              $LOGGER.$LOG_METHOD($ALIAS, ...)
          - pattern: |
              val $ALIAS = $SENSITIVE
              ...
              $LOG_METHOD($ALIAS)
      - metavariable-regex:
          metavariable: $SENSITIVE
          regex: (?i)^[A-Za-z0-9_$]*(?:password(?:hash)?|passwd|passphrase|credential|secret|authorization|bearer|token|credit_?card|card(?:_?(?:number|no))?|cvv|ssn|date_?of_?birth|dob|email|phone|account_?id|session_?(?:id|token)|cookie|imei|imsi|device_?id|user_?id|username|address)$
      - metavariable-regex:
          metavariable: $LOG_METHOD
          regex: (?i)^(?:v|d|i|w|e|wtf|log|debug|trace|info|warn|error|fatal|audit|record)(?:[A-Za-z0-9_$]*)$
