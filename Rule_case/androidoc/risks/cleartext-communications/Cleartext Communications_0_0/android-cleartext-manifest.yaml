rules:
  - id: android-cleartext-manifest
    languages:
      - xml
    message: |
      The <application> tag in AndroidManifest.xml contains the attribute android:usesCleartextTraffic="true" , ​​which allows cleartext network communication and may result in data being monitored or tampered with by the network.
    metadata:
      impact: "Unencrypted network traffic may be intercepted or tampered with by attackers, posing the risk of data leakage."
      references:
        - https://developer.android.com/training/articles/security-config
    paths:
      include:
        - '**/AndroidManifest.xml'
    pattern-either:
      - pattern: <application ... android:usesCleartextTraffic="true" ... />
      - pattern: <application ... android:usesCleartextTraffic="true" ...> ... </application>
    severity: ERROR
