rules:
- id: xml-broadcast-sticky-permission
  languages:
  - xml
  message: "\u5728 AndroidManifest.xml \u4E2D\u67E5\u627E\u5230 BROADCAST_STICKY \u6743\
    \u9650\u7684\u58F0\u660E\uFF0C\u8BE5\u6743\u9650\u4F1A\u5141\u8BB8\u5E94\u7528\
    \u4F7F\u7528 sticky broadcasts\uFF0C \u8BF7\u786E\u8BA4\u662F\u5426\u771F\u6B63\
    \u9700\u8981\u8BE5\u6743\u9650\uFF0C\u5E76\u6CE8\u610F\u5176\u53EF\u80FD\u5F15\
    \u53D1\u7684\u6388\u6743\u5B89\u5168\u95EE\u9898\u3002"
  pattern: <uses-permission android:name="android.permission.BROADCAST_STICKY" ... />
  severity: INFO
