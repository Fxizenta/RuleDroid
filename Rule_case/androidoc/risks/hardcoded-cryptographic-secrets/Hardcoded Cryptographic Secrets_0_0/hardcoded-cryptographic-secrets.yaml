rules:
  - id: hardcoded-cryptographic-secret
    languages: [java]
    message: >-
      A hard-coded byte sequence is used as a cryptographic key. Generate and store
      keys with Android Keystore, or derive password-based keys with a salted,
      work-factored KDF.
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-321
    pattern-either:
      - pattern: new SecretKeySpec("...".getBytes(...), $ALGORITHM)
      - pattern: new SecretKeySpec("...".getBytes(), $ALGORITHM)
      - pattern: new SecretKeySpec(new byte[] { ... }, $ALGORITHM)
      - pattern: |
          $KEY = "...";
          ...
          new SecretKeySpec($KEY.getBytes(...), $ALGORITHM);
      - pattern: |
          $KEY = "...";
          ...
          new SecretKeySpec($KEY.getBytes(), $ALGORITHM);

  - id: hardcoded-initialization-vector
    languages: [java]
    message: >-
      A hard-coded initialization vector is reused. Generate a fresh unpredictable
      IV/nonce for every encryption operation and store it alongside the ciphertext.
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-329
    pattern-either:
      - pattern: new IvParameterSpec("...".getBytes(...))
      - pattern: new IvParameterSpec("...".getBytes())
      - pattern: new IvParameterSpec(new byte[] { ... })
      - pattern: new IvParameterSpec(new byte[$SIZE])
      - pattern: |
          $IV = "...";
          ...
          new IvParameterSpec($IV.getBytes(...));
      - pattern: |
          $IV = "...";
          ...
          new IvParameterSpec($IV.getBytes());
