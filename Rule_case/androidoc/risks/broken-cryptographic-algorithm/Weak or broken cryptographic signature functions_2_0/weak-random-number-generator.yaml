rules:
  - id: weak-random-number-generator
    pattern: SecureRandom.getInstance("SHA1PRNG")
    message: >
      Explicit SHA1PRNG selection can produce provider-dependent behavior and has a
      history of Android compatibility issues. Prefer the platform default
      SecureRandom constructor unless a specific approved provider is required.
    languages:
      - java
    severity: WARNING
    metadata:
      cwe: CWE-327
      owasp: A3:2017-Sensitive Data Exposure
    references:
      - https://developer.android.com/reference/java/security/SecureRandom
      - https://developer.android.com/training/articles/security-gms-provider
