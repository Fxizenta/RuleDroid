rules:
  - id: android-custom-permission
    languages:
      - xml
    message: >
      Custom permission is defined without specifying a protection level or with insufficient protection. 
      This could lead to security issues. Consider using existing permissions where appropriate or 
      define protection level with at least 'signature' protection level.
    severity: WARNING
    patterns:
      - pattern-either:
          - patterns:
              - pattern: <permission ... android:name=$PERMISSION_NAME ... />
              - pattern-not: <permission ... android:protectionLevel=$LEVEL ... />
          - pattern: <permission ... android:name=$PERMISSION_NAME ... android:protectionLevel="normal" ... />
    metadata:
      cwe: CWE-732
      owasp-mobile: M3
      masvs: auth-3
      reference: >
        https://developer.android.com/guide/topics/permissions/defining
    paths:
      include: ["**/AndroidManifest.xml"]
