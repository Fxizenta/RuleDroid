rules:
  - id: android-external-storage-sensitive-file-storage
    languages:
      - java
      - kotlin
    name: Android Data Storage - External Storage Sensitive File Storage
    message: >-
      Storing potentially sensitive data (for example, data with keywords such as "password", "secret", or "key" in the file name) in external storage is risky because external storage is world-readable and writable. Make sure to store only non-sensitive information, or encrypt and perform necessary input validation measures for sensitive data.
    metadata:
      category: security
      technology: android
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: new File($OBJ.getExternalFilesDir($ARGS), $FILENAME)
          - pattern: new File(Environment.getExternalStorageDirectory(), $FILENAME)
          - pattern: new java.io.File($OBJ.getExternalFilesDir($ARGS), $FILENAME)
          - pattern: new java.io.File(Environment.getExternalStorageDirectory(), $FILENAME)
          - pattern: new File($OBJ.getExternalFilesDir($ARGS) + $FILENAME)
          - pattern: new File(Environment.getExternalStorageDirectory() + $FILENAME)
          - pattern: new File(Environment.getExternalStoragePublicDirectory($ARGS), $FILENAME)
      - metavariable-regex:
          metavariable: $FILENAME
          regex: (?i)^"[^"]*(?:password|passwd|secret|private[_-]?key|api[_-]?key|token|credential)[^"]*"$
