rules:
  - id: specify-provider-only-with-android-keystore
    languages:
      - java
    message: >-
      A JCA/JCE provider is selected explicitly. Android recommends provider
      selection only when accessing AndroidKeyStore; otherwise request the
      algorithm and let the platform choose an up-to-date implementation.
    metadata:
      category: security
      technology: android
    patterns:
      - pattern-either:
          - pattern: KeyGenerator.getInstance($ALGORITHM, $PROVIDER)
          - pattern: KeyPairGenerator.getInstance($ALGORITHM, $PROVIDER)
          - pattern: KeyFactory.getInstance($ALGORITHM, $PROVIDER)
          - pattern: SecretKeyFactory.getInstance($ALGORITHM, $PROVIDER)
          - pattern: Cipher.getInstance($ALGORITHM, $PROVIDER)
          - pattern: Mac.getInstance($ALGORITHM, $PROVIDER)
          - pattern: Signature.getInstance($ALGORITHM, $PROVIDER)
          - pattern: MessageDigest.getInstance($ALGORITHM, $PROVIDER)
          - pattern: SecureRandom.getInstance($ALGORITHM, $PROVIDER)
      - metavariable-regex:
          metavariable: $PROVIDER
          regex: '^(?!"AndroidKeyStore"$).+'
    severity: WARNING
