rules:
- id: android-keystore-user-authentication
  languages:
    - java
  message: |
    This key is explicitly configured for use without user authentication. For
    sensitive key operations, require authentication and choose an appropriate
    authentication type and validity policy.
  metadata:
    cwe: 'CWE-287: Improper Authentication'
    owasp: 'M5: Insufficient Cryptography'
  severity: WARNING
  pattern: $BUILDER.setUserAuthenticationRequired(false)
