rules:
  - id: android-keystore-biometric-enrollment
    languages:
      - java
    message: This key remains valid after new biometric enrollment. Set invalidatedByBiometricEnrollment to true when enrollment changes must revoke access.
    metadata:
      cwe: 'CWE-287: Improper Authentication'
      owasp: 'M5: Insufficient Cryptography'
    examples:
      - code: |
          KeyGenParameterSpec.Builder builder = new KeyGenParameterSpec.Builder(KEY_ALIAS,
              KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
            .setBlockModes(KeyProperties.BLOCK_MODE_CBC)
            .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_PKCS7)
            .setUserAuthenticationRequired(true)
            .setInvalidatedByBiometricEnrollment(false)
            .build();
        config:
          - key: KEY_ALIAS
          - purpose: KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT
          - block_mode: KeyProperties.BLOCK_MODE_CBC
          - padding: KeyProperties.ENCRYPTION_PADDING_PKCS7
    pattern: $BUILDER.setInvalidatedByBiometricEnrollment(false)
    severity: WARNING
