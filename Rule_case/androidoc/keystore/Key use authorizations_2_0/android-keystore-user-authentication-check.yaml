rules:
  - id: android-keystore-user-authentication-check
    languages:
      - java
    message: Ensure that the key's user authentication requirement is enforced by secure hardware.
    patterns:
      - pattern: |
          $KEY_INFO.isUserAuthenticationRequirementEnforcedBySecureHardware();
      - pattern-not: |
          // Add any specific cases to exclude, e.g., test code or mock implementations.
    severity: INFO
    metadata:
      references:
        - https://developer.android.com/reference/android/security/keystore/KeyInfo#isUserAuthenticationRequirementEnforcedBySecureHardware
      tags:
        - security
        - android
        - keystore