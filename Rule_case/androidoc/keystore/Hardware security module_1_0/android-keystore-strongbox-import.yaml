rules:
  - id: android-keystore-strongbox-import
    languages: [java]
    message: A key requests StrongBox-backed storage. Handle StrongBoxUnavailableException and provide an acceptable fallback where device support is optional.
    severity: INFO
    metadata:
      category: security-control
      references:
        - https://developer.android.com/privacy-and-security/keystore
    pattern: $BUILDER.setIsStrongBoxBacked(true)
