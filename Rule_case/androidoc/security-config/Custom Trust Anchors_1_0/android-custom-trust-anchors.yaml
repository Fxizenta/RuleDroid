rules:
  - id: android-custom-trust-anchors
    languages:
      - xml
    message: "Custom trust anchor configuration detected. Please ensure that custom CAs (such as @raw resource references) are carefully audited to avoid introducing security risks."
    paths:
      include:
        - '**/*.xml'
    pattern: '<certificates src="@raw/$CERT"/>'
    pattern-inside: |
      <trust-anchors>
        ...
      </trust-anchors>
    severity: WARNING
