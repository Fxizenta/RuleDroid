rules:
  - id: android-keystore-hmac
    languages: [java]
    message: HMAC initialized with a key loaded from Android Keystore is present.
    severity: INFO
    metadata:
      category: security-control
    patterns:
      - pattern: $KEYSTORE.getKey($ALIAS, null)
      - pattern-inside: |
          $KEY = (SecretKey) $KEYSTORE.getKey($ALIAS, null);
          ...
          $MAC.init($KEY);
