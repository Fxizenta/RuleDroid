rules:
  - id: google_play_integrity_api_usage
    languages: [java]
    message: >
      This code uses the Google Play Integrity API. Ensure that best practices are followed,
      such as minimizing API queries, using a NONCE for verification, and complementing Play Integrity
      with other security measures.
    metadata:
      cwe: cwe-353
      masvs: resilience-1
      owasp-mobile: m8
      reference: >
        https://developer.android.com/google/play/integrity
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05j-Testing-Resiliency-Against-Reverse-Engineering.md#testing-root-detection-mstg-resilience-1
    pattern: $MANAGER.requestIntegrityToken(...)
    severity: INFO
