rules:
  - id: google_play_integrity_api_error_handling
    languages:
      - java
    message: IntegrityErrorException is swallowed without recovery or reporting. Handle the failure without exposing sensitive details and fail closed where integrity is required.
    severity: WARNING
    metadata:
      cwe: cwe-209
      masvs: resilience-1
      owasp-mobile: m7
      reference: https://developer.android.com/google/play/integrity
    pattern: |
      try {
        ...
      } catch (IntegrityErrorException $X) {
      }
