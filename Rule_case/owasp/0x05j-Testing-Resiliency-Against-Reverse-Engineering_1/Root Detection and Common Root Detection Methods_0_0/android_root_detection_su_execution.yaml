rules:
  - id: android_root_detection_su_execution
    languages:
      - java
    message: "Detects attempts to execute 'su' commands, which are commonly used to check for rooted devices."
    metadata:
      cwe: cwe-919
      masvs: resilience-1
      owasp-mobile: m8
    severity: INFO
    patterns:
      - pattern: 'Runtime.getRuntime().exec("su")'
