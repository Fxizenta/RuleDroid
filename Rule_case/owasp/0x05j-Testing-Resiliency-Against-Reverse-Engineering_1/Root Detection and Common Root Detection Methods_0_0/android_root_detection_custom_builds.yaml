rules:
  - id: android_root_detection_custom_builds
    languages:
      - java
    message: Detects checks for custom Android builds or test builds using 'Build.TAGS', which may indicate a rooted device.
    metadata:
      cwe: cwe-919
      masvs: resilience-1
      owasp-mobile: m8
    severity: INFO
    patterns:
      - pattern: |
          Build.TAGS.contains("test-keys")
