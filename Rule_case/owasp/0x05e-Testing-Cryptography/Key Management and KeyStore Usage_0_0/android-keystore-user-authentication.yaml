rules:
- id: android-keystore-missing-user-authentication
  languages:
  - java
  message: "Review this Android Keystore key: no user-authentication requirement was found in the containing method. Sensitive keys should call setUserAuthenticationRequired(true)."
  metadata:
    references:
    - https://developer.android.com/reference/android/security/keystore/KeyGenParameterSpec.Builder#setUserAuthenticationRequired(boolean)
  patterns:
  - pattern: new KeyGenParameterSpec.Builder(...)
  - pattern-not-inside: |
      $RET $METHOD(...) {
        ...
        $BUILDER.setUserAuthenticationRequired(true);
        ...
      }
  severity: WARNING
