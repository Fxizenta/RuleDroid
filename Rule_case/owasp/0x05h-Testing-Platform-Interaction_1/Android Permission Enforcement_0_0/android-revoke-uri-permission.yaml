rules:
- id: android-revoke-uri-permission
  languages:
  - java
  message: Ensure 'revokeUriPermission' is used to revoke permissions when no longer
    needed.
  patterns:
  - pattern: 'revokeUriPermission($URI, $MODE);

      '
  - pattern-not-inside: "if ($CONDITION) {\n  revokeUriPermission($URI, $MODE);\n\
      }\n"
  severity: INFO
