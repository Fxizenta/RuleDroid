rules:
  - id: MSTG-STORAGE-5.1
    languages:
      - xml
    message: The keyboard cache is not disabled on text inputs that process sensitive data.
    severity: WARNING
    metadata:
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      owasp-mobile: M2
      category: security
      area: storage
      verification-level:
        - L1
        - L2
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05d-Testing-Data-Storage.md#determining-whether-the-keyboard-cache-is-disabled-for-text-input-fields-mstg-storage-5
    paths:
      include:
        - '**/res/**/*.xml'
    pattern-regex: '(?is)<(?:[A-Za-z0-9_.]+\.)?EditText\b(?=[^>]*android:id\s*=\s*["''][^"'']*(?:password|passwd|pwd|secret|token|seed|otp|pin|credit.?card|api.?key|private.?key)[^"'']*["''])(?![^>]*android:inputType\s*=\s*["''][^"'']*(?:textPassword|numberPassword|textWebPassword|textNoSuggestions)[^"'']*["''])[^>]*>'
