rules:
  - id: MSTG-STORAGE-5.2
    languages:
      - java
    message: The keyboard cache is not disabled on text inputs that process sensitive data.
    severity: WARNING
    metadata:
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      owasp-mobile: M2
      category: security
      area: storage
      verification-level:
        - L1
        - L2
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05d-Testing-Data-Storage.md#determining-whether-the-keyboard-cache-is-disabled-for-text-input-fields-mstg-storage-5
    patterns:
      - pattern-either:
          - pattern: $FIELD.setInputType($TYPE)
          - pattern: $FIELD.setRawInputType($TYPE)
      - metavariable-regex:
          metavariable: $FIELD
          regex: (?i)^[A-Za-z0-9_$]*(?:password|passwd|pwd|secret|token|seed|otp|pin|credit.?card|api.?key|private.?key)[A-Za-z0-9_$]*$
      - metavariable-regex:
          metavariable: $TYPE
          regex: '^(?!.*(?:TYPE_TEXT_VARIATION_PASSWORD|TYPE_NUMBER_VARIATION_PASSWORD|TYPE_TEXT_VARIATION_WEB_PASSWORD|TYPE_TEXT_FLAG_NO_SUGGESTIONS)).+$'
