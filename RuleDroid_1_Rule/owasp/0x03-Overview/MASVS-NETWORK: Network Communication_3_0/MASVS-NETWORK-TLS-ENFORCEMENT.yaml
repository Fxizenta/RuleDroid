rules:
  - id: MASVS-NETWORK-TLS-ENFORCEMENT
    languages:
      - xml
    message: Detected potential use of cleartext traffic. Ensure TLS is enforced for all network communication.
    severity: ERROR
    metadata:
      category: security
      description: Ensure all network communication uses TLS and avoid cleartext traffic.
      references:
        - https://developer.android.com/training/articles/security-config.html
    pattern-not-inside: '<domain-config cleartextTrafficPermitted="false" />'
    patterns:
      - pattern: '<domain-config cleartextTrafficPermitted="true" />'
      - pattern: 'android:usesCleartextTraffic="true"'