rules:
  - id: android_root_detection_custom_builds
    languages:
      - java
    message: Detects checks for custom Android builds or test builds using 'Build.TAGS', which may indicate a rooted device.
    metadata:
      cwe: cwe-919
      masvs: resilience-1
      owasp-mobile: m8
    severity: ERROR
    patterns:
      - pattern: |
          Build.TAGS.contains("test-keys")
      - pattern-not-inside: |
          // Ignore cases where 'Build.TAGS' checks are unrelated to root detection
          if ($CONDITION) {
              ...
          }