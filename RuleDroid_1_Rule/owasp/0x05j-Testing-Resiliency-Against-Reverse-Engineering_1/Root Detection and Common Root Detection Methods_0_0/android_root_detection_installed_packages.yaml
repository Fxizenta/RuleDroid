rules:
  - id: android_root_detection_installed_packages
    languages:
      - java
    message: Detects checks for installed packages of popular rooting tools.
    metadata:
      cwe: cwe-919
      masvs: resilience-1
      owasp-mobile: m8
    patterns:
      - pattern: packageManager.getInstalledPackages(...)
      - pattern-inside: |
          if ($PACKAGE_NAME.equals("com.thirdparty.superuser") ||
              $PACKAGE_NAME.equals("eu.chainfire.supersu") ||
              $PACKAGE_NAME.equals("com.noshufou.android.su") ||
              $PACKAGE_NAME.equals("com.koushikdutta.superuser") ||
              $PACKAGE_NAME.equals("com.zachspong.temprootremovejb") ||
              $PACKAGE_NAME.equals("com.ramdroid.appquarantine") ||
              $PACKAGE_NAME.equals("com.topjohnwu.magisk")) {
              ...
          }
      - pattern-not-inside: |
          // Ignore cases where package checks are unrelated to root detection
          if ($CONDITION) {
              ...
          }
    severity: ERROR