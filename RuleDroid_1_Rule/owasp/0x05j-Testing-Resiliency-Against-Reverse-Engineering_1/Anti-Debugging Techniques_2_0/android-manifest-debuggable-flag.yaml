rules:
  - id: android-manifest-debuggable-flag
    languages:
      - xml
    message: >
      Detects the presence of `android:debuggable="true"` in the Android Manifest file.
      This flag enables debugging and may indicate tampering.
    severity: WARNING
    paths:
      include:
        - "**/AndroidManifest.xml"
    pattern: '<application ... android:debuggable="true" ...>'
    pattern-not-inside: |
      <!-- Ignore cases where the debuggable flag is explicitly documented -->
      <!-- Debuggable flag is set for testing purposes -->