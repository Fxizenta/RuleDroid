rules:
  - id: google_play_integrity_api_device_integrity_check
    languages:
      - java
    message: Ensure that the device integrity check is properly implemented and null values are handled to avoid bypassing security checks.
    severity: ERROR
    metadata:
      cwe: cwe-693
      masvs: resilience-1
      owasp-mobile: m8
      reference: https://developer.android.com/google/play/integrity
    patterns:
      - pattern: |
          if ($RESPONSE.getDeviceIntegrity() == "MEETS_DEVICE_INTEGRITY") {
              ...
          }
      - pattern-not: |
          if ($RESPONSE.getDeviceIntegrity() == null) {
              ...
          }
      - pattern-not-inside: |
          @Test
          /*
          if ($RESPONSE.getDeviceIntegrity() == null) {
              ...
          }
          */