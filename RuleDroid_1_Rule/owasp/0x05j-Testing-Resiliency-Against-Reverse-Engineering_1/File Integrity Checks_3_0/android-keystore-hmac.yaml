rules:
  - id: android-keystore-hmac
    languages:
      - java
    message: "HMAC generation using Android Keystore detected. Ensure compatibility with API level 23+."
    metadata:
      cwe: CWE-312
      owasp-mobile: M5
    patterns:
      - pattern: |
          KeyStore $KS = KeyStore.getInstance("AndroidKeyStore");
          
          $KS.load(null);
          
          SecretKey $KEY = (SecretKey) $KS.getKey($ALIAS, null);
          
          Mac $MAC = Mac.getInstance($ALGORITHM);
          
          $MAC.init($KEY);
          
          byte[] $HMAC = $MAC.doFinal($DATA);
      - pattern-not: |
          // Ignore debug or test code
          System.out.println($HMAC);
    severity: WARNING