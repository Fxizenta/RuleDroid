rules:
- id: android-manifest-service-permission
  languages:
  - xml
  message: Service permissions should be explicitly defined to restrict access.
  metadata:
    category: Security
    technology: Android
  patterns:
  - pattern: "<service\n    android:name=$NAME\n    android:permission=$PERMISSION\
      \ />\n"
  - pattern-not-inside: "<!-- Ignore services with default permissions -->\n<service\n\
      \    android:name=$NAME\n    android:permission=\"android.permission.BIND_JOB_SERVICE\"\
      \ />\n"
  severity: INFO
