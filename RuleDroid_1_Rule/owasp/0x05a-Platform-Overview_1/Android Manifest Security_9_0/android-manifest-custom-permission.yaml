rules:
- id: android-manifest-custom-permission
  languages: [xml]
  message: "Custom permissions should follow the principle of least privilege and be clearly defined."
  metadata:
    category: Security
    technology: Android
  patterns:
    - pattern: '<uses-permission android:name=$PERMISSION/>'
    - pattern-not: '<!-- Ignore standard Android permissions --> <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
  severity: INFO