rules:
  - id: android-manifest-min-sdk-version
    languages: 
      - xml
    message: "Ensure that the minSdkVersion is set to a value (>= 23) for proper compatibility and security updates."
    severity: ERROR
    metadata:
      category: Best Practices
      technology: Android
    patterns:
      - pattern: '<uses-sdk android:minSdkVersion="$VERSION"/>'
      - metavariable-comparison:
          metavariable: $VERSION
          comparison: int($VERSION) < 23
    pattern-not:
      - pattern: |
          <!-- Ignore configurations for legacy devices -->
          <uses-sdk android:minSdkVersion="16"/>