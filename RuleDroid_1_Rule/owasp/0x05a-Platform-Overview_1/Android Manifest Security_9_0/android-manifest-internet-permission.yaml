rules:
  - id: android-manifest-internet-permission
    languages:
      - xml
    message: The INTERNET permission is declared. Ensure it is necessary and does not introduce security risks.
    metadata:
      category: Security
      technology: Android
    patterns:
      - pattern: |
          <uses-permission android:name="android.permission.INTERNET" />
      - pattern-not-inside: |
          <!-- Ignore permissions declared in test configurations -->
          <application android:debuggable="true">
            <uses-permission android:name="android.permission.INTERNET" />
          </application>
    severity: INFO