rules:
- id: android-manifest-activity-permission
  languages:
  - xml
  message: Activity permissions should be explicitly defined to restrict access.
  metadata:
    category: Security
    technology: Android
  patterns:
  - pattern: "<activity\n    android:name=$NAME\n    android:permission=$PERMISSION\
      \ />\n"
  - pattern-not-inside: "<!-- Ignore activities with default permissions -->\n<activity\n\
      \    android:name=$NAME\n    android:permission=\"android.permission.INTERNET\"\
      \ />\n"
  severity: ERROR
