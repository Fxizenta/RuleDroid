rules:
  - id: android-shared-user-id
    languages:
      - xml
    message: >
      The `android:sharedUserId` attribute is used to share a sandbox between apps.
      Ensure that this configuration is necessary and secure, as it can lead to data
      leakage or privilege escalation if misused.
    metadata:
      category: App Sandbox
      reference: https://developer.android.com/guide/topics/manifest/manifest-element#uid
    severity: WARNING
    pattern: '<manifest ... android:sharedUserId=$USER_ID ...>'
    pattern-not-inside: |
      <!-- Ignore cases where sharedUserId is explicitly documented as safe -->
      <!-- Example: <manifest android:sharedUserId="android.uid.safe" /> -->