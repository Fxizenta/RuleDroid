rules:
- id: android-key-auth-duration
  languages:
    - java
  message: "Limit the time a key remains accessible after unlocking to a reasonable duration (<= 30 seconds)."
  metadata:
    category: Key Protection
    cwe: cwe-320
    owasp-mobile: m5
  severity: WARNING
  patterns:
    - pattern: |
        new KeyGenParameterSpec.Builder($KEY_NAME, $PURPOSE)
            .setUserAuthenticationValidityDurationSeconds($DURATION)
    - metavariable-regex:
         metavariable: $DURATION
         regex: "^(3[1-9]|[4-9]\\d+)$"