rules:
  - id: android-lock-screen-check
    languages:
      - java
    message: Ensure the device has a secure lock screen (using isKeyguardSecure or isDeviceSecure) before creating keys.
    severity: INFO
    metadata:
      category: Lock Screen Security
      cwe: cwe-287
      owasp-mobile: m5
    patterns:
      # Detect insecure keyguard checks using isKeyguardSecure (or its absence)
      - pattern: |
          KeyguardManager $KM = (KeyguardManager) $CONTEXT.getSystemService(Context.KEYGUARD_SERVICE);
          if (!$KM.isKeyguardSecure()) {
            ...
          }
      # Detect insecure keyguard checks using isDeviceSecure (or its absence)
      - pattern: |
          KeyguardManager $KM = (KeyguardManager) $CONTEXT.getSystemService(Context.KEYGUARD_SERVICE);
          if (!$KM.isDeviceSecure()) {
            ...
          }
      # Exclude cases that properly check the secure lock screen state
      - pattern-not-inside: |
          if ($KM.isKeyguardSecure()) {
            ...
          }
      - pattern-not-inside: |
          if ($KM.isDeviceSecure()) {
            ...
          }