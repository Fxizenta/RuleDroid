rules:
- id: android-keystore-user-authentication-required
  languages:
  - java
  message: Keys must be created with `setUserAuthenticationRequired(true)` for enhanced
    security.
  pattern-not: "new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)\n    .setUserAuthenticationRequired(false)\n"
  patterns:
  - pattern: "new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)\n    .setUserAuthenticationRequired($AUTH_REQUIRED)\n"
  severity: ERROR
