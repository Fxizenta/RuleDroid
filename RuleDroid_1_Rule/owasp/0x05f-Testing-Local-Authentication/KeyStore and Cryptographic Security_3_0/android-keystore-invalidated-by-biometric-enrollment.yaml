rules:
- id: android-keystore-invalidated-by-biometric-enrollment
  languages:
    - java
  message: "Keys must be created with setInvalidatedByBiometricEnrollment(true) for enhanced security."
  severity: ERROR
  # Flag code where a KeyGenParameterSpec.Builder is used without explicitly calling
  # .setInvalidatedByBiometricEnrollment(true)
  pattern: |
    new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
  pattern-not: |
    .setInvalidatedByBiometricEnrollment(true)