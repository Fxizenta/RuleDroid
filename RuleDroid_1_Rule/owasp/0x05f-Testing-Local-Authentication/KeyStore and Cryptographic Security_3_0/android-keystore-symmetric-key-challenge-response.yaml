rules:
- id: android-keystore-symmetric-key-challenge-response
  languages:
  - java
  message: Symmetric keys should be used with a challenge-response protocol for authentication.
  pattern-inside: "$CLASS {\n    $METHOD {\n        $ALGORITHM = \"AES\";\n    }\n\
    }\n"
  pattern-not-inside: "$CLASS {\n    $METHOD {\n        $PARAMS.contains(\"PURPOSE_SIGN\"\
    );\n    }\n}\n"
  patterns:
  - pattern: 'KeyGenerator.getInstance($ALGORITHM, $KEYSTORE).init($PARAMS)

      '
  severity: WARNING
