rules:
- id: android-keystore-asymmetric-key-signing
  languages: [java]
  message: "非对称密钥签名时应使用 KeyPairGenerator，并在参数中包含 PURPOSE_SIGN 以及使用随机 nonce 防止重放攻击。"
  severity: WARNING
  pattern: |
    KeyPairGenerator.getInstance($ALGORITHM, "AndroidKeyStore").init($PARAMS);
  pattern-inside: |
    class $CLASS {
      void $METHOD(...) {
        $ALGORITHM = "RSA";
      }
    }
  pattern-not:
    - "$PARAMS.contains(\"PURPOSE_SIGN\")"
    - "$PARAMS.contains(\"nonce\")"