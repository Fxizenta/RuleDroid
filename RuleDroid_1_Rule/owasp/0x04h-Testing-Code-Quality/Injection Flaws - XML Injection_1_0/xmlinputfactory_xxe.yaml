rules:
  - id: xmlinputfactory_xxe
    languages:
      - java
    message: >-
      XML external entities are not explicitly disabled for this XMLInputFactory.
      This could be vulnerable to XML external entity vulnerabilities.
      Explicitly disable external entities by setting "javax.xml.stream.isSupportingExternalEntities" to false.
    metadata:
      cwe: CWE-611
      masvs: Platform-2
      owasp-mobile: M8
    options:
      vardef_assign: true
    patterns:
      - pattern-not-inside: |
          $RETURNTYPE $METHOD(...) {
            ...
            $XMLFACTORY.setProperty("javax.xml.stream.isSupportingExternalEntities", false);
            ...
          }
      - pattern-not-inside: |
          $RETURNTYPE $METHOD(...) {
            ...
            $XMLFACTORY.setProperty(java.xml.stream.XMLFactoryInput.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
            ...
          }
      - pattern-either:
          - pattern: $XMLFACTORY = $W.newFactory(...);
          - pattern: $XMLFACTORY = new XMLInputFactory(...);
    severity: ERROR