rules:
  - id: intent-untrusted-html
    fix: "Sanitize and encode the HTML data before adding it to the Intent. Avoid passing untrusted user input directly."
    languages: [java]
    message: "Potential XSS vulnerability: Intent contains untrusted HTML data that may be rendered in WebView."
    metadata:
      category: security
      technology: android
    severity: ERROR
    patterns:
      - pattern: $INTENT.putExtra("html", $HTML)
      - pattern-not: $HTML = "<html><body>Safe Content</body></html>"
      - metavariable-regex:
          metavariable: $HTML
          regex: ".*userInput.*"