rules:
  - id: webview-javascript-untrusted-input
    languages:
      - java
    message: "Potential XSS vulnerability: JavaScript code executed in WebView may include untrusted user input."
    severity: WARNING
    metadata:
      category: security
      technology: android
    fix: "Ensure the JavaScript code is properly sanitized and does not include untrusted user input. Use predefined and safe JavaScript functions."
    patterns:
      - pattern: '$WEBVIEW.loadUrl("javascript:$JS_CODE")'
      - pattern-not-inside: '$JS_CODE = "safeFunction()"'
      - metavariable-regex:
          metavariable: $JS_CODE
          regex: ".*userInput.*"