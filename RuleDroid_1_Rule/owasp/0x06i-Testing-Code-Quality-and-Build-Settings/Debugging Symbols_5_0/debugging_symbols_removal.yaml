rules:
- id: debugging_symbols_removal
  languages:
  - generic
  message: Debugging symbols should be removed from release builds to prevent leaking
    sensitive information about the code. Ensure that unnecessary metadata and debug
    symbols are stripped out.
  metadata:
    area: code
    category: security
    owasp-mobile: M9
    references:
    - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05i-Testing-Code-Quality-and-Build-Settings.md#testing-for-debugging-symbols-mstg-code-3
    verification-level:
    - L2
  pattern-not-inside: "debug {\n  ...\n}\n"
  patterns:
  - pattern-inside: "externalNativeBuild {\n  ...\n}\n"
  - pattern: 'arguments "-fvisibility=hidden"

      '
  severity: ERROR
