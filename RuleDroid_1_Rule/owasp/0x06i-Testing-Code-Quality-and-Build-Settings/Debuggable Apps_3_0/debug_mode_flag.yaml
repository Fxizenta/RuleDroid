rules:
  - id: debug_mode_flag
    languages:
      - java
    message: Debugging flags like DEBUG or DEBUG_MODE should not be enabled in release builds.
    metadata:
      area: code
      category: security
      references:
        - https://developer.android.com/guide/topics/manifest/application-element.html
      verification-level:
        - L2
    patterns:
      - pattern: "if ($DEBUG || $DEBUG_MODE) { ... }"
      - pattern-not-inside: "if (!$DEBUG && !$DEBUG_MODE) { ... }"
    severity: ERROR