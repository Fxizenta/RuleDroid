rules:
  - id: uses-permission-tag-check
    languages:
      - xml
    message: >
      Ensure the custom permission is declared before the <application> tag
      in the manifest to avoid runtime exceptions.
      Verify that the <uses-permission> tag is placed within the <manifest> block
      and is not nested inside the <application> block.
    metadata:
      category: Android Security
      reference: https://developer.android.com/guide/topics/manifest/manifest-intro#filestruct
    pattern-inside: |
      <manifest>
        ...
      </manifest>
    patterns:
      - pattern: '<uses-permission android:name="$PERMISSION_NAME" />'
      - pattern-not-inside: |
          <application>
            ...
          </application>
    severity: INFO