rules:
  - id: android-activity-permission-enforcement
    languages:
      - xml
    message: "Activity does not enforce permissions. Consider adding 'android:permission' attribute to restrict access."
    severity: WARNING
    patterns:
      - pattern: |
          <activity android:name=$ACTIVITY_NAME ...>
      - pattern-not: |
          <activity android:name=$ACTIVITY_NAME ... android:permission=$PERMISSION ...>