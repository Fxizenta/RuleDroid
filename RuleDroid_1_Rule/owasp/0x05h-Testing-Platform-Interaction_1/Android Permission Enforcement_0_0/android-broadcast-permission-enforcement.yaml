rules:
- id: android-broadcast-permission-enforcement
  languages:
  - xml
  message: BroadcastReceiver does not enforce permissions. Consider adding 'android:permission'
    attribute to restrict access.
  patterns:
  - pattern: '<receiver android:name="$RECEIVER_NAME" />

      '
  - pattern-not: '<receiver android:name="$RECEIVER_NAME" android:permission="$PERMISSION"
      />

      '
  severity: WARNING
