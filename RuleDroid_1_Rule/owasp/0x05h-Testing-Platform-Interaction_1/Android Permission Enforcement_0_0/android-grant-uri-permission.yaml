rules:
  - id: android-grant-uri-permission
    languages: [java]
    message: "Ensure 'grantUriPermission' is used securely and only for specific URIs."
    severity: ERROR
    patterns:
      # Match the suspicious usage of grantUriPermission
      - pattern: "grantUriPermission($PACKAGE, $URI, $MODE);"
      # Exclude cases that are within an if statement block regardless of formatting.
      - pattern-not-inside: |
          if ($CONDITION) {
              ...
              grantUriPermission($PACKAGE, $URI, $MODE);
              ...
          }
    metavariable-regex:
      # Ensure that the URI is a specific literal (i.e. not containing wildcards). 
      # This regex enforces that $URI is a string literal not including an asterisk.
      $URI: "^\"(?!.*\\*).*\"$"