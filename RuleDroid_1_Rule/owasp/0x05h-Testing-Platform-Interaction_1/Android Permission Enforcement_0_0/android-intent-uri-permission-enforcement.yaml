rules:
- id: android-intent-uri-permission-enforcement
  languages:
  - java
  message: Ensure URI permissions are properly enforced when using Intent flags.
  patterns:
  - pattern: '$INTENT.setFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);

      '
  - pattern-not-inside: "if ($CONDITION) {\n  $INTENT.setFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION\
      \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\n}\n"
  severity: WARNING
