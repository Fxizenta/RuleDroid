rules:
- id: android-uri-permissions
  languages: [java]
  message: "Ensure that URI permissions are granted with the appropriate flags (e.g., Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION) for fine-grained access control."
  metadata:
    category: Security
    references:
      - https://developer.android.com/reference/android/content/Context.html#grantUriPermission(java.lang.String,android.net.Uri,int)
    technology: Android
  severity: ERROR
  pattern: '$CTX.grantUriPermission($PACKAGE, $URI, $FLAGS)'
  pattern-not-either:
    - pattern: '$CTX.grantUriPermission($PACKAGE, $URI, Intent.FLAG_GRANT_READ_URI_PERMISSION)'
    - pattern: '$CTX.grantUriPermission($PACKAGE, $URI, Intent.FLAG_GRANT_WRITE_URI_PERMISSION)'
    - pattern: '$CTX.grantUriPermission($PACKAGE, $URI, Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION)'