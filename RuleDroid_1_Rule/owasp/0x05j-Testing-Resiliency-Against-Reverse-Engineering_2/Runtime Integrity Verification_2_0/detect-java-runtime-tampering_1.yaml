rules:
  - id: detect-java-runtime-tampering_1
    languages:
      - java
    message: "Detects tampering with the Java runtime, such as Substrate or Xposed hooks."
    metadata:
      category: runtime-integrity-verification
      reference: "Detecting Tampering with the Java Runtime"
    patterns:
      - pattern: |
          try {
            throw new Exception();
          } catch(Exception e) {
            for (StackTraceElement stackTraceElement : e.getStackTrace()) {
              if (stackTraceElement.getClassName().equals($CLASS_NAME)
                  && stackTraceElement.getMethodName().equals($METHOD_NAME)) {
                Log.wtf($LOG_TAG, $LOG_MESSAGE);
              }
            }
          }
      - pattern-not: |
          // Ignore cases where stack trace analysis is used for debugging purposes
          
          Log.d($LOG_TAG, $LOG_MESSAGE);
    severity: ERROR