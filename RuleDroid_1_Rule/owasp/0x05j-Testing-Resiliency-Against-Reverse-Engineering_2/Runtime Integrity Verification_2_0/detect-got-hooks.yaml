rules:
  - id: detect-got-hooks
    languages:
      - c
      - c++
    message: Detects tampering with the Global Offset Table (GOT) or invalid memory locations.
    metadata:
      category: runtime-integrity-verification
      reference: Detecting Native Hooks
    patterns:
      - pattern: |
          if ($GOT_ENTRY != $EXPECTED_VALUE) {
            // GOT entry has been tampered with
            $ACTION;
          }
      - pattern-inside: |
          // Ensure this check is inside a memory integrity verification function
          void verifyMemoryIntegrity() {
            ...
          }
      - pattern-not: |
          // Ignore cases where GOT entry validation is used for non-security purposes
          if ($GOT_ENTRY == null) {
            $ACTION;
          }
    severity: ERROR