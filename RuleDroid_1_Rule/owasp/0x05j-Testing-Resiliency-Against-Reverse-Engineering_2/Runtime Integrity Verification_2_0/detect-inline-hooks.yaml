rules:
  - id: detect-inline-hooks
    languages:
      - java
    message: >
      Detects inline hooks by inspecting function prologues and epilogues for
      suspicious instructions.
    metadata:
      category: runtime-integrity-verification
      reference: Detecting Native Hooks
    patterns:
      - pattern: |
          if ($FUNCTION_PROLOGUE.contains($SUSPICIOUS_INSTRUCTION) || $FUNCTION_EPILOGUE.contains($SUSPICIOUS_INSTRUCTION)) {
            // Inline hook detected
            $ACTION;
          }
      - pattern-inside: |
          // Ensure this check is inside a function integrity verification block
          void verifyFunctionIntegrity() {
            ...
          }
      - pattern-not: |
          // Ignore cases where suspicious instructions are part of legitimate debugging tools
          if ($FUNCTION_PROLOGUE.contains("NOP") || $FUNCTION_EPILOGUE.contains("NOP")) {
            $ACTION;
          }
    severity: ERROR