rules:
- fix_suggestion: Validate the URL using a proper validation function (e.g., isValidUrl(url)).
    Prompt the user for confirmation before executing critical actions (e.g., showConfirmationDialog()).
  id: custom-url-schemes-validation
  languages:
  - java
  message: 'Custom URL schemes should validate all URL parameters and discard malformed
    URLs. Ensure critical actions triggered by URLs prompt user confirmation.

    '
  metadata:
    area: platform
    authors:
    - Security Audit Expert
    category: security
    references:
    - https://developer.android.com/training/app-links
    - https://owasp.org/www-project-mobile-top-10/
  paths:
    include:
    - '**/*.java'
  patterns:
  - pattern: "@Override\npublic boolean shouldOverrideUrlLoading(WebView view, String\
      \ url) {\n    if (url.startsWith(\"$SCHEME\")) {\n        ...\n    }\n}\n"
  - metavariable-regex:
      metavariable: $SCHEME
      regex: ^(http|https|customscheme)$
  - pattern-not: "if (isValidUrl(url)) {\n    ...\n}\n"
  - pattern-not: 'showConfirmationDialog(...);

      '
  severity: WARNING
