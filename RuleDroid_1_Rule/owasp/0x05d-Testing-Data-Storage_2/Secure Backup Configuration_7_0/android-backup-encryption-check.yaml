rules:
  - id: android-backup-encryption-check
    languages:
      - xml
    message: "Ensure backups are encrypted if `android:allowBackup=\"true\"` is enabled."
    metadata:
      area: backup
      authors:
        - Security Audit Expert
      category: security
    paths:
      include:
        - "**/AndroidManifest.xml"
    pattern: '<application ... android:allowBackup="true" ... />'
    pattern-not: '<application ... android:backupAgent="com.example.EncryptedBackupAgent" ... />'
    references:
      - https://developer.android.com/guide/topics/data/autobackup.html
    severity: ERROR