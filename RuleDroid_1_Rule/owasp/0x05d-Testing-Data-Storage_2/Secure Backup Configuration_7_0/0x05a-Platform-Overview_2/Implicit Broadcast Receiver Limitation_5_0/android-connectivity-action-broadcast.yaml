rules:
  - id: android-connectivity-action-broadcast
    languages: [java]
    message: >
      Apps targeting Android 7.0 (API level 24) or higher no longer receive CONNECTIVITY_ACTION
      broadcasts unless registered dynamically with Context.registerReceiver().
    severity: WARNING
    patterns:
      - pattern: '$RECEIVER.registerReceiver($RECEIVER_NAME, new IntentFilter("android.net.conn.CONNECTIVITY_CHANGE"));'
      - pattern-not: '$RECEIVER.registerReceiver($RECEIVER_NAME, new IntentFilter("android.net.conn.CONNECTIVITY_CHANGE"), $PERMISSION, null);'