rules:
  - id: android-network-state-changed-action
    languages: [java]
    message: >
      Beginning with Android 9 (API level 28), NETWORK_STATE_CHANGED_ACTION broadcasts
      no longer include sensitive information like location or personally identifiable data.
    severity: ERROR
    patterns:
      - pattern: "$RECEIVER.registerReceiver($RECEIVER_NAME, new IntentFilter(\"android.net.conn.NETWORK_STATE_CHANGED_ACTION\"))"
      - pattern-not: "$RECEIVER.registerReceiver($RECEIVER_NAME, new IntentFilter(\"android.net.conn.NETWORK_STATE_CHANGED_ACTION\"), $PERMISSION, null)"