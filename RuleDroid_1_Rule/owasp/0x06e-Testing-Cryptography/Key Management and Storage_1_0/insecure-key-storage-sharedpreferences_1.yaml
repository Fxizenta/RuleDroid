rules:
- id: insecure-key-storage-sharedpreferences_1
  languages:
  - java
  message: Avoid storing sensitive keys in SharedPreferences. Use Android KeyStore
    for secure storage.
  metadata:
    category: security
    technology: android
  patterns:
  - pattern: 'SharedPreferences sharedPreferences = $X.getSharedPreferences($Y, $Z);

      sharedPreferences.edit().putString($KEY, $VALUE).apply();

      '
  - pattern-not-inside: '$X.getSharedPreferences($Y, $Z).edit().putString($KEY, encrypt($VALUE)).apply();

      '
  severity: ERROR
