rules:
  - id: insecure-key-storage-property-files
    languages:
      - java
    message: Avoid storing sensitive keys in property files without proper protection. Use Android KeyStore for secure storage.
    severity: ERROR
    metadata:
      category: security
      technology: android
    pattern: |
      Properties properties = new Properties();
      properties.setProperty($KEY, $VALUE);
      properties.store(new FileOutputStream($FILE), $COMMENT);
    pattern-not-inside: |
      encrypt($VALUE);