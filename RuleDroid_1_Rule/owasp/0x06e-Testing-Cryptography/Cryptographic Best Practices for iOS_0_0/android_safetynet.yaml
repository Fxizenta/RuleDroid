rules:
  - id: android_safetynet
    languages:
      - java
    message: >-
      This app does not use SafetyNet Attestation API that provides cryptographically-signed attestation,
      assessing the device's integrity. This check helps to ensure that the servers are interacting with
      the genuine app running on a genuine Android device.
    pattern-either:
      - pattern: |
          import com.google.android.gms.safetynet.SafetyNetApi;
      - pattern: |
          $S = SafetyNet.getClient(...);
          ...
          $T = $S.attest(...);
      - pattern: |
          new RNGoogleSafetyNetPackage(...);
    severity: INFO
    metadata:
      cwe: cwe-353
      masvs: resilience-1
      owasp-mobile: m8
      reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05j-Testing-Resiliency-Against-Reverse-Engineering.md#testing-root-detection-mstg-resilience-1