rules:
  - id: detect-ptrace-deny-attach
    languages:
      - java
    message: "Usage of PTRACE_DENY_ATTACH detected. This may be an anti-debugging technique."
    metadata:
      cwe: cwe-532
      owasp-mobile: m8
    severity: ERROR
    patterns:
      - pattern: |
          ptrace(31, 0, 0, 0); // PTRACE_DENY_ATTACH
      - pattern-not: |
          // This is a comment explaining ptrace usage