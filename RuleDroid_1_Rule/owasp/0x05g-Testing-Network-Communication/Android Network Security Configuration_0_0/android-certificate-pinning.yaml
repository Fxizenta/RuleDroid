rules:
  - id: android-certificate-pinning
    languages:
      - xml
    message: Certificate pinning is configured. Verify the pinning hashes are correct and up-to-date.
    paths:
      include:
        - '*.xml'
    pattern: |
      <pin-set>
        <pin digest="SHA-256">$PIN</pin>
      </pin-set>
    severity: ERROR