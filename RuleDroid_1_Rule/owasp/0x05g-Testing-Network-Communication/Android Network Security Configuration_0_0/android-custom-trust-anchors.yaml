rules:
  - id: android-custom-trust-anchors
    languages:
      - xml
    message: Custom trust anchors are configured. Ensure these are necessary and secure.
    paths:
      include:
        - '*.xml'
    pattern-regex: '<trust-anchors>\\s*<certificates\\s+src="user"\\s*/>\\s*</trust-anchors>'
    severity: INFO