rules:
  - id: secure-salt-generation
    languages: 
      - java
    message: Ensure salt is generated using SecureRandom and then properly stored (e.g., not in locations subject to Android backup). Validate that the salt value is generated via SecureRandom().nextBytes(...)
    severity: ERROR
    metadata:
      references:
        - https://developer.android.com/reference/java/security/SecureRandom
    patterns:
      - pattern: new SecureRandom()
      - pattern-not-inside: $SALT = new SecureRandom().nextBytes($ARRAY);