rules:
  - id: pbkdf2-key-derivation
    languages:
      - java
    message: >
      Ensure PBKDF2 is used with a secure iteration count (>= 10000) and a non-null salt
      to generate strong encryption keys.
    metadata:
      references:
        - https://developer.android.com/reference/javax/crypto/spec/PBEKeySpec
    severity: ERROR
    patterns:
      - pattern: new PBEKeySpec($PASSWORD, $SALT, $ITERATION_COUNT, $KEY_LENGTH)
      - pattern-not-inside: |
          if ($ITERATION_COUNT >= 10000 && $SALT != null) {
              new PBEKeySpec($PASSWORD, $SALT, $ITERATION_COUNT, $KEY_LENGTH);
          }