rules:
- id: android-keystore-user-authentication
  languages:
  - java
  message: Ensure user authentication is required for sensitive key operations to
    enhance security. Consider adding a validity duration.
  metadata:
    references:
    - https://developer.android.com/reference/android/security/keystore/KeyGenParameterSpec.Builder#setUserAuthenticationRequired(boolean)
  patterns:
  - pattern: '$BUILDER.setUserAuthenticationRequired(true)

      '
  - pattern-not-inside: '$BUILDER.setUserAuthenticationValidityDurationSeconds($DURATION)

      '
  severity: WARNING
