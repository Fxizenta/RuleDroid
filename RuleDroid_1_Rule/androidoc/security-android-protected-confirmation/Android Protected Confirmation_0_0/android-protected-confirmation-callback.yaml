rules:
- id: android-protected-confirmation-callback
  languages:
  - java
  - kotlin
  message: >
    Ensure that the ConfirmationCallback is implemented correctly, including handling 
    onConfirmed, onDismissed, onCanceled, and onError methods.
  metadata:
    cwe: 'CWE-306: Missing Authentication for Critical Function'
    category: security
    technology: android
  severity: ERROR
  patterns:
  - pattern-either:
    # 匹配所有回调方法被正确实现的类
    - pattern: |
        public class $CLASS_NAME extends ConfirmationCallback {
            @Override
            public void onConfirmed(@NonNull byte[] dataThatWasConfirmed) {
                ...
            }
            @Override
            public void onDismissed() {
                ...
            }
            @Override
            public void onCanceled() {
                ...
            }
            @Override
            public void onError(Throwable e) {
                ...
            }
        }
    # 检测部分方法未被实现的类
    - pattern: |
        public class $CLASS_NAME extends ConfirmationCallback {
            ...
        }
  pattern-not:
    # 排除所有方法正确实现且逻辑完整的安全场景
    - pattern: |
        public class $CLASS_NAME extends ConfirmationCallback {
            @Override
            public void onConfirmed(@NonNull byte[] dataThatWasConfirmed) {
                super.onConfirmed(dataThatWasConfirmed);
                // Proper logic here
            }
            @Override
            public void onDismissed() {
                super.onDismissed();
                // Proper logic here
            }
            @Override
            public void onCanceled() {
                super.onCanceled();
                // Proper logic here
            }
            @Override
            public void onError(Throwable e) {
                super.onError(e);
                // Proper logic here
            }
        }
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  fix: |
    Ensure all methods of ConfirmationCallback are implemented correctly:
    ```java
    public class MyConfirmationCallback extends ConfirmationCallback {
        @Override
        public void onConfirmed(@NonNull byte[] dataThatWasConfirmed) {
            super.onConfirmed(dataThatWasConfirmed);
            // Handle confirmation logic
        }
        @Override
        public void onDismissed() {
            super.onDismissed();
            // Handle dismissal logic
        }
        @Override
        public void onCanceled() {
            super.onCanceled();
            // Handle cancellation logic
        }
        @Override
        public void onError(Throwable e) {
            super.onError(e);
            // Handle error logic
        }
    }
    ```
