rules:
- id: android-certificate-pinning
  languages:
  - xml
  message: 'Certificate pinning detected. Ensure that multiple backup pins are included,
    and the expiration period is sufficiently short to prevent compatibility issues.
    Refer to the Network Security Config documentation for best practices.

    '
  metadata:
    cwe: CWE-295
    owasp: MSTG-NETWORK-1
  patterns:
  - pattern: "<network-security-config>\n  ...\n  <domain-config>\n    ...\n    <pin-set\
      \ expiration=\"$EXPIRATION\">\n      <pin digest=\"$DIGEST\">$PIN</pin>\n  \
      \    ...\n    </pin-set>\n    ...\n  </domain-config>\n  ...\n</network-security-config>\n"
  - pattern-not: '<domain-config cleartextTrafficPermitted="true">

      '
  references:
  - https://developer.android.com/training/articles/security-config#CertificatePinning
  severity: INFO
