rules:
- id: use-content-uri
  languages:
    - java
  message: When sharing data, use content:// URIs, not file:// URIs.
  metadata:
    cwe: CWE-200
    category: security
    technology:
      - android
  severity: ERROR
  patterns:
    - pattern-either:
      - pattern: Uri.parse("file://$URI")
      - pattern: Uri.parse("file:/")
      - pattern: Uri.fromFile($FILE)
      - pattern: new Uri("file://$URI")
    - pattern-inside: |
        Intent $INTENT = new Intent($ACTION, $URI);
    - pattern-not: Uri.parse("content://$URI")
    - pattern-not: FileProvider.getUriForFile(...)
  metavariable-pattern:
    metavariable: $URI
    pattern: '.*'
