rules:
- id: android-missing-uri-permission-flags
  languages:
  - java
  message: 'When sharing data via an Intent with a content:// URI, temporary URI permissions
    must be provided using FLAG_GRANT_READ_URI_PERMISSION or FLAG_GRANT_WRITE_URI_PERMISSION.

    '
  metadata:
    category: security
    technology: android
  patterns:
  - pattern: '$INTENT.putExtra($KEY, Uri.parse("content://$URI"))

      '
  - pattern-not: '$INTENT.setFlags(..., FLAG_GRANT_READ_URI_PERMISSION, ...)

      '
  - pattern-not: '$INTENT.setFlags(..., FLAG_GRANT_WRITE_URI_PERMISSION, ...)

      '
  - pattern-not: '$INTENT.addFlags(..., FLAG_GRANT_READ_URI_PERMISSION, ...)

      '
  - pattern-not: '$INTENT.addFlags(..., FLAG_GRANT_WRITE_URI_PERMISSION, ...)

      '
  severity: WARNING
