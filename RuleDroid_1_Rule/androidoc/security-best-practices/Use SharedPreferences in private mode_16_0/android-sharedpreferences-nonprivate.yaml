rules:
  - id: android-sharedpreferences-nonprivate
    languages:
      - java
      - kotlin
    message: "Please make sure to specify MODE_PRIVATE (or 0, which is equivalent) when using getSharedPreferences() to ensure that only the current application can access it. In appropriate scenarios, it is recommended to use EncryptedSharedPreferences."
    metadata:
      category: security
      technology: android
    severity: WARNING
    pattern: getSharedPreferences(..., $MODE)
    pattern-not:
      - pattern: getSharedPreferences(..., MODE_PRIVATE)
      - pattern: getSharedPreferences(..., Context.MODE_PRIVATE)
      - pattern: getSharedPreferences(..., android.content.Context.MODE_PRIVATE)
      - pattern: getSharedPreferences(..., 0)
      - pattern: getSharedPreferences(..., 0x0)