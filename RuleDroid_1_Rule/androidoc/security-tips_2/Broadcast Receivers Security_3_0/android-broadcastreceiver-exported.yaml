rules:
- id: android-broadcastreceiver-exported
  languages:
  - xml
  message: BroadcastReceiver is exported by default. Consider setting `android:exported`
    to `false` if not intended for external use.
  metadata:
    cwe: CWE-200
    owasp: 'M1: Improper Platform Usage'
  path: AndroidManifest.xml
  patterns:
  - pattern: '<receiver android:name="$RECEIVER" />

      '
  - pattern-not: '<receiver android:name="$RECEIVER" android:exported="false" />

      '
  - pattern-not: '<receiver android:name="$RECEIVER" android:exported="true" />

      '
  severity: ERROR
