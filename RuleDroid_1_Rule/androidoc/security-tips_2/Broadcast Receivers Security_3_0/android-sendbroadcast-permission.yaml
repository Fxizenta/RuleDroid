rules:
- id: android-sendbroadcast-permission
  languages:
  - java
  - kotlin
  message: Consider specifying a permission when sending a broadcast to restrict which
    receivers can receive the broadcast.
  metadata:
    cwe: CWE-200
    owasp: 'M1: Improper Platform Usage'
  patterns:
  - pattern: 'sendBroadcast($INTENT)

      '
  - pattern-not: 'sendBroadcast($INTENT, $PERMISSION)

      '
  severity: ERROR
