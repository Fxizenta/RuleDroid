rules:
- id: android-send-broadcast-missing-permission
  languages:
  - java
  message: |
      `sendBroadcast()` is called without specifying a permission. 
      Consider specifying a permission to restrict unauthorized receivers.
  metadata:
    category: security
    references:
    - https://developer.android.com/reference/android/content/Context#sendBroadcast(android.content.Intent)
  severity: WARNING
  patterns:
    # 检测未指定权限的 sendBroadcast() 调用
    - pattern: |
        $CONTEXT.sendBroadcast($INTENT);
    # 排除已指定权限的调用
    - pattern-not: |
        $CONTEXT.sendBroadcast($INTENT, $PERMISSION);
