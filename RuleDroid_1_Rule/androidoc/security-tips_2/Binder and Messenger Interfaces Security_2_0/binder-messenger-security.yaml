rules:
  - id: binder-messenger-security
    languages:
      - java
    message: Ensure that Binder or Messenger interfaces implement proper permission checks using checkCallingPermission() or equivalent.
    metadata:
      area: platform
      authors:
        - Your Name
      category: security
      references:
        - https://developer.android.com/reference/android/os/Binder
        - https://developer.android.com/reference/android/os/Messenger
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS extends Binder {
                @Override
                public $RET_TYPE $METHOD($ARGS) {
                  ...
                }
              }
          - pattern: |
              class $CLASS extends Messenger {
                @Override
                public void handleMessage(Message msg) {
                  ...
                }
              }
          - pattern: |
              class $CLASS extends Handler {
                @Override
                public void handleMessage(Message msg) {
                  ...
                }
              }
      - pattern-inside: |
          @Override
          public $RET_TYPE $METHOD($ARGS) {
            if ($CONTEXT.checkCallingPermission($PERMISSION) != PackageManager.PERMISSION_GRANTED) {
              throw new SecurityException("Permission denied");
            }
            ...
          }
      - pattern-inside: |
          @Override
          public void handleMessage(Message msg) {
            if ($CONTEXT.checkCallingPermission($PERMISSION) != PackageManager.PERMISSION_GRANTED) {
              throw new SecurityException("Permission denied");
            }
            ...
          }
      - pattern-inside: |
          @Override
          public $RET_TYPE $METHOD($ARGS) {
            if ($CONTEXT.checkCallingOrSelfPermission($PERMISSION) != PackageManager.PERMISSION_GRANTED) {
              throw new SecurityException("Permission denied");
            }
            ...
          }
      - pattern-inside: |
          @Override
          public void handleMessage(Message msg) {
            if ($CONTEXT.checkPermission($PERMISSION, 0, 0) != PackageManager.PERMISSION_GRANTED) {
              throw new SecurityException("Permission denied");
            }
            ...
          }
    metavariable-pattern:
      metavariable: $CONTEXT
      pattern: |
        this
      # Ensure that the context is explicitly defined (e.g., `this`, `getApplicationContext()`, etc.)
    variables:
      CONTEXT: |
        android.content.Context
      PERMISSION: |
        java.lang.String
