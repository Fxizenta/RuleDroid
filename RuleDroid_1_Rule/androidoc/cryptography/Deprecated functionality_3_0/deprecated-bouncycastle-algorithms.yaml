rules:
  - id: deprecated-bouncycastle-algorithms
    languages:
      - java
    message: >
      The application uses deprecated or insecure Bouncy Castle algorithms. 
      Avoid using weak algorithms like DESede, MD5, or SHA-1. 
      Consider using secure alternatives such as AES, SHA-256, or SHA-3.
    severity: ERROR
    patterns:
      # 检测对 Bouncy Castle 库的使用
      - pattern: |
          import org.bouncycastle.$CLASS;
      - metavariable-pattern:
          metavariable: $CLASS
          patterns:
            - pattern: >
                DESedeEngine
            - pattern: >
                MD5Digest
            - pattern: >
                SHA1Digest
            - pattern: >
                RC4Engine
            - pattern: >
                DSA
            - pattern: >
                RSA
      # 额外检测算法类的实例化
      - pattern: |
          new org.bouncycastle.crypto.$CLASS()
      - metavariable-pattern:
          metavariable: $CLASS
          patterns:
            - pattern: >
                DESedeEngine
            - pattern: >
                MD5Digest
            - pattern: >
                SHA1Digest
            - pattern: >
                RC4Engine
            - pattern: >
                DSA
            - pattern: >
                RSA
      # 检测 Cipher 对象使用弱加密算法
      - pattern: |
          Cipher.getInstance("$ALGORITHM");
      - metavariable-pattern:
          metavariable: $ALGORITHM
          patterns:
            - pattern: "DESede"
            - pattern: "MD5"
            - pattern: "SHA1"
            - pattern: "RC4"
            - pattern: "DSA"
            - pattern: "RSA"
      # 检测 MessageDigest 使用弱算法
      - pattern: |
          MessageDigest.getInstance("$ALGORITHM");
      - metavariable-pattern:
          metavariable: $ALGORITHM
          patterns:
            - pattern: "MD5"
            - pattern: "SHA1"
      # 检测 Mac 对象使用弱算法
      - pattern: |
          Mac.getInstance("$ALGORITHM");
      - metavariable-pattern:
          metavariable: $ALGORITHM
          patterns:
            - pattern: "DESede"
            - pattern: "MD5"
            - pattern: "SHA1"
            - pattern: "RC4"
      # 检测 Signature 使用弱算法
      - pattern: |
          Signature.getInstance("$ALGORITHM");
      - metavariable-pattern:
          metavariable: $ALGORITHM
          patterns:
            - pattern: "MD5withRSA"
            - pattern: "SHA1withRSA"
            - pattern: "DSA"
    metadata:
      category: security
      cwe: "CWE-327" # Use of a Broken or Risky Cryptographic Algorithm
      references:
        - "https://www.bouncycastle.org/"
        - "https://owasp.org/www-community/vulnerabilities/Use_of_a_Broken_or_Risky_Cryptographic_Algorithm"
    fix: |
      Replace deprecated algorithms with secure alternatives:
      - Use AES instead of DESede.
      - Use SHA-256 or SHA-3 instead of MD5 or SHA-1.
      Example:
      ```java
      import org.bouncycastle.crypto.engines.AESEngine;
      ```
