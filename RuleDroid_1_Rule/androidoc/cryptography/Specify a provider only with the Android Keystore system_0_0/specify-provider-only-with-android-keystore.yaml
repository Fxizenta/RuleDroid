rules:
  - id: specify-provider-only-with-android-keystore
    languages:
      - java
    message: Specify a provider only with the Android Keystore system.
    metadata:
      category: security
      technology: android
    options:
      autofix: false
      vardef_assign: true
    patterns:
      - pattern: |
          $GENERATOR = KeyGenerator.getInstance($ALGORITHM, $PROVIDER);
      - pattern-not: |
          $GENERATOR = KeyGenerator.getInstance($ALGORITHM, "AndroidKeyStore");
      - pattern-not-inside: |
          try {
              $GENERATOR = KeyGenerator.getInstance($ALGORITHM, $PROVIDER);
          } catch (NoSuchAlgorithmException | NoSuchProviderException e) {
              // Handle exception
          }
      - metavariable-type:
          metavariable: $GENERATOR
          type: KeyGenerator
      - metavariable-type:
          metavariable: $ALGORITHM
          type: String
      - metavariable-type:
          metavariable: $PROVIDER
          type: String
    severity: ERROR