rules:
- id: android_providerinstaller_sync_missing_try_catch
  languages:
  - java
  - kotlin
  message: "\u540C\u6B65\u8C03\u7528 ProviderInstaller.installIfNeeded \u9700\u8981\
    \u5728 try-catch \u8BED\u53E5\u4E2D\u4F7F\u7528\uFF0C \u4EE5\u4FBF\u59A5\u5584\
    \u5904\u7406 GooglePlayServicesRepairableException \u548C GooglePlayServicesNotAvailableException\
    \ \u5F02\u5E38\u3002\n"
  metadata:
    cwe: N/A
    masvs: resilience-1
    owasp-mobile: M8
    reference: https://developer.android.com/training/articles/security-gms-provider
  patterns:
  - pattern: ProviderInstaller.installIfNeeded($ARGS)
  - pattern-not-inside: "try {\n  ...\n  ProviderInstaller.installIfNeeded($ARGS);\n\
      \  ...\n} catch (GooglePlayServicesRepairableException | GooglePlayServicesNotAvailableException\
      \ $EX) {\n  ...\n}\n"
  severity: ERROR
