rules:
  - id: android-keystore-cipher-initialization
    languages:
      - java
    message: Ensure that the key is authenticated through FingerprintManager or BiometricPrompt before use.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              SecretKey $KEYSPEC = (SecretKey) keyStore.getKey($KEY_ALIAS, null);
              if ($MODE == Cipher.ENCRYPT_MODE || $MODE == Cipher.DECRYPT_MODE) {
                  cipher.init($MODE, $KEYSPEC);
              }
          - pattern: |
              SecretKey $KEYSPEC = (SecretKey) keyStore.getKey($KEY_ALIAS, null);
              cipher.init($MODE, $KEYSPEC);

      # 确保认证方法在代码块内
      - pattern-inside: |
          if ($AUTH_METHOD.authenticate($ARGS)) {
              ...
          }

      # 避免误报: 认证方法后，cipher.init() 但不使用 KEY
      - pattern-not: |
          cipher.init($MODE);
