rules:
- id: android-keystore-strongbox-check
  languages:
  - java
  message: Check if the key is stored inside secure hardware and handle StrongBoxUnavailableException.
  metadata:
    references:
    - https://developer.android.com/training/articles/keystore#HardwareSecurityModule
  patterns:
  - pattern: "SecretKeyFactory factory = SecretKeyFactory.getInstance($ALGORITHM,\
      \ \"AndroidKeyStore\");\nKeyInfo keyInfo = (KeyInfo) factory.getKeySpec($KEY,\
      \ KeyInfo.class);\nif (!keyInfo.isInsideSecureHardware()) {\n    throw new StrongBoxUnavailableException(\"\
      StrongBox Keymaster is not available.\");\n}\n"
  - pattern-not: "if (keyInfo.isInsideSecureHardware()) {\n    // Handle secure hardware\
      \ case\n}\n"
  severity: INFO
