rules:
- id: android-keystore-strongbox
  languages:
  - java
  message: Ensure that StrongBox is used for key generation in the Android KeyStore.
  metadata:
    references:
    - https://developer.android.com/training/articles/keystore#HardwareSecurityModule
  patterns:
  - pattern: "$GENERATOR = KeyGenerator.getInstance($ALGORITHM, \"AndroidKeyStore\"\
      );\n$GENERATOR.init(new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)\n\
      \    .setBlockModes($BLOCK_MODE)\n    .setEncryptionPaddings($PADDING)\n   \
      \ .setIsStrongBoxBacked(true)\n    .build());\n$GENERATOR.generateKey();\n"
  - pattern-not: "$GENERATOR.init(new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)\n\
      \    .setBlockModes($BLOCK_MODE)\n    .setEncryptionPaddings($PADDING)\n   \
      \ .setIsStrongBoxBacked(false)\n    .build());\n"
  severity: INFO
