rules:
- id: android-require-user-authentication-key-use
  languages:
  - java
  message: 'When generating or importing a key in the Android Keystore using KeyGenParameterSpec.Builder,
    ensure that user authentication is enforced by calling either setUserAuthenticationRequired(true)
    or setUserAuthenticationParameters(...). These calls must be part of the builder
    chain to guarantee the key can only be used after proper authentication.

    '
  metadata:
    documentation: Refer to Android security best practices for key generation and
      user authentication.
    impacted_api: KeyGenParameterSpec.Builder
  pattern-either:
  - pattern: "new KeyGenParameterSpec.Builder($ALIAS, $PURPOSES)\n  .setUserAuthenticationRequired(true)\n"
  - pattern: "new KeyGenParameterSpec.Builder($ALIAS, $PURPOSES)\n  .setUserAuthenticationParameters($ARGS)\n"
  severity: ERROR
