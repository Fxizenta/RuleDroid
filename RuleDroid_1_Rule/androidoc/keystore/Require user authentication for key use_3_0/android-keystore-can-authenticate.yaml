rules:
- examples:
  - code: "BiometricPrompt biometricPrompt = new BiometricPrompt.Builder(context)\n\
      \  .setTitle(\"Title\")\n  .setSubtitle(\"Subtitle\")\n  .setDescription(\"\
      Description\")\n  .setNegativeButton(\"Cancel\", context.getMainExecutor(),\
      \ (dialogInterface, i) -> {\n    // Handle cancel\n  }).build();\nif (biometricPrompt.canAuthenticate())\
      \ {\n  // Proceed with authentication\n}\n"
    config:
    - biometric_prompt: biometricPrompt
  id: android-keystore-can-authenticate
  languages:
  - java
  message: Check if the user has set up the required credentials for key authentication.
  metadata:
    cwe: 'CWE-287: Improper Authentication'
    owasp: 'M5: Insufficient Cryptography'
  patterns:
  - pattern: '$BIOMETRIC_PROMPT.canAuthenticate()

      '
  severity: INFO
