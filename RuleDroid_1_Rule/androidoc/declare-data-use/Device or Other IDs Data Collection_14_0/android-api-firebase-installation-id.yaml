rules:
  - id: android-api-firebase-installation-id
    languages:
      - java
    message: >
      Usage of Firebase Installation ID detected. Ensure this is necessary and complies with privacy policies.
      Be mindful of user data and ensure that Firebase Installation IDs are not exposed or logged without user consent.
    severity: INFO
    patterns:
      - pattern: 'import com.google.firebase.installations.FirebaseInstallations;'
      - pattern: 'FirebaseInstallations.getId();'
      - pattern-not: |
          // Exclude cases where Firebase Installation ID is logged for debugging purposes
          Log.$METHOD(FirebaseInstallations.getId());
    metadata:
      category: Android Security
      description: >
        Detects usage of Firebase Installation ID, which is considered sensitive data and should be handled with care.
      remediation: >
        Ensure that Firebase Installation ID is used only when necessary, and that it is not logged or shared without proper user consent.
