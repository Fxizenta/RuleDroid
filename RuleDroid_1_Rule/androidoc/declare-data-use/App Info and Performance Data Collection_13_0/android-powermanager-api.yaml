rules:
  - id: android-powermanager-api
    languages:
      - java
    message: |
      The app uses the PowerManager API, which may access user data related to
      app info and performance. Ensure its usage is justified and does not
      expose sensitive information. If using device idle mode or power save mode,
      ensure these actions do not reveal sensitive user activity or usage patterns.
    metadata:
      category: Android Security
      technology: Android
    severity: INFO
    patterns:
      - pattern: |
          PowerManager $X = $Y.getSystemService(Context.POWER_SERVICE);
      - pattern-not: |
          $X = null;
      - pattern-either:
        - pattern: |
            $X.isDeviceIdleMode()
        - pattern: |
            $X.isPowerSaveMode()
    pattern-not:
      - pattern: |
          // Ensure device idle or power save mode is not used to infer sensitive user behavior.
      - pattern: |
          // This code does not expose sensitive information about device or user activity.
    fix: |
      When using PowerManager, ensure that sensitive user information or device status is not exposed. 
      Use these APIs only when necessary for improving the user experience or conserving battery, and 
      ensure that no sensitive data, such as user activity or location, is inadvertently revealed.
