rules:
  - id: android-collect-name
    languages:
      - java
    message: |
      The app collects the user's name, which is personal information. Ensure the data collection complies with privacy laws and regulations.
    metadata:
      category: Personal Information Data Collection
    severity: INFO
    patterns:
      # 匹配从对象中获取姓名的情况，确保变量命名符合常见用户姓名相关的命名规则
      - pattern: |
          String $NAME = $OBJ.getName();
      # 确保类和变量名与用户相关，如UserProfile或User类
      - pattern-inside: |
          class UserProfile {
            private String name = $OBJ.getName();
            public String getName() {
              return name;
            }
          }
      - pattern-inside: |
          class User {
            private String fullName = $OBJ.getName();
            public String getFullName() {
              return fullName;
            }
          }
      - pattern-inside: |
          class Account {
            private String userName = $OBJ.getName();
            public String getUserName() {
              return userName;
            }
          }
      # 排除硬编码的测试数据或占位符
      - pattern-not: |
          String $NAME = "example";
      - pattern-not: |
          String $NAME = "test";
      - pattern-not: |
          String $NAME = "default";
      - pattern-not: |
          String $NAME = "anonymous";
      # 排除与系统或配置相关的名称（可能不是用户姓名）
      - pattern-not: |
          String $NAME = $OBJ.getSystemName(); 
      - pattern-not: |
          String $NAME = $OBJ.getDeviceName();
      # 排除加密或匿名化的姓名数据
      - pattern-not: |
          String $NAME = anonymize($OBJ.getName());
      - pattern-not: |
          String $NAME = obfuscate($OBJ.getName());
