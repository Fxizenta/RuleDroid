rules:
  - id: android-bind-autofill-service-permission
    languages:
      - xml
    message: >
      The app declares the BIND_AUTOFILL_SERVICE permission, which may access
      user data related to personal information. Ensure that its usage is
      necessary and complies with privacy regulations.
    metadata:
      category: Personal Information Data Collection
      references:
        - "https://developer.android.com/reference/android/Manifest.permission#BIND_AUTOFILL_SERVICE"
      remediation: >
        Review the necessity of using the BIND_AUTOFILL_SERVICE permission.
        Ensure compliance with privacy policies and obtain user consent when necessary.
    severity: INFO
    patterns:
      - pattern: '<uses-permission android:name="android.permission.BIND_AUTOFILL_SERVICE" />'
      - pattern: '<uses-permission\s+android:name="android.permission.BIND_AUTOFILL_SERVICE"\s*/>'
      - pattern-either:
          - pattern: '<uses-permission android:name="android.permission.BIND_AUTOFILL_SERVICE"/>'
          - pattern: '<uses-permission android:name="android.permission.BIND_AUTOFILL_SERVICE" />'
    path: "*/AndroidManifest.xml"
