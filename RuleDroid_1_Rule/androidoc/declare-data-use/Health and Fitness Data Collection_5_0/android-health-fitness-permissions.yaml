rules:
- id: android-health-fitness-permissions
  languages:
  - xml
  message: |
      This app declares a permission related to health and fitness data collection.
      Review the permissions to ensure they are necessary and comply with relevant privacy regulations.
  path: AndroidManifest.xml
  patterns:
    - pattern: '<uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />'
    - pattern: '<uses-permission android:name="android.permission.BODY_SENSORS" />'
    - pattern: '<uses-permission android:name="android.permission.BODY_SENSORS_BACKGROUND" />'
    - pattern: '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
    - pattern: '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
    - pattern: '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />' 
    - pattern: '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'
    - pattern: '<uses-permission android:name="android.permission.READ_PHONE_STATE" />'
  severity: INFO
  metadata:
    category: privacy
    technology: android
  fix: |
    Review the permissions in your app's manifest and ensure they are only requesting the permissions
    that are necessary for the app's functionality. Consider asking for permissions at runtime and 
    explaining their use to the user to maintain transparency.
