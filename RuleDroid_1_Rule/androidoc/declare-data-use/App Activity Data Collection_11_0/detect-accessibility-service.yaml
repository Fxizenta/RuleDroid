rules:
- id: detect-accessibility-service
  languages:
    - java
  message: |
    Usage of AccessibilityService detected. Ensure it is not used to collect sensitive user data without consent.
    Verify that onAccessibilityEvent is implemented securely and does not process sensitive data improperly.
  severity: INFO
  patterns:
    - pattern: |
        class $CLASS extends android.accessibilityservice.AccessibilityService {
          ...
        }
    - pattern-not: |
        @Override
        public void onAccessibilityEvent(AccessibilityEvent $EVENT) {
          ...
        }
  metavariable-pattern:
    metavariable: $EVENT
    regex: (?i)(password|creditcard|sensitive|private|confidential)