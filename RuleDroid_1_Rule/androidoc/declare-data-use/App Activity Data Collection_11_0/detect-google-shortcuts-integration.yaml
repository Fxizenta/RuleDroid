rules:
  - id: detect-google-shortcuts-integration
    languages:
      - java
    message: >
      Google Shortcuts Integration Library detected. Ensure it is not used to collect
      sensitive user data without consent. Review the usage and ensure proper privacy practices.
    severity: INFO
    patterns:
      - pattern: |
          import com.google.android.libraries.appshortcuts.*;
      - pattern-either:
          - pattern: |
              $CLASS $METHOD(...) {
                ... collectSensitiveData(...);
              }
          - pattern: |
              $CLASS $METHOD(...) {
                ... requestUserConsent(...);
              }
          - pattern: |
              $CLASS $METHOD(...) {
                ... requestPermission(...);
              }
      - pattern-not: |
          @Override
          public void onCreate() {
            ...
          }
    fix: |
      If using Google Shortcuts to collect sensitive data, ensure that user consent is explicitly requested 
      before collecting such data. Use secure storage and handle data responsibly, adhering to privacy policies 
      and legal requirements (such as GDPR). Avoid using shortcuts in ways that might expose user data without 
      consent.
