rules:
- id: webview-allow-universal-access-from-file-urls
  languages:
    - java
  message: Avoid enabling universal access from file URLs in WebView.
  severity: ERROR
  patterns:
    - pattern: |
        $W.getSettings().setAllowUniversalAccessFromFileURLs(true)
    - pattern-not: |
        if (BuildConfig.DEBUG) {
          $W.getSettings().setAllowUniversalAccessFromFileURLs(true);
        }
  metavariable-pattern:
    metavariable: $W
    pattern: $W instanceof android.webkit.WebView
  path-suffix: .java
  metadata:
    category: security
    references:
      - https://developer.android.com/reference/android/webkit/WebSettings#setAllowUniversalAccessFromFileURLs(boolean)
    tags:
      - android
      - webview
      - security