rules:
  - id: ANDROID-CONTENT-PROVIDER-PERMISSIONS
    languages:
      - xml
    message: ContentProvider should have proper read and write permissions set.
    metadata:
      category: security
      owasp-mobile: M3
      references:
        - https://developer.android.com/guide/topics/manifest/provider-element
      technology: android
    paths:
      include:
        - '**/AndroidManifest.xml'
    patterns:
      # Match any <provider> tag
      - pattern: |
          <provider ... />
      # Exclude cases where android:readPermission is set to a secure value
      - pattern-not: |
          <provider ... android:readPermission="android.permission.SIGNATURE" ... />
      # Exclude cases where android:writePermission is set to a secure value
      - pattern-not: |
          <provider ... android:writePermission="android.permission.SIGNATURE" ... />
      # Exclude cases where both permissions are securely set
      - pattern-not: |
          <provider ... android:readPermission="android.permission.SIGNATURE" android:writePermission="android.permission.SIGNATURE" ... />
    severity: ERROR