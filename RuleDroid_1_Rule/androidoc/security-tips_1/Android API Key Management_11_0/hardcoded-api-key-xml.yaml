rules:
  - id: hardcoded-api-key-xml
    languages:
      - xml
    message: >
      Hardcoded API key detected in an XML resource file.

      Storing API keys directly in plaintext XML files exposes them to reverse engineering, 
      increasing the risk of credential leakage and unauthorized access. 
      Use secure storage mechanisms such as encrypted preferences, 
      environment variables, or runtime injection via a secrets manager.
    fix: >
      Remove the hardcoded API key from the XML file. 
      Retrieve the API key securely at runtime using encrypted storage or a secure injection mechanism.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp-mobile: "M8: Insecure Data Storage - Hardcoded API Keys"
      references:
        - "https://developer.android.com/studio/publish/app-signing#secure-shared-preferences"
        - "https://cloud.google.com/docs/authentication/api-keys"
      risk: "Risk: Hardcoded API key exposure"
    name: "Risk: Hardcoded API Key in XML"
    paths:
      include:
        - "**/res/values/*.xml"
    patterns:
      - pattern: |
          <string name="$NAME">$API</string>
    pattern-not-inside: |
      <!--
        <string name="$NAME">$API</string>
      -->
    metavariable-regex:
      - metavariable: $NAME
        regex: '(?i)^(api|google|facebook|twitter|auth|client|access|secret|firebase|aws|stripe|azure|github|slack|key|token|password|credentials)(_?(key|id|token|secret))?$'
      - metavariable: $API
        regex: '(?i)^(?![0-9]{10,}$|[a-zA-Z]{10,}$)(?!null$|none$|undefined$)[a-zA-Z0-9_\-]{20,64}$'
    severity: ERROR
