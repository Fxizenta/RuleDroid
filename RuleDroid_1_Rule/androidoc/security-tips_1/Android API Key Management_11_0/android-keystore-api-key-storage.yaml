rules:
- id: android-keystore-api-key-storage
  languages:
  - java
  message: >
    Ensure API keys are stored securely using Android Keystore. Avoid hardcoding keys 
    or storing them in insecure locations.
  severity: INFO
  metadata:
    category: security
    technology: android
    cwe: "CWE-312" # Cleartext Storage of Sensitive Information
    references:
      - "https://developer.android.com/training/articles/keystore"
  patterns:
    # 匹配 Keystore 的初始化
    - pattern: |
        KeyStore keyStore = KeyStore.getInstance("AndroidKeyStore");
        keyStore.load(null);
    # 匹配 KeyGenerator 的使用
    - pattern: |
        KeyGenerator keyGenerator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
        keyGenerator.init(
            new KeyGenParameterSpec.Builder("keyAlias",
                KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                .build());
        SecretKey secretKey = keyGenerator.generateKey();
  patterns-not:
    # 排除可能不安全的实践，如未设置必要参数
    - pattern: |
        KeyGenerator keyGenerator = KeyGenerator.getInstance($ALGORITHM, "AndroidKeyStore");
        keyGenerator.init($CONFIG);
  fix: |
    Use Android Keystore for secure key storage:
    ```java
    KeyStore keyStore = KeyStore.getInstance("AndroidKeyStore");
    keyStore.load(null);

    KeyGenerator keyGenerator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
    keyGenerator.init(
        new KeyGenParameterSpec.Builder("keyAlias",
            KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
            .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
            .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
            .build());
    SecretKey secretKey = keyGenerator.generateKey();
    ```
