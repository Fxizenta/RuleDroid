rules:
  - id: hardcoded-api-key-java
    languages:
      - java
    message: >
      Hardcoded API key, secret, or credential detected in Java source code.

      Hardcoding sensitive keys or tokens directly in source files is insecure and can lead to credential leakage if the app is decompiled.
      Use secure storage methods such as Android Keystore, encrypted SharedPreferences, or environment variable injection.
    fix: >
      Remove the hardcoded API key or secret.
      Retrieve sensitive information securely at runtime using a secrets manager, Android Keystore, or environment variables.
    severity: ERROR
    metadata:
      category: security
      technology: android
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp-mobile: "M8: Code Tampering - Hardcoded API Keys"
      references:
        - "https://developer.android.com/studio/publish/app-signing#secure-shared-preferences"
        - "https://cloud.google.com/docs/authentication/api-keys"
      risk: "Risk: Hardcoded sensitive credentials"
    pattern-either:
      - pattern: |
          $TYPE $X = "$Y";
      - pattern: |
          $X = "$Y";

    pattern-not-regex: "(?i)(localhost|127\\.0\\.0\\.1|test|demo|example|sample|dummy|placeholder|your)"

    pattern-not:
      - pattern: |
          $TYPE $X = System.getenv($ENV);
      - pattern: |
          $TYPE $X = context.getSharedPreferences($PREF, $MODE).getString($KEY, $DEFAULT);
      - pattern: |
          $TYPE $X = SecurePreferences.getString($KEY, $DEFAULT);
      - pattern: |
          $TYPE $X = BuildConfig.$FIELD;
      - pattern: |
          $TYPE $X = properties.getProperty($KEY);
      - pattern: |
          $TYPE $X = getResources().getString($ID);
      - pattern: |
          $TYPE $X = decryptValue($ENCRYPTED);

    metavariable-regex:
      TYPE: '(?i)^(?:final\\s+)?(?:static\\s+)?(?:String|CharSequence)$'
      X: '(?i).*(api_?key|auth_?token|secret|password|credential|token|client_?id|access_?key).*'
      Y: '(?!.*(dummy|example|test|placeholder|your))([A-Za-z0-9_\\-+/=]{16,64})'
