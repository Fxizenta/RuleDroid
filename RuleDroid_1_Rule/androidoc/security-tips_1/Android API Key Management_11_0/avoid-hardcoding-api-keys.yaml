rules:
  - id: avoid-hardcoding-api-keys
    languages:
      - java
    message: Avoid hardcoding API keys in the source code. Use secure storage mechanisms.
    metadata:
      category: security
      technology: android
      remediation: Use secure storage mechanisms such as Android Keystore, environment variables, or encrypted properties files.
      references:
        - https://developer.android.com/training/articles/keystore
        - https://owasp.org/www-community/vulnerabilities/Hardcoded_credentials
    severity: ERROR
    patterns:
      # Main pattern-either to detect different credential formats
      - pattern-either:
          # String variable declarations
          - pattern: String $VAR = "$API_KEY";
          - pattern: final String $VAR = "$API_KEY";
          - pattern: static String $VAR = "$API_KEY";
          - pattern: private String $VAR = "$API_KEY";
          - pattern: public String $VAR = "$API_KEY";
          - pattern: protected String $VAR = "$API_KEY";
          - pattern: static final String $VAR = "$API_KEY";
          - pattern: private static final String $VAR = "$API_KEY";
          - pattern: public static final String $VAR = "$API_KEY";
          
          # Field assignments
          - pattern: this.$VAR = "$API_KEY";
          
          # Common API key methods
          - pattern: $OBJ.setApiKey("$API_KEY");
          - pattern: $OBJ.setKey("$API_KEY");
          - pattern: $OBJ.setToken("$API_KEY");
          - pattern: $OBJ.setSecret("$API_KEY");
          - pattern: $OBJ.setPassword("$API_KEY");
          - pattern: $OBJ.setCredential("$API_KEY");
          
          # AWS specific patterns
          - pattern: new AWSStaticCredentialsProvider(new BasicAWSCredentials("$AWS_ID", "$AWS_SECRET"));
          - pattern: new BasicAWSCredentials("$AWS_ID", "$AWS_SECRET");
          
          # Firebase specific patterns
          - pattern: FirebaseOptions.Builder().setApiKey("$API_KEY");
          - pattern: new FirebaseOptions.Builder().setApiKey("$API_KEY");
    
    # Pattern not section to exclude false positives
    pattern-not:
      - pattern: String $VAR = "example_key";
      - pattern: String $VAR = "test_key";
      - pattern: String $VAR = "placeholder";
      - pattern: String $VAR = "dummy_key";
      - pattern: String $VAR = "mock_key";
      - pattern: String $VAR = "YOUR_API_KEY";
      - pattern: String $VAR = "ENTER_YOUR_KEY_HERE";
      - pattern: String $VAR = "";
      - pattern: String $VAR = null;
      - pattern: String $VAR = BuildConfig.API_KEY;
      - pattern: String $VAR = System.getenv("$ENV");
      - pattern: String $VAR = getResources().getString(R.string.$RES);
    
    # Regex exclusions for common false positives
    pattern-not-regex:
      - '(?i)(example|test|placeholder|dummy|mock|fake|sample|dev|localhost|127\.0\.0\.1|0\.0\.0\.0)'
      - '^[a-z]+$'  # all lowercase letters
      - '^[A-Z]+$'  # all uppercase letters
      - '^[0-9]+$'  # all numbers
      - '^\$\{.*\}$' # template strings
      - '^@string/'  # Android resource references
    
    # Metavariables with improved patterns
    metavariables:
      VAR:
        regex: '(?i).*(api|key|token|secret|password|credential|auth|access).*'
      API_KEY:
        # Match typical API key patterns
        regex: '[A-Za-z0-9+/=_\-]{16,}'
      AWS_ID:
        regex: 'AKIA[A-Z0-9]{16}'
      AWS_SECRET:
        regex: '[A-Za-z0-9/+]{40}'
      OBJ:
        regex: '.+'
      ENV:
        regex: '.+'
      RES:
        regex: '.+'