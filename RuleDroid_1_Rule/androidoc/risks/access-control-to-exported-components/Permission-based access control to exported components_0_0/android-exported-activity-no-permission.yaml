rules:
- id: android-exported-activity-no-permission
  languages:
  - xml
  message: Exported activity without required permission or proper security configuration.
  metadata:
    cwe: CWE-284
    owasp: 'M1: Improper Platform Usage'
  path: AndroidManifest.xml
  severity: ERROR
  patterns:
  - pattern: |
      <activity
        android:name="$ACTIVITY_NAME"
        android:exported="true"
        ...
      />
  - pattern-not: |
      <activity
        android:name="$ACTIVITY_NAME"
        android:exported="true"
        android:permission="$PERMISSION"
        ...
      />
  - pattern-not: |
      <activity
        android:name="$ACTIVITY_NAME"
        android:exported="true"
        android:protectionLevel="signature"
        ...
      />
  - pattern-not: |
      <activity
        android:name="$ACTIVITY_NAME"
        android:exported="true"
        android:protectionLevel="signatureOrSystem"
        ...
      />
  - pattern-not: |
      <activity
        android:name="$ACTIVITY_NAME"
        android:exported="true"
        android:permission="$PERMISSION"
        android:protectionLevel="signature"
        ...
      />