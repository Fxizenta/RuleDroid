rules:
- id: unsafe_hostname_verifier
  languages:
  - java
  message: 'Unsafe HostnameVerifier implementation detected. This implementation does
    not properly validate the server hostname, which may allow a man-in-the-middle
    (MiTM) attack. Use NetworkSecurityConfig.xml to enforce proper TLS security rather
    than bypassing certificate verification.

    '
  metadata:
    cwe: cwe-295
    masvs: network-3
    owasp-mobile: M3
    reference: 'https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05g-Testing-Network-Communication.md#testing-endpoint-identify-verification-mstg-network-3

      '
  patterns:
  - pattern-either:
    - patterns:
      - pattern: "public boolean verify(String $HOST, SSLSession $SESSION) {\n   \
          \ return true;\n}\n"
      - pattern-inside: "class $CLASS implements HostnameVerifier {\n    ...\n}\n"
    - pattern: "new HostnameVerifier() {\n    public boolean verify(String $HOST,\
        \ SSLSession $SESSION) {\n        return true;\n    }\n}\n"
  severity: ERROR
