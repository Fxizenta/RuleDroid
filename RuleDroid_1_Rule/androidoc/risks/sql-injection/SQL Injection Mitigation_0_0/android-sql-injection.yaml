rules:
  - id: android-sql-injection
    languages:
      - java
    message: >-
      Potential SQL Injection vulnerability: The SQL query is constructed using
      string concatenation. Use parameterized queries or prepared statements to bind input
      values and mitigate injection risks.
    metadata:
      cwe: CWE-89
      masvs: MSTG-ARCH-2
      owasp-mobile: M7
      reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws
    pattern-not:
      # 排除简单的字符串拼接，这些通常是安全的
      - pattern: $DB.rawQuery("..." + "..." , ...)
      - pattern: $DB.execSQL("..." + "..." , ...)
      - pattern: $DB.rawQuery("..." + "..." + "..." , ...)
      - pattern: $DB.execSQL("..." + "..." + "..." , ...)
    patterns:
      - pattern-either:
          # 原有模式：检查 rawQuery 和 execSQL 的参数化构造
          - pattern: $DB.rawQuery("..." + $X, ...)
          - pattern: $DB.rawQuery($X + "..." , ...)
          - pattern: $DB.rawQuery("..." + $X + "...", ...)
          - pattern: $DB.execSQL("..." + $X, ...)
          - pattern: $DB.execSQL($X + "..." , ...)
          - pattern: $DB.execSQL("..." + $X + "...", ...)
          
          # 检测使用query方法但传入拼接字符串作为selection参数
          - pattern: $DB.query($TABLE, $PROJ, "..." + $X + "...", ...)
          - pattern: $DB.query($TABLE, $PROJ, $X + "...", ...)
          - pattern: $DB.query($TABLE, $PROJ, "..." + $X, ...)
          
          # 修复的多行模式：检测字符串构造后作为selection参数传递
          - pattern: |
              $SELECTION = "..." + $X + "...";
              ...
              $DB.query($TABLE, $PROJ, $SELECTION, ...);
          - pattern: |
              $SELECTION = $X + "...";
              ...
              $DB.query($TABLE, $PROJ, $SELECTION, ...);
          - pattern: |
              $SELECTION = "..." + $X;
              ...
              $DB.query($TABLE, $PROJ, $SELECTION, ...);
          
          # 修复的多行模式：匹配分配给变量的查询字符串
          - pattern: |
              $QUERY = "..." + $X + "...";
              ...
              $DB.rawQuery($QUERY, ...);
          - pattern: |
              $QUERY = "..." + $X;
              ...
              $DB.rawQuery($QUERY, ...);
          - pattern: |
              $QUERY = $X + "...";
              ...
              $DB.rawQuery($QUERY, ...);
          
          # 匹配涉及数组访问的SQL注入（修复格式）
          - pattern: |
              $QUERY = "..." + $ARRAY[$INDEX] + "...";
              ...
              $DB.rawQuery($QUERY, ...);
          
          # 匹配多次字符串拼接的SQL查询构造（修复格式）
          - pattern: |
              $QUERY = "...";
              ...
              $QUERY = $QUERY + "..." + $VAR + "...";
              ...
              $DB.rawQuery($QUERY, ...);
          - pattern: |
              $QUERY = "...";
              ...
              $QUERY = $QUERY + $VAR + "...";
              ...
              $DB.rawQuery($QUERY, ...);
          
          # 匹配具有+=操作符的查询构造（修复格式）
          - pattern: |
              $QUERY = "...";
              ...
              $QUERY += $VAR;
              ...
              $DB.rawQuery($QUERY, ...);
          - pattern: |
              $QUERY = "...";
              ...
              $QUERY += "..." + $VAR + "...";
              ...
              $DB.rawQuery($QUERY, ...);
          
          # 匹配示例代码中的具体模式（修复格式）
          - pattern: |
              String $QUERY = "SELECT " + $VAR1 + " , " + $VAR2 + " from " + $VAR3 + " WHERE " + $VAR4;
              ...
              $DB.rawQuery($QUERY, ...);
              
          # 检查直接创建的不安全的WHERE子句（修复格式）
          - pattern: |
              String $WHERE = "id = " + $USER_INPUT;
              ...
              $DB.query($TABLE, $PROJ, $WHERE, ...);
          
          # 检查动态构建而不是使用参数绑定的selection参数（修复格式）
          - pattern: |
              String $SELECTION = $COLUMN + " = '" + $VALUE + "'";
              ...
              $DB.query(..., $SELECTION, ...);
              
          # 检测通过字符串格式化构造的查询
          - pattern: String.format("SELECT * FROM %s WHERE %s='%s'", $TABLE, $COLUMN, $VALUE)
          - pattern: String.format("DELETE FROM %s WHERE %s=%d", $TABLE, $COLUMN, $VALUE)
          
          # 检测不安全的表名和列名构造(表名和列名参数化)
          - pattern: $DB.query($USER_INPUT, ...)
          - pattern: $DB.query("...", $USER_INPUT, ...)
          - pattern: |
              $TABLE = $USER_INPUT + "...";
              ...
              $DB.query($TABLE, ...);
          
          # 检查其他SQLite方法
          - pattern: $DB.queryWithFactory(..., "..." + $X + "...", ...)
          - pattern: $DB.rawQueryWithFactory(..., "..." + $X + "...", ...)
    severity: ERROR