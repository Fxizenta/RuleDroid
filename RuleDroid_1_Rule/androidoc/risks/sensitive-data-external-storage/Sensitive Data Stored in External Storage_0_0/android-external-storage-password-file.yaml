rules:
- id: android-external-storage-password-file
  languages:
    - java
    - kotlin
  message: 'Hardcoded file name "password.txt" detected. Storing sensitive information in a cleartext file on external storage can expose confidential data. Consider using internal storage and/or encrypting the data with the Android KeyStore.'
  severity: ERROR
  metadata:
    category: security
    references:
      - "Android Security Tips for Storing Data"
    technology: android
  patterns:
    - pattern: new File($DIR, "password.txt")
    - metavariable-regex:
        metavariable: $DIR
        regex: '.*(getExternalStorageDirectory|getExternalFilesDir|getExternalCacheDir).*'