rules:
  - id: unwanted_object_deserialization
    languages:
      - java
    message: |
      This class implements Serializable or Externalizable but does not properly safeguard deserialization. 
      Implement the readObject method or equivalent safeguards (e.g., readResolve, writeReplace) 
      to prevent unintended deserialization.
    metadata:
      cwe: CWE-502
      masvs: platform-8
      owasp-mobile: m1
      references:
        - https://developer.android.com/reference/java/io/Serializable.html
    severity: WARNING
    patterns:
      # Match classes implementing Serializable or Externalizable
      - pattern-either:
          - pattern: "class $CLASS implements java.io.Serializable { ... }"
          - pattern: "class $CLASS implements java.io.Externalizable { ... }"
      # Exclude classes with valid deserialization safeguards
      - pattern-not-inside: |
          class $CLASS {
            private final void readObject(ObjectInputStream in) throws java.io.IOException {
              throw new java.io.IOException("Cannot be deserialized");
            }
          }
      - pattern-not-inside: |
          class $CLASS {
            private Object readResolve() throws ObjectStreamException {
              // Secure deserialization logic
              ...
            }
          }
      - pattern-not-inside: |
          class $CLASS {
            private Object writeReplace() throws ObjectStreamException {
              // Secure deserialization logic
              ...
            }
          }
      # Exclude abstract classes and interfaces
      - pattern-not: "abstract class $CLASS implements java.io.Serializable { ... }"
      - pattern-not: "interface $CLASS extends java.io.Serializable { ... }"
      # Exclude classes annotated to explicitly allow serialization
      - pattern-not: |
          @SuppressWarnings("serial")
          class $CLASS implements java.io.Serializable {
            ...
          }
