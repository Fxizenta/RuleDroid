rules:
  - id: unsafe_object_deserialization
    languages:
      - java
    message: >
      Unsafe deserialization detected via ObjectInputStream. Ensure that the
      serialized data is validated and that only trusted objects are deserialized.
    metadata:
      cwe: "CWE-502"
      masvs: platform-8
      owasp-mobile: M1
      reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05h-Testing-Platform-Interaction.md#testing-object-persistence-mstg-platform-8
    patterns:
      - pattern: new ObjectInputStream(...)
    severity: ERROR