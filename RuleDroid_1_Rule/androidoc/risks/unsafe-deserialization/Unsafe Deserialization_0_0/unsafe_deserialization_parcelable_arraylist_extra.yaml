rules:
  - id: unsafe_deserialization_parcelable_arraylist_extra
    languages:
      - java
    message: >
      Found usage of getParcelableArrayListExtra without specifying the class explicitly. 
      This can lead to unsafe deserialization. Consider using safer methods introduced 
      in Android 13 (API level 33) for handling parcels, such as 
      getParcelableExtra(java.lang.String, java.lang.Class) and 
      getParcelableArrayListExtra(java.lang.String, java.lang.Class).
    metadata:
      cwe: cwe-502
      masvs: platform-8
      owasp-mobile: m1
      reference: https://developer.android.com/reference/android/os/Parcel#getParcelableArrayListExtra(java.lang.String)
    patterns:
      # Match getParcelableArrayListExtra usage without the class parameter
      - pattern: $X.getParcelableArrayListExtra($Y)
      # Exclude cases using the safer method with class parameter
      - pattern-not: $X.getParcelableArrayListExtra($Y, $Z)
      # Restrict matching to cases where $X is an Intent object
      - metavariable-type:
          metavariable: $X
          type: android.content.Intent
      # Ensure that $Y is a String representing the key for the extra
      - metavariable-type:
          metavariable: $Y
          type: java.lang.String
      # Additional check to match scenarios where the class is not specified
      - pattern: |
          $X.getParcelableArrayListExtra($Y) 
          // Consider refactoring to use getParcelableArrayListExtra($Y, $CLASS) in API level 33+
    pattern-not-inside:
      # Exclude cases where the safer method is used
      - pattern: |
          $X.getParcelableArrayListExtra($Y, $Z)
    severity: ERROR
