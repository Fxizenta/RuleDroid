rules:
- id: unsafe_readparcelable
  languages:
    - java
    - kotlin
  message: |
    Unsafe usage of readParcelable without specifying a Parcelable.Creator.
    Use readParcelable(Class, Parcelable.Creator) (introduced in Android 13) to enforce type safety.
  metadata:
    cwe: CWE-502
    masvs: platform-8
    owasp-mobile: M1
    reference: https://developer.android.com/guide/components/intents-filters#parcelable-safemode
  severity: WARNING
  patterns:
    - pattern-either:
        # 检测 readParcelable 调用，但未提供 Creator
        - pattern: $OBJ.readParcelable($ARG)
    - pattern-not:
        pattern-either:
          # 过滤掉正确的 readParcelable(Class, Parcelable.Creator) 用法
          - pattern: $OBJ.readParcelable($TYPE, $CREATOR)
          # 过滤掉显式 null 传递的情况，避免误报
          - pattern: $OBJ.readParcelable(null)
    - pattern-inside: |
        class $CLASS extends Binder {
            public boolean onTransact(...) {
                ...
            }
        }
    - pattern-inside: |
        public $RET onBind(...) {
            ...
        }
