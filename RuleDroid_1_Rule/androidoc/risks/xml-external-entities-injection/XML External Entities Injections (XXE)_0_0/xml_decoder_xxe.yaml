rules:
  - id: xml_decoder_xxe
    languages:
      - java
    message: |
      Avoid using XMLDecoder to parse untrusted data. 
      Deserializing user input can lead to arbitrary code execution.
      Use an alternative such as SAXParser or DOMParser, and explicitly disable external entities.
    metadata:
      cwe: CWE-611
      masvs: platform-2
      owasp-mobile: M8
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2
    severity: ERROR
    patterns:
      # Match any usage of XMLDecoder
      - pattern: |
          $X $METHOD(...) {
            ...
            new XMLDecoder($INPUT);
            ...
          }
      # Exclude cases where the input is a hardcoded string
      - pattern-not: |
          $X $METHOD(...) {
            ...
            new XMLDecoder("...");
            ...
          }
      # Exclude cases where the input is a hardcoded string assigned to a variable
      - pattern-not: |
          $X $METHOD(...) {
            ...
            String $STR = "...";
            ...
            new XMLDecoder($STR);
            ...
          }
    taint-modes:
      - mode: taint
        pattern-sources:
          # Detect untrusted input sources
          - pattern: |
              $SOURCE = $REQUEST.getParameter(...);
          - pattern: |
              $SOURCE = $REQUEST.getInputStream();
        pattern-sinks:
          # Detect when untrusted input flows into XMLDecoder
          - pattern: |
              new XMLDecoder($SOURCE);