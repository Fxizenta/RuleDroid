rules:
  - id: log-info-disclosure-format-args
    languages:
      - java
    message: "Potential exposure of sensitive data in log format parameters. Avoid including unsanitized dynamic data as format arguments in log calls."
    metadata:
      cwe: cwe-532
      owasp-mobile: M2
      reference: https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05d-Testing-Data-Storage.md#testing-logs-for-sensitive-data-mstg-storage-3
    metavariable-regex:
      $ARG: '^(?!".*"$).*$'
      $LEVEL: '^(e|w|i|d|v|wtf)$'
    pattern: Log.$LEVEL($TAG, $MSG, $ARG, ...)
    severity: ERROR