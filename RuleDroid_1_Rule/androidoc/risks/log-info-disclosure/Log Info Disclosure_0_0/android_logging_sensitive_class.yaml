rules:
- id: android_logging_sensitive_class
  languages:
    - java
  message: Ensure that sensitive data is redacted in the toString() method to avoid accidental logging.
  metadata:
    cwe: cwe-532
    masvs: storage-3
    owasp-mobile: m1
    reference: https://developer.android.com/reference/android/util/Log
  severity: INFO
  patterns:
    - pattern: |
        public class $CLASS {
          ...
          private $TYPE $SENSITIVE_FIELD;
          ...
          public String toString() {
            return $RETURN_VALUE;
          }
        }
    - metavariable-regex:
        metavariable: $SENSITIVE_FIELD
        regex: '.*(password|apiKey|token|ssn|secret).*'
    - pattern-not: |
        public String toString() {
          return "...";
        }
    - pattern-not: |
        public String toString() {
          return "...$SENSITIVE_FIELD='****'...";
        }