rules:
- id: android_logging_sensitive_data
  languages:
    - java
  message: The application logs sensitive data. Ensure that sensitive information is never logged.
  metadata:
    cwe: cwe-532
    masvs: storage-3
    owasp-mobile: m1
    reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#logs
  severity: ERROR
  patterns:
    - pattern-either:
        - pattern: Log.v(...);
        - pattern: Log.i(...);
        - pattern: Log.w(...);
        - pattern: Log.e(...);
        - pattern: Log.wtf(...);
        - pattern: System.$X.print(...);
        - pattern: System.$X.println(...);
        - pattern: (BufferedWriter $X).write(...);
        - pattern: (Logger $X).log(...);
        - pattern: (Logger $X).info(...);
        - pattern: (Logger $X).logp(...);
        - pattern: (Logger $X).logrb(...);
        - pattern: (Logger $X).severe(...);
        - pattern: (Logger $X).warning(...);
        - pattern: org.slf4j.LoggerFactory.getLogger(...).info(...);
        - pattern: org.slf4j.LoggerFactory.getLogger(...).warn(...);
        - pattern: org.slf4j.LoggerFactory.getLogger(...).error(...);
        - pattern: Timber.$X(...);
    - pattern-regex: (?i)(password|pwd|passwd|token|secret|key(?!board)|salt|seed|bearer|otp|crypt|auth|IV)
  path-ignore:
    - "**/test/**"
    - "**/debug/**"
  options:
    # Prevent ellipses from matching multiple lines
    generic_ellipsis_max_span: 0