rules:
  - id: insecure-x509trustmanager
    languages:
      - java
    message: >
      Insecure implementation of X509TrustManager detected. Ensure that:
      1. `checkClientTrusted` and `checkServerTrusted` properly validate certificates.
      2. `getAcceptedIssuers` returns a properly initialized array of trusted certificates.
      Avoid returning `null` or empty arrays from `getAcceptedIssuers`.
    metadata:
      cwe: CWE-295:Improper Certificate Validation
      masvs: NETWORK-3
      owasp-mobile: M3
      references:
        - https://developer.android.com/training/articles/security-config
    severity: ERROR
    patterns:
      # Detect getAcceptedIssuers() returning null
      - pattern: |
          class $CLASS implements X509TrustManager {
            public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            public X509Certificate[] getAcceptedIssuers() {
              return null;
            }
          }
      # Detect getAcceptedIssuers() returning empty array
      - pattern: |
          class $CLASS implements X509TrustManager {
            public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            public X509Certificate[] getAcceptedIssuers() {
              return new X509Certificate[0];
            }
          }
      # Detect uninitialized certificate array (empty array literal)
      - pattern: |
          class $CLASS implements X509TrustManager {
            public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            public X509Certificate[] getAcceptedIssuers() {
              return new X509Certificate[] {};
            }
          }
      # Detect insecure use of $CERTS directly without proper validation
      - pattern: |
          class $CLASS implements X509TrustManager {
            public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            public X509Certificate[] getAcceptedIssuers() {
              return $CERTS;
            }
          }
      # Detect missing validation in checkServerTrusted
      - pattern: |
          class $CLASS implements X509TrustManager {
            public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              // No validation logic here
            }
            public X509Certificate[] getAcceptedIssuers() {
              ...
            }
          }
      # Catch instances where validation logic is missing entirely in both methods
      - pattern: |
          class $CLASS implements X509TrustManager {
            public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              // No validation logic here
            }
            public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              // No validation logic here
            }
            public X509Certificate[] getAcceptedIssuers() {
              ...
            }
          }
    pattern-not:
      # Ensure proper validation for checkClientTrusted and checkServerTrusted methods
      - pattern: |
          class $CLASS implements X509TrustManager {
            public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              if ($CERTS == null || $CERTS.length == 0) {
                throw new IllegalArgumentException("Certificate array is empty");
              }
              // Additional validation logic
            }
            public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              if ($CERTS == null || $CERTS.length == 0) {
                throw new IllegalArgumentException("Certificate array is empty");
              }
              // Additional validation logic
            }
            public X509Certificate[] getAcceptedIssuers() {
              return new X509Certificate[] { /* Properly initialized certificates */ };
            }
          }
      # Exclude cases where there is proper handling or initialization in getAcceptedIssuers
      - pattern: |
          class $CLASS implements X509TrustManager {
            public X509Certificate[] getAcceptedIssuers() {
              // Properly initialized and validated certificate array
              return new X509Certificate[] { trustedCert1, trustedCert2 };
            }
          }
