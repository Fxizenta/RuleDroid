rules:
- id: safe-intent-sanitizer-usage
  languages:
  - java
  - kotlin
  message: "\u68C0\u6D4B\u5230\u5BF9\u5D4C\u5957 intent \u4F7F\u7528 IntentSanitizer\
    \ \u8FDB\u884C\u6D88\u6BD2\u64CD\u4F5C\uFF0C\u6B64\u7528\u6CD5\u7B26\u5408\u5B89\
    \u5168\u7684 intent \u91CD\u5B9A\u5411\u9632\u62A4\u63AA\u65BD\u3002\n"
  metadata:
    references:
    - https://developer.android.com/reference/kotlin/androidx/core/content/IntentSanitizer
  pattern-either:
  - pattern: "Intent $VAR = new IntentSanitizer.Builder()\n    .allowComponent($COMPONENT)\n\
      \    .allowData($DATA)\n    .allowType($TYPE)\n    .build()\n    .sanitizeByThrowing($ORIGINAL);\n"
  - pattern: "val $VAR = IntentSanitizer.Builder()\n    .allowComponent($COMPONENT)\n\
      \    .allowData($DATA)\n    .allowType($TYPE)\n    .build()\n    .sanitizeByThrowing($ORIGINAL);"
  severity: INFO
