rules:
- id: android-validate-calling-activity
  languages:
    - java
    - kotlin
  message: Use of getCallingActivity() without validating the calling package may lead to security vulnerabilities.
  metadata:
    cwe: CWE-939
    owasp: 'M1: Improper Platform Usage'
  severity: ERROR
  patterns:
    - pattern: "if (getCallingActivity() != null) { $DO_SOMETHING; }"
    - pattern-not: "if (getCallingActivity() != null && getCallingPackage() != null && $PACKAGE_MANAGER.getNameForUid(...) != null) { $DO_SOMETHING; }"
