rules:
  - id: android-deep-link-authentication-check
    languages:
      - java
      - kotlin
    message: Ensure that the authentication state is checked before processing deep link parameters to prevent unauthorized access.
    severity: ERROR
    patterns:
      # Detect deep link processing in onNewIntent method
      - pattern: |
          @Override
          public boolean onNewIntent(Intent $INTENT) {
              $DATA = $INTENT.getDataString();
              if ($DATA != null) {
                  ...
                  if (!isAuthenticated()) {
                      ...
                      return false;
                  }
              }
              ...
          }

      # Detect cases where authentication is checked before processing deep links
      - pattern-not: |
          if ($DATA != null && isAuthenticated()) {
              ...
          }

      # Detect cases where authentication is checked before deep link handling, but with different structure
      - pattern-not: |
          if (isAuthenticated()) {
              ...
              // Ensure that unauthorized requests are not processed after authentication
          }

      # Handle cases where deep link is processed in onCreate, onResume, or other lifecycle methods
      - pattern: |
          @Override
          public void onCreate(Bundle $BUNDLE) {
              super.onCreate($BUNDLE);
              $DATA = getIntent().getDataString();
              if ($DATA != null && !isAuthenticated()) {
                  // Prevent further deep link processing if not authenticated
                  return;
              }
              ...
          }

      - pattern: |
          @Override
          public void onResume() {
              super.onResume();
              $DATA = getIntent().getDataString();
              if ($DATA != null && !isAuthenticated()) {
                  // Prevent further deep link processing if not authenticated
                  return;
              }
              ...
          }

      # Add pattern to check for session or token-based authentication validation before processing deep link
      - pattern: |
          if ($TOKEN != null && validateToken($TOKEN)) {
              // Proceed with deep link processing
          } else {
              // Prevent deep link processing if token is invalid or missing
              return;
          }

      - pattern: |
          if ($SESSION != null && isSessionActive($SESSION)) {
              // Proceed with deep link processing
          } else {
              // Prevent deep link processing if session is not active
              return;
          }

    metadata:
      references:
        - "https://developer.android.com/training/app-links/deep-linking"
        - "https://owasp.org/www-project-mobile-top-10/"
      category: "Authentication"
      remediation: |
        Ensure that the `isAuthenticated()` method is called and properly validates the user's authentication state before processing deep link parameters. 
        If `isAuthenticated()` is not available or unreliable, consider using other secure methods such as token validation or session checks before processing deep links.
    description: |
      This rule ensures that deep link parameters are processed only after verifying that the user is authenticated, preventing unauthorized access to sensitive features or information.
