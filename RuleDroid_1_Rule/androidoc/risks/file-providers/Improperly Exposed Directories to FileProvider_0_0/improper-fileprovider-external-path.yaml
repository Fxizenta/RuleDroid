rules:
  - id: improper-fileprovider-external-path
    languages:
      - xmlUsing <external-path> in FileProvider configuration may expose external files. Please verify that the shared path is precise enough and limited to directories without sensitive data."
    metadata:
      cwe: CWE-200
      owasp-mobile: MSTG-PLATFORM-2.4
      reference: https://developer.android.com/guide/topics/providers/content-provider-basics
    severity: WARNING
    patterns:
      - pattern-inside: |
          <paths> ... </paths>
      - pattern: |
          <external-path ... path=$PATH ...>
      - metavariable-regex:
          metavariable: $PATH
          regex: "^(?:/|\\.)(?:/)?$"