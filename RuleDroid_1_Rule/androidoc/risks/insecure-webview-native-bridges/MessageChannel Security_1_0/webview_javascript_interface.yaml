rules:
  - id: webview_javascript_interface
    patterns:
      - pattern-either:
          - pattern: addJavascriptInterface(...)
          - pattern: $W.addJavascriptInterface(...)
    message: "Ensure that the JavaScript interface is implemented securely. Execution of user-controlled code in WebView is a critical security issue."
    languages:
      - java
    severity: ERROR
    metadata:
      cwe: cwe-749
      masvs: platform-7
      owasp-mobile: m1
      reference: "https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05h-Testing-Platform-Interaction.md#determining-whether-java-objects-are-exposed-through-webviews-mstg-platform-7"