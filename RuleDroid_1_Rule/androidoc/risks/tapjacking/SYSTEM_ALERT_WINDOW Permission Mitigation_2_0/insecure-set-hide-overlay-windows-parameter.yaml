rules:
  - id: insecure-set-hide-overlay-windows-parameter
    languages:
      - java
    message: >
      In Android 12 and higher, you should call setHideOverlayWindows(true)
      to mitigate overlay attacks. Ensure that it is explicitly set to true.
    severity: ERROR
    patterns:
      - pattern: $OBJ.setHideOverlayWindows($ARG);
      - pattern-not: $OBJ.setHideOverlayWindows(true);
      - pattern-not-inside: |
          if (Build.VERSION.SDK_INT >= 31) {
              ...
              $OBJ.setHideOverlayWindows($ARG);
              ...
          }
