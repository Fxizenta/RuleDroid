rules:
  - id: weak_or_broken_crypto_encryption_functions_java
    languages:
      - java
    message: >
      Weak or broken cryptographic encryption function detected. Avoid using DES,
      RC4, or NullCipher. Use secure algorithms (e.g., AES-128/GCM, AES-256/GCM, or ChaCha20)
      instead.
    metadata:
      cwe: CWE-327
      masvs: crypto-4
      owasp-mobile: M5
      reference: >
        Refer to industry guidelines (e.g., NIST recommendations) for selecting secure ciphers.
    metavariable-regex:
      - metavariable: $ALGORITHM
        regex: (?i)^DES(/.*)?$|^RC4(/.*)?$   
    pattern-either:
      - pattern: $C.getInstance("$ALGORITHM")  
      - pattern: new NullCipher()
    pattern-not-inside: |
      @SuppressWarnings(".*")
    severity: ERROR
