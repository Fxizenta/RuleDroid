rules:
- id: weak-crypto-algorithms
  languages:
  - java
  message: Weak or broken cryptographic algorithm detected. Use strong algorithms
    like AES-128/AES-256 with GCM mode or Chacha20 for symmetric encryption, and RSA-2048/RSA-4096
    with OAEP padding for asymmetric encryption.
  metadata:
    cwe: CWE-327
    owasp: A3:2017-Sensitive Data Exposure
    references:
    - https://www.enisa.europa.eu/publications/algorithms-key-size-and-parameters-report-2014
    - https://csrc.nist.gov/groups/ST/toolkit/BCM/modes_development.html
    - https://tools.ietf.org/html/rfc2313
    - https://tools.ietf.org/html/rfc2437
  patterns:
  - pattern-either:
    - pattern: 'Cipher.getInstance("DES")

        '
    - pattern: 'Cipher.getInstance("DESede")

        '
    - pattern: 'Cipher.getInstance("RC2")

        '
    - pattern: 'Cipher.getInstance("RC4")

        '
    - pattern: 'Cipher.getInstance("Blowfish")

        '
    - pattern: 'MessageDigest.getInstance("MD2")

        '
    - pattern: 'MessageDigest.getInstance("MD4")

        '
    - pattern: 'MessageDigest.getInstance("MD5")

        '
    - pattern: 'MessageDigest.getInstance("SHA-1")

        '
  - pattern-not: '// This is a comment to ignore

      // any test cases or examples

      // that are not actual code usage

      // but documentation or comments

      // in the codebase.

      //

      // Example:

      // Cipher.getInstance("DES")

      '
  severity: ERROR
