rules:
  - id: weak-random-number-generator
    patterns:
      - pattern-either:
          - pattern: SecureRandom.getInstance("SHA1PRNG")
          - pattern: SecureRandom.getInstance("NativePRNG")
          - pattern: SecureRandom.getInstance("NativePRNGBlocking")
          - pattern: SecureRandom.getInstance("NativePRNGNonBlocking")
      - pattern-not: SecureRandom.getInstanceStrong()
    message: >
      Weak random number generator detected. Avoid using insecure algorithms like
      "SHA1PRNG", "NativePRNG", or "NativePRNGBlocking". Use SecureRandom.getInstanceStrong()
      or a more secure algorithm.
    languages:
      - java
    severity: ERROR
    metadata:
      cwe: CWE-327
      owasp: A3:2017-Sensitive Data Exposure
    references:
      - https://developer.android.com/reference/java/security/SecureRandom
      - https://developer.android.com/training/articles/security-gms-provider