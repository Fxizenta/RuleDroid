rules:
  - id: weak_hash_other
    languages:
      - java
    message: >
      Weak or deprecated cryptographic algorithm used. The algorithm is known
      to have significant weaknesses. Use secure algorithms like AES, SHA-256, or SHA-512 instead.
    metadata:
      cwe: cwe-327
      masvs: crypto-4
      owasp-mobile: m5
      reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04g-Testing-Cryptography.md#identifying-insecure-andor-deprecated-cryptographic-algorithms-mstg-crypto-4
    patterns:
      - pattern-either:
          - pattern: $C.getInstance("RC2", ...)
          - pattern: $C.getInstance("RC4", ...)
          - pattern: $C.getInstance("Blowfish", ...)
          - pattern: Files.hash(..., Hashing.des())
          - pattern: DigestUtils.desHex(...)
    pattern-not-either:
      - pattern: $C.getInstance("AES", ...)
      - pattern: $C.getInstance("SHA-256", ...)
      - pattern: $C.getInstance("SHA-512", ...)
    severity: ERROR