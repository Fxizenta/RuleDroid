rules:
- id: android_implicit_intent_hijacking_inline_java
  languages:
    - java
  message: >-
    Implicit Intent Hijacking vulnerability: An inline-created Intent is used with startActivity() without being explicitly restricted. Ensure that you specify the target component by calling setPackage(), setClassName(), or setComponent() to prevent interception.
  metadata:
    cwe: CWE-927
    owasp-mobile: DRD03-J
    reference: https://wiki.sei.cmu.edu/confluence/display/android/DRD03-J.+Do+not+broadcast+sensitive+information+using+an+implicit+intent
  severity: ERROR
  patterns:
    - pattern: 'startActivity(new Intent($ACTION))'
    - pattern-not: 'new Intent($ACTION).setPackage($PACKAGE)'
    - pattern-not: 'new Intent($ACTION).setClassName($CONTEXT, $CLASSNAME)'
    - pattern-not: 'new Intent($ACTION).setComponent($COMPONENT)'