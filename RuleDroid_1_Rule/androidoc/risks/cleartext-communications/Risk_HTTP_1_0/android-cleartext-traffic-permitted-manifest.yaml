rules:
  - id: android-cleartext-traffic-permitted-manifest
    languages:
      - xml
    severity: ERROR
    message: Ensure cleartext traffic is not permitted in the network_security_config.xml file.
    metadata:
      cwe: CWE-319
      owasp: A6-Security Misconfiguration
    patterns:
      # Match the <application> tag that links to the network_security_config.xml file
      - pattern: |
          <application
            ...
            android:networkSecurityConfig="@xml/network_security_config"
            ...>
        # Ensure the network_security_config.xml file exists and is being referenced
      - pattern-inside: |
          <network-security-config>
            <domain-config cleartextTrafficPermitted="true">
            ...
            </domain-config>
          </network-security-config>

      # Refine the check for specific cases of cleartext traffic being enabled for multiple domains
      - pattern: |
          <network-security-config>
            <domain-config cleartextTrafficPermitted="true">
            ...
            </domain-config>
            <domain-config cleartextTrafficPermitted="true">
            ...
            </domain-config>
          </network-security-config>

      # Ensure no cleartextTrafficPermitted="true" is set in any domain or configuration
      - pattern-not: |
          <network-security-config>
            <domain-config cleartextTrafficPermitted="true">
            ...
            </domain-config>
          </network-security-config>

      # Match cleartext traffic being permitted only when absolutely necessary
      - pattern: |
          <network-security-config cleartextTrafficPermitted="true">
          ...
          </network-security-config>

      # Exclude configurations where cleartext traffic is correctly disabled
      - pattern-not: |
          <network-security-config cleartextTrafficPermitted="false">
          ...
          </network-security-config>

    # Specify the path to the network_security_config.xml
    path: "**/network_security_config.xml"

    description: |
      This rule ensures that cleartext traffic is not allowed in the `network_security_config.xml` file.
      Cleartext traffic (i.e., HTTP) should be disabled to avoid man-in-the-middle (MITM) attacks and improve security.

    fix: |
      Ensure that `cleartextTrafficPermitted="false"` is set for all domains or globally for the network security config.
      
      Example fix:
      ```xml
      <network-security-config>
          <domain-config cleartextTrafficPermitted="false">
              ...
          </domain-config>
      </network-security-config>
      ```
