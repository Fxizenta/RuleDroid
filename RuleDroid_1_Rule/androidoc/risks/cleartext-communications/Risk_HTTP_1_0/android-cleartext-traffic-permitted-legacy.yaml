rules:
- id: android-cleartext-traffic-permitted-legacy
  languages:
    - xml
  message: Cleartext traffic is permitted in the base configuration for legacy Android versions. Consider setting cleartextTrafficPermitted to false.
  metadata:
    cwe: CWE-319
    owasp: A6-Security Misconfiguration
  patterns:
    - pattern: |
        <base-config cleartextTrafficPermitted="true" ...>
          ...
        </base-config>
  severity: ERROR
- id: android-cleartext-traffic-permitted-domain
  languages:
    - xml
  message: Cleartext traffic is permitted in a domain configuration. Consider setting cleartextTrafficPermitted to false.
  metadata:
    cwe: CWE-319
    owasp: A6-Security Misconfiguration
  patterns:
    - pattern: |
        <domain-config cleartextTrafficPermitted="true" ...>
          ...
        </domain-config>
  severity: ERROR
- id: android-cleartext-traffic-permitted-generic
  languages:
    - xml
  message: Cleartext traffic is permitted in the network security configuration. Consider setting cleartextTrafficPermitted to false.
  metadata:
    cwe: CWE-319
    owasp: A6-Security Misconfiguration
  patterns:
    - pattern: |
        cleartextTrafficPermitted="true"
  severity: ERROR