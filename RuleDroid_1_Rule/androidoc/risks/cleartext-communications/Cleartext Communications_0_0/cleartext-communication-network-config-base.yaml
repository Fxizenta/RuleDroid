rules:
- id: cleartext-communication-network-config-base
  languages:
    - xml
  message: >
    Cleartext traffic is permitted in the network security configuration. 
    This can expose sensitive data to network attacks. 
    Consider setting cleartextTrafficPermitted="false" explicitly.
  paths:
    include:
      - '**/*.xml'
  patterns:
    - pattern-inside: |
        <network-security-config>
          ...
        </network-security-config>
    - pattern: |
        <base-config cleartextTrafficPermitted="true">
        ...
        </base-config>
    - pattern-not: |
        <base-config cleartextTrafficPermitted="false">
        ...
        </base-config>
  severity: WARNING
  metadata:
    references:
      - https://developer.android.com/training/articles/security-config
    category: security
    confidence: MEDIUM
  options:
    xml:
      allow_multiline: true
