rules:
  - id: avoid-direct-camera-api-import
    languages:
      - java
    message: >
      Directly importing the Camera API indicates that your app may be using direct camera access,
      which requires the CAMERA permission. Instead, use the system camera app via the
      ACTION_IMAGE_CAPTURE or ACTION_VIDEO_CAPTURE intent actions.
    name: Avoid Direct Camera API Import in Java
    pattern-regex: '^\s*import\s+android\.hardware\.Camera\s*;'
    severity: ERROR