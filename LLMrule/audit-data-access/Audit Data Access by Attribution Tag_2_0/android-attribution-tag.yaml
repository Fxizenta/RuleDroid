rules:
- id: android-attribution-tag
  languages:
  - xml
  message: |
      The application should declare attribution tags in the manifest file for Android 12 (API level 31) or higher.
      Ensure that `android:required="true"` is set for applications targeting API 31 or higher.
  metadata:
    area: platform
    category: security
    owasp-mobile: M1
    references:
    - https://developer.android.com/about/versions/12/behavior-changes-12#attribution-tags
    verification-level:
    - L1
    - L2
  paths:
    include:
    - '**/AndroidManifest.xml'
  patterns:
    # Match applications declaring Attribution Tags with non-empty values
    - pattern-either:
      - pattern: |
          <meta-data 
              android:name="android.content.AttributionTag" 
              android:value="*"/>
      - pattern: |
          <meta-data 
              android:name="android.content.AttributionTag" 
              android:value="@string/*"/>
    # Ensure the tag is not empty
    - pattern-not: |
        <meta-data 
            android:name="android.content.AttributionTag" 
            android:value=""/>
    # Match the API level conditionally
    - pattern: |
        <uses-sdk
            android:minSdkVersion="$MIN_SDK_VERSION"/>
    # Ensure the `minSdkVersion` is at least 31
  metavariable-comparison:
    MIN_SDK_VERSION: ">= 31"
  severity: ERROR
