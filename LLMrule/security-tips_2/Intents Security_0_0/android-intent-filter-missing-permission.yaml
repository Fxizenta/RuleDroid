rules:
- id: android-intent-filter-missing-permission
  languages:
  - xml
  message: Intent filter detected without specifying a permission. Consider specifying a permission to restrict access.
  patterns:
  - pattern-either:
    - pattern: |
        <activity>
          <intent-filter>
            ...
          </intent-filter>
        </activity>
    - pattern: |
        <service>
          <intent-filter>
            ...
          </intent-filter>
        </service>
    - pattern: |
        <receiver>
          <intent-filter>
            ...
          </intent-filter>
        </receiver>
    - pattern: |
        <provider>
          <intent-filter>
            ...
          </intent-filter>
        </provider>
  - pattern-not: |
      <activity android:permission="...">
        <intent-filter>
          ...
        </intent-filter>
      </activity>
  - pattern-not: |
      <service android:permission="...">
        <intent-filter>
          ...
        </intent-filter>
      </service>
  - pattern-not: |
      <receiver android:permission="...">
        <intent-filter>
          ...
        </intent-filter>
      </receiver>
  - pattern-not: |
      <provider android:permission="...">
        <intent-filter>
          ...
        </intent-filter>
      </provider>
  severity: ERROR
  metadata:
    description: |
      Detects Android intent filters that do not specify a permission attribute, which can lead to security vulnerabilities by allowing unrestricted access to the component.
    references:
    - https://developer.android.com/guide/topics/manifest/intent-filter-element
    - https://developer.android.com/guide/topics/manifest/permission-element
    tags:
    - android
    - security
    - permissions