rules:
- id: android-service-intent-filter
  languages:
  - xml
  message: Service has an intent filter and is exported by default. Ensure this is
    intended and secure.
  metadata:
    cwe: CWE-200
    owasp: 'M1: Improper Platform Usage'
  path: AndroidManifest.xml
  pattern-not: 'android:exported="false"

    '
  patterns:
  - pattern: "<service\n  ... >\n  <intent-filter>\n    ...\n  </intent-filter>\n\
      </service>\n"
  severity: WARNING
