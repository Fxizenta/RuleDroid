rules:
- id: android_debug_overrides
  languages:
    - xml
  message: |
    Debug-only CAs are specified in `<debug-overrides>` inside `network-security-config.xml`. 
    Ensure this is not included in production builds, as it may expose sensitive data. 
    Consider removing or restricting this configuration in production.
    Example:
    ```xml
    <network-security-config>
        <debug-overrides>
            <trust-anchors>
                <certificates src="@raw/debug_cas" />
            </trust-anchors>
        </debug-overrides>
    </network-security-config>
    ```
  metadata:
    cwe: 'CWE-295: Improper Certificate Validation'
    masvs: 'MSTG-NETWORK-1'
    owasp-mobile: 'M3: Insecure Communication'
    reference: https://developer.android.com/training/articles/security-config#DebugOnly
  severity: ERROR
  options:
    xml_attrs_implicit_ellipsis: true
  paths:
    include:
      - "**/res/xml/network_security_config.xml"
  patterns:
    # 1. 确保 `debug-overrides` 在 `network-security-config` 内
    - pattern-inside: |
        <network-security-config>
          ...
          <debug-overrides>
            ...
          </debug-overrides>
          ...
        </network-security-config>
    # 2. 匹配 `debug-overrides` 下的 `trust-anchors`
    - pattern-either:
        - pattern: |
            <trust-anchors>
                <certificates src="@raw/$ANY"/>
            </trust-anchors>
        - pattern: |
            <trust-anchors>
                <certificates src="@xml/$ANY"/>
            </trust-anchors>
        - pattern: |
            <trust-anchors>
                <certificates src="@assets/$ANY"/>
            </trust-anchors>
        - pattern: |
            <trust-anchors>
                <certificates src="$ANY.pem"/>
            </trust-anchors>
    # 3. 排除误报情况：如果 `debug-overrides` 在 `production="true"` 结构中，则不触发警告
    - pattern-not-inside: |
        <network-security-config production="true">
          ...
          <debug-overrides>
            ...
          </debug-overrides>
          ...
        </network-security-config>
    # 4. 排除 `certificates src="system"`，防止误报
    - pattern-not: |
        <certificates src="system"/>
  fix: |
    <network-security-config>
        <!-- Remove debug-overrides for production builds -->
    </network-security-config>
