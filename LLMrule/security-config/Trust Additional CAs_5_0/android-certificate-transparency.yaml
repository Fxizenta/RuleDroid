rules:
  - id: android-certificate-transparency
    languages:
      - java
    message: >
      A possible lack of TLS certificate transparency check implementation has been detected. Certificate transparency helps to find abnormal certificates. Please confirm whether this mechanism is necessary to enhance security.
    metadata:
      cwe: cwe-295
      masvs: network-4
      owasp-mobile: m3
      reference: "https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05g-Testing-Network-Communication.md#testing-custom-certificate-stores-and-certificate-pinning-mstg-network-4"
    patterns:
      - pattern-either:
          - pattern: "import com.babylon.certificatetransparency;"
          - pattern: "new CTInterceptorBuilder(...);"
          - pattern: "new CTHostnameVerifierBuilder(...);"
    severity: INFO