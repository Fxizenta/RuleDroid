rules:
- id: android-network-security-config-limited-cas
  languages:
    - xml
  message: |
    Ensure the `network-security-config` explicitly limits the set of trusted CAs for specified domains. 
    Avoid overly permissive configurations such as missing `<trust-anchors>` or using untrusted roots.
    Example:
    ```xml
    <network-security-config>
        <domain-config>
            <domain includeSubdomains="true">secure.example.com</domain>
            <trust-anchors>
                <certificates src="@raw/trusted_roots"/>
            </trust-anchors>
        </domain-config>
    </network-security-config>
    ```
  metadata:
    category: Security
    cwe: 'CWE-295: Improper Certificate Validation'
    technology: Android
  severity: ERROR
  options:
    xml_attrs_implicit_ellipsis: true
  paths:
    include:
      - "**/res/xml/network_security_config.xml"
  patterns:
    # 检测 `network-security-config` 中的 `domain-config` 及其 `trust-anchors`
    - pattern-inside: |
        <network-security-config>
          ...
          <domain-config>
            <domain includeSubdomains="$INCLUDE_SUBDOMAINS">$DOMAIN</domain>
            ...
          </domain-config>
          ...
        </network-security-config>
    - pattern-either:
        # 检测 `trust-anchors` 中是否配置了证书
        - pattern: |
            <trust-anchors>
                <certificates src="$CERT_SRC"/>
            </trust-anchors>
    # 排除不受信的 CA 配置
    - pattern-not: |
        <trust-anchors>
            <certificates src="@raw/untrusted_roots"/>
        </trust-anchors>
    # 允许 `certificates src="system"` 的情况，避免误报
    - pattern-not: |
        <trust-anchors>
            <certificates src="system"/>
        </trust-anchors>
    # 允许 `overridePins="true"` 的情况，避免误报
    - pattern-not-inside: |
        <network-security-config>
          ...
          <domain-config overridePins="true">
            ...
          </domain-config>
          ...
        </network-security-config>
    # 检测 `domain-config` 是否完全缺少 `trust-anchors`
    - pattern-not-inside: |
        <domain-config>
            <domain includeSubdomains="$INCLUDE_SUBDOMAINS">$DOMAIN</domain>
            ...
        </domain-config>
  fix: |
    <network-security-config>
        <domain-config>
            <domain includeSubdomains="true">secure.example.com</domain>
            <trust-anchors>
                <certificates src="@raw/trusted_roots"/>
            </trust-anchors>
        </domain-config>
    </network-security-config>
