rules:
  - id: android_missing_trust_anchors
    languages:
      - xml
    message: "No custom trusted CA is specified in Network Security Config. The lack of <trust-anchors> configuration will cause the application to trust the system default CA list, which may lead to security risks."
    metadata:
      cwe: CWE-295
      masvs: network-4
      owasp-mobile: m3
      reference: "https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04f-Testing-Network-Communication.md"
    path: res/xml/network_security_config.xml
    patterns:
      - pattern: "<network-security-config ...>...</network-security-config>"
      - pattern-not: "<trust-anchors"
    severity: WARNING