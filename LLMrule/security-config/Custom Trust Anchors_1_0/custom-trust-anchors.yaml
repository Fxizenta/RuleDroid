rules:
- id: custom-trust-anchors
  languages:
  - xml
  message: Custom trust anchors detected in network_security_config.xml
  metadata:
    cwe: CWE-295
    owasp: 'M3: Insecure Communication'
  path: res/xml/network_security_config.xml
  patterns:
  - pattern: "<network-security-config>\n    <domain-config>\n        <domain includeSubdomains=\"\
      $INCLUDE_SUBDOMAINS\">$DOMAIN</domain>\n        <trust-anchors>\n          \
      \  <certificates src=\"$CERT_SRC\"/>\n        </trust-anchors>\n    </domain-config>\n\
      </network-security-config>\n"
  - pattern-not: "<network-security-config>\n    <domain-config>\n        <domain\
      \ includeSubdomains=\"$INCLUDE_SUBDOMAINS\">$DOMAIN</domain>\n        <trust-anchors>\n\
      \            <certificates src=\"system\"/>\n        </trust-anchors>\n    </domain-config>\n\
      </network-security-config>\n"
  severity: ERROR
