rules:
- id: android_certificate_pinning_unsafe
  languages:
    - xml
  message: |
    This app uses an insecure certificate pinning configuration in network_security_config.xml.
    Ensure that:
    - Only secure digest algorithms (e.g., SHA-256) are used.
    - Do not use deprecated algorithms like SHA-1 or MD5.
    - Always include backup pins to prevent connectivity issues in case of certificate changes.
  metadata:
    cwe: CWE-295
    masvs: NETWORK-4
    owasp-mobile: M3
    reference: https://developer.android.com/training/articles/security-config#CertificatePinning
  paths:
    include:
      - "**/res/xml/network_security_config.xml"
  severity: ERROR
  patterns:
    # 检测使用了不安全的 SHA-1
    - pattern: |
        <pin digest="SHA-1">$PIN</pin>
    # 检测使用了不安全的 MD5
    - pattern: |
        <pin digest="MD5">$PIN</pin>
    # 检测 SHA-256 但只有一个 pin，没有 backup pin
    - pattern-inside: |
        <pin-set>
          ...
        </pin-set>
    - pattern: |
        <pin digest="SHA-256">$PIN</pin>
    - pattern-not: |
        <pin digest="SHA-256">$PIN1</pin>
        <pin digest="SHA-256">$PIN2</pin>
    # 过期时间 expiration 为空或未设置
    - pattern: |
        <pin-set expiration=""></pin-set>
    - pattern-not-inside: |
        <pin-set expiration="*"></pin-set>
