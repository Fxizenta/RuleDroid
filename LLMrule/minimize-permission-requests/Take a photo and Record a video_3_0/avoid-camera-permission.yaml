rules:
- id: avoid-camera-permission
  languages:
  - xml
  message: For taking pictures or recording videos in your app, use the pre-installed
    system camera app by invoking the ACTION_IMAGE_CAPTURE or ACTION_VIDEO_CAPTURE
    intent actions instead of declaring the CAMERA permission.
  metadata:
    category: security
    technology: Android
  pattern-not-inside:
  - pattern: '<uses-permission android:name="android.permission.CAMERA" />

      '
  patterns:
  - pattern: '<permission android:name="android.permission.CAMERA" ... />

      '
  severity: ERROR
