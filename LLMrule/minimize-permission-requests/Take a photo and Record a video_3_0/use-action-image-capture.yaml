rules:
- id: use-action-image-capture
  languages:
  - java
  message: Using ACTION_IMAGE_CAPTURE intent action for taking pictures.
  metadata:
    category: best-practice
    technology: Android
  pattern-not-inside:
  - pattern: 'Intent intent = new Intent($OTHER_ACTION$);

      '
  patterns:
  - pattern: 'Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);

      '
  severity: INFO
