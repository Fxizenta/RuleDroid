rules:
  - id: avoid-direct-camera-api-open
    languages:
      - java
    message: >
      Calling Camera.open() directly implies that the app is using camera APIs
      that require the CAMERA permission. Instead, invoke the pre-installed system
      camera app using ACTION_IMAGE_CAPTURE or ACTION_VIDEO_CAPTURE.
    pattern-either:
      - pattern: Camera.open($ARGS)
      - pattern: android.hardware.Camera.open($ARGS)
    severity: ERROR