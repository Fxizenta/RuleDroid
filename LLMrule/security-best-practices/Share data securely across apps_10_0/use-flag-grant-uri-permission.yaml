rules:
- id: use-flag-grant-uri-permission
  languages:
    - java
  message: |
    Provide clients one-time access to data by using both FLAG_GRANT_READ_URI_PERMISSION 
    and FLAG_GRANT_WRITE_URI_PERMISSION flags together.
  metadata:
    cwe: CWE-276
    references:
      - https://developer.android.com/reference/android/content/Intent#FLAG_GRANT_READ_URI_PERMISSION
      - https://developer.android.com/reference/android/content/Intent#FLAG_GRANT_WRITE_URI_PERMISSION
    fix: Ensure both FLAG_GRANT_READ_URI_PERMISSION and FLAG_GRANT_WRITE_URI_PERMISSION 
         are added to the Intent object.
  severity: WARNING
  pattern-inside: |
    Intent $INTENT = new Intent(...);
    ...
  patterns:
    # 匹配 addFlags() 但未同时包含两个标志位
    - pattern: |
        $INTENT.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
        ...
        $INTENT.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
    
    # 匹配 setFlags() 但未同时包含两个标志位
    - pattern: |
        $INTENT.setFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
        ...
        $INTENT.setFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION);

  pattern-not:
    # 避免误报: 直接合并 flag 一次性设置的情况
    - pattern: |
        $INTENT.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
    - pattern: |
        $INTENT.setFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
