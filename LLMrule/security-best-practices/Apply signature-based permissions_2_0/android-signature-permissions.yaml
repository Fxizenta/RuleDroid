rules:
  - id: android-signature-permissions
    languages:
      - xml
    message: >
      Use signature-based permissions when sharing data between two apps that you control or own. 
      These permissions don't require user confirmation and ensure that the apps accessing 
      the data are signed using the same signing key.
    metadata:
      category: Security
      technology: Android
      cwe: "CWE-285: Improper Authorization"
      owasp-mobile: "M4: Insecure Authentication"
      references:
        - https://developer.android.com/guide/topics/manifest/permission-element
    severity: WARNING
    paths:
      include:
        - "AndroidManifest.xml"
    patterns:
      # 1. 检测 "signature" 保护级别的权限声明
      - pattern-either:
          - pattern: |
              <permission android:name="$PERMISSION_NAME"
                          android:protectionLevel="signature" />
          - pattern: |
              <permission android:protectionLevel="signature"
                          android:name="$PERMISSION_NAME" />
      # 2. 过滤不安全的 `protectionLevel`
      - pattern-not: |
          <permission android:name="$PERMISSION_NAME"
                      android:protectionLevel="normal" />
      - pattern-not: |
          <permission android:name="$PERMISSION_NAME"
                      android:protectionLevel="dangerous" />
      - pattern-not: |
          <permission android:name="$PERMISSION_NAME"
                      android:protectionLevel="signatureOrSystem" />
      # 3. 避免误报：如果 `android:permissionGroup` 存在，则不匹配
      - pattern-not-inside: |
          <permission android:name="$PERMISSION_NAME"
                      android:protectionLevel="signature"
                      android:permissionGroup="..." />
      # 4. 避免误报：确保 `protectionLevel="signature"` 不是单独与 `system` 组合
      - pattern-not-inside: |
          <permission android:name="$PERMISSION_NAME"
                      android:protectionLevel="signature|system" />
    options:
      multiline: true
