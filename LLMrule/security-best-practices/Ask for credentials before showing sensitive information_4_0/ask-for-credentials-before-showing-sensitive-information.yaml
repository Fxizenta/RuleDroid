rules:
- id: ask-for-credentials-before-showing-sensitive-information
  languages:
    - java
  message: |
    Before accessing sensitive information, ensure that the application requests user credentials 
    (PIN, password, pattern, or biometric authentication). Avoid passing null or invalid parameters.
    Example:
    ```
    KeyguardManager keyguardManager = (KeyguardManager) context.getSystemService(Context.KEYGUARD_SERVICE);
    Intent intent = keyguardManager.createConfirmDeviceCredentialIntent("Verify Identity", "Access to sensitive data");
    startActivityForResult(intent, REQUEST_CODE);
    ```
  metadata:
    category: security
    technology: android
    references:
      - https://developer.android.com/reference/android/app/KeyguardManager
      - https://developer.android.com/reference/android/hardware/fingerprint/FingerprintManager
      - https://developer.android.com/reference/android/hardware/biometrics/BiometricPrompt
  patterns:
    - pattern: |
        $KEYGUARD_MANAGER.createConfirmDeviceCredentialIntent($TITLE, $DESCRIPTION)
    - pattern-not: |
        $KEYGUARD_MANAGER.createConfirmDeviceCredentialIntent(null, null)
    - pattern-not: |
        $TITLE == null || $DESCRIPTION == null
    - pattern: |
        $FINGERPRINT_MANAGER.authenticate($CRYPTO_OBJECT, $CANCELLATION_SIGNAL, $FLAGS, $AUTHENTICATION_CALLBACK, $HANDLER)
    - pattern-not: |
        $FINGERPRINT_MANAGER.authenticate(null, null, 0, null, null)
    - pattern-not: |
        $AUTHENTICATION_CALLBACK == null
  severity: INFO
  fix: |
    // Ensure proper credentials or biometric authentication are used.
    KeyguardManager keyguardManager = (KeyguardManager) context.getSystemService(Context.KEYGUARD_SERVICE);
    Intent intent = keyguardManager.createConfirmDeviceCredentialIntent("Verify Identity", "Access to sensitive data");
    startActivityForResult(intent, REQUEST_CODE);

    // For biometric authentication
    FingerprintManager fingerprintManager = (FingerprintManager) context.getSystemService(Context.FINGERPRINT_SERVICE);
    fingerprintManager.authenticate(cryptoObject, cancellationSignal, 0, authenticationCallback, null);
