rules:
- id: replaying-pending-intents
  languages:
    - java
  message: Pending Intents not intended to be fired multiple times should use the "FLAG_ONE_SHOT"
    flag to avoid replay attacks.
  metadata:
    area: platform
    authors:
      - Your Name
    category: security
    owasp-mobile: M1
    references:
      - https://developer.android.com/topic/security/risks/pending-intent#risk_replaying_pending_intents
    verification-level:
      - L1
      - L2
  patterns:
    - pattern: PendingIntent.$M($A, $B, $C, $D)
    - metavariable-regex:
        metavariable: $M
        regex: ^(getActivity|getActivities|getBroadcast|getForegroundService|getService)$
    - pattern-not: PendingIntent.$M($A, $B, $C, $D | PendingIntent.FLAG_ONE_SHOT)
    - pattern-not: PendingIntent.$M($A, $B, $C, $D | PendingIntent.FLAG_ONE_SHOT | $E)
    - pattern-not: PendingIntent.$M($A, $B, $C, $D | $E | PendingIntent.FLAG_ONE_SHOT)
    - pattern-not: PendingIntent.$M($A, $B, $C, $D | $E | $F | PendingIntent.FLAG_ONE_SHOT)
  severity: ERROR