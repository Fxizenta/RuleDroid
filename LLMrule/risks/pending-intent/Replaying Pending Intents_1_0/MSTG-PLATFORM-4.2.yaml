rules:
  - id: MSTG-PLATFORM-4.2
    languages:
      - java
      - kotlin
    message: PendingIntent is created without FLAG_ONE_SHOT which is required to prevent replay attacks.
    metadata:
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      references:
        - https://developer.android.com/topic/security/risks/pending-intent#risk_replaying_pending_intents
    severity: ERROR
    patterns:
      - pattern: PendingIntent.$METHOD($P1, $P2, $P3, $FLAGS, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: getActivity|getBroadcast|getService|getForegroundService|getActivities
      - pattern-not: FLAG_ONE_SHOT