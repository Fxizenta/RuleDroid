rules:
- id: android-service-enforce-calling-permission
  languages:
    - java
  message: Service does not enforce calling permission.
  metadata:
    cwe: CWE-284
    owasp: 'M1: Improper Platform Usage'
  path: '**/*.java'
  patterns:
    - pattern: |
        public class $CLASS extends Service {
          @Override
          public IBinder onBind(Intent intent) {
            ...
            return $BINDER;
          }
        }
    - pattern-not: |
        public class $CLASS extends Service {
          @Override
          public IBinder onBind(Intent intent) {
            enforceCallingPermission($PERMISSION, $MESSAGE);
            ...
            return $BINDER;
          }
        }
    - pattern-not: |
        public class $CLASS extends Service {
          @Override
          public IBinder onBind(Intent intent) {
            if ($CONDITION) {
              enforceCallingPermission($PERMISSION, $MESSAGE);
            }
            ...
            return $BINDER;
          }
        }
    - pattern-not: |
        public class $CLASS extends Service {
          @Override
          public IBinder onBind(Intent intent) {
            $HELPER.enforceCallingPermission($PERMISSION, $MESSAGE);
            ...
            return $BINDER;
          }
        }
  severity: ERROR