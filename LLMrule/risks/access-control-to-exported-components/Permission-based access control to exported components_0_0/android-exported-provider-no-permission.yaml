rules:
- id: android-exported-provider-no-permission
  languages:
  - xml
  message: Exported provider without required permission.
  metadata:
    cwe: CWE-284
    owasp: 'M1: Improper Platform Usage'
  path: AndroidManifest.xml
  patterns:
  - pattern: |
      <provider
        android:name="$PROVIDER_NAME"
        android:exported="true"
        ...
      />
  - pattern-not: |
      <provider
        android:name="$PROVIDER_NAME"
        android:exported="true"
        android:readPermission="$READ_PERMISSION"
        ...
      />
  - pattern-not: |
      <provider
        android:name="$PROVIDER_NAME"
        android:exported="true"
        android:writePermission="$WRITE_PERMISSION"
        ...
      />
  severity: ERROR
  fix: |
      Ensure that exported providers specify both android:readPermission and android:writePermission attributes with appropriate values to restrict unauthorized access.