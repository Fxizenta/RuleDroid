rules:
  - id: avoid-java-util-random-usage
    languages:
      - java
      - kotlin
    message: "Avoid using java.util.Random for security or authentication purposes. Use SecureRandom for cryptographically secure random generation."
    severity: ERROR
    metadata:
      cwe: CWE-330
      masvs: crypto-6
      owasp-mobile: M5
      reference: "https://github.com/OWASP/owasp-mstg/blob/master/Document/0x04g-Testing-Cryptography.md#weak-random-number-generators"
    metavariable-regex:
      $METHOD: (?i)(auth|token|pass|credential|secure)
    patterns:
      - pattern: new Random(...)
      - pattern-inside:
          pattern-either:
            - pattern: "$RETURN_TYPE $METHOD($PARAMS) { ... }"
            - pattern: "fun $METHOD($PARAMS) { ... }"