rules:
- id: avoid-securerandom-seed
  languages:
  - java
  - kotlin
  message: Avoid seeding `SecureRandom` explicitly as it can reduce randomness.
  metadata:
    cwe: cwe-330
    masvs: crypto-6
    owasp-mobile: m5
    reference: https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05e-Testing-Cryptography.md#testing-random-number-generation-mstg-crypto-6
  paths:
    exclude:
    - '**/test/**'
    - '**/example/**'
  patterns:
  - pattern-either:
    - pattern: 'new SecureRandom($SEED);'
    - pattern: 'SecureRandom rand = new SecureRandom($SEED);'
    - pattern: 'new java.security.SecureRandom($SEED)'
  severity: ERROR
