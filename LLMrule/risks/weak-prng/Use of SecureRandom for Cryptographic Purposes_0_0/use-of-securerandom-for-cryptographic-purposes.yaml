rules:
- id: use-of-securerandom-for-cryptographic-purposes
  languages:
  - java
  - kotlin
  message: Use `java.security.SecureRandom` for cryptographic purposes instead of
    `Math.random` or `java.util.Random`.
  metadata:
    cwe: cwe-330
    masvs: crypto-6
    owasp-mobile: m5
    reference: https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05e-Testing-Cryptography.md#testing-random-number-generation-mstg-crypto-6
  paths:
    exclude:
    - '**/test/**'
    - '**/example/**'
  pattern-not: 'SecureRandom.getInstanceStrong()

    '
  patterns:
  - pattern-either:
    - pattern: Math.random(...)
    - pattern: 'java.util.Random $X = new java.util.Random(...);

        '
    - pattern: '$X = new java.util.Random(...);

        '
  severity: ERROR
