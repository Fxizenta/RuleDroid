rules:
  - id: xml-avoid-doctype-decl
    languages:
      - xml
    message: "The presence of DOCTYPE declaration in XML files may lead to XXE attacks. Please ensure that the relevant XML parser is properly configured (for example, disabling DTD) to prevent external entity attacks."
    metadata:
      cwe: cwe-611
      owasp-mobile: m8
      reference: https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
    severity: WARNING
    patterns:
      - pattern: '<!DOCTYPE $ANY>'
      - pattern-not-inside: '<!-- ... -->'