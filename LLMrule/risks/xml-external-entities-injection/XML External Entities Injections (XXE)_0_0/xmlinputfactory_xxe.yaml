rules:
- id: xmlinputfactory_xxe
  languages:
  - java
  message: 'XML external entities are not explicitly disabled for this XMLInputFactory.
    This could be vulnerable to XML external entity vulnerabilities. Explicitly disable
    external entities by setting "javax.xml.stream.isSupportingExternalEntities" to
    false.

    '
  metadata:
    cwe: CWE-611
    masvs: platform-2
    owasp-mobile: M8
    references:
    - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2
  patterns:
  - pattern-not-inside: "$RETURNTYPE $METHOD(...) {\n  ...\n  $XMLFACTORY.setProperty(\"\
      javax.xml.stream.isSupportingExternalEntities\", false);\n  ...\n}\n"
  - pattern-not-inside: "$RETURNTYPE $METHOD(...) {\n  ...\n  $XMLFACTORY.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES,\
      \ false);\n  ...\n}\n"
  - pattern-either:
    - pattern: $XMLFACTORY = $W.newFactory(...);
    - pattern: $XMLFACTORY = XMLInputFactory.newInstance(...);
  severity: ERROR
