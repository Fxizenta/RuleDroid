rules:
  - id: insecure-createPackageContext
    languages:
      - java
    severity: ERROR
    message: >
      The method `createPackageContext` is used with `CONTEXT_IGNORE_SECURITY`
      and `CONTEXT_INCLUDE_CODE`, which can lead to arbitrary code execution by a malicious
      application.
    metadata:
      cwe: CWE-927
      owasp-mobile: M7
      references:
        - https://developer.android.com/reference/android/content/Context#createPackageContext(java.lang.String,%20int)
        - https://blog.oversecured.com/Interception-of-Android-implicit-intents/
    patterns:
      # Match direct usage of createPackageContext with the dangerous flags
      - pattern: |
          $CTX.createPackageContext($PKG, CONTEXT_IGNORE_SECURITY | CONTEXT_INCLUDE_CODE)
      
      # Match cases where the flags are combined in different ways
      - pattern-either:
          - pattern: |
              $CTX.createPackageContext($PKG, CONTEXT_IGNORE_SECURITY | $OTHER_FLAG)
          - pattern: |
              $CTX.createPackageContext($PKG, $FLAG | CONTEXT_INCLUDE_CODE)

      # Detect use with dynamic flags
      - pattern: |
          $CTX.createPackageContext($PKG, $DYNAMIC_FLAGS)
          if ($DYNAMIC_FLAGS == CONTEXT_IGNORE_SECURITY | CONTEXT_INCLUDE_CODE) { ... }

      # Ensure there's no proper check around the insecure flag combination
      - pattern-not: |
          if ($CTX.createPackageContext($PKG, CONTEXT_IGNORE_SECURITY | CONTEXT_INCLUDE_CODE) != null) {
              ...
          }

      # Extend coverage to other cases where dynamic flags are used in context creation
      - pattern: |
          $CTX.createPackageContext($PKG, $FLAG)
          if ($FLAG == CONTEXT_IGNORE_SECURITY | CONTEXT_INCLUDE_CODE) { ... }

      # Catch indirect invocations, e.g., where another method calls createPackageContext
      - pattern: |
          $CTX.callOtherMethodThatCreatesPackageContext($PKG, CONTEXT_IGNORE_SECURITY | CONTEXT_INCLUDE_CODE)
      
      # Check if method checks the flag against the expected values before calling
      - pattern-not: |
          if ($FLAG == CONTEXT_IGNORE_SECURITY || CONTEXT_INCLUDE_CODE) {
              throw new SecurityException("Unsafe flag combination detected");
          }
      
    description: |
      This rule detects the usage of `createPackageContext` with the dangerous flag combination `CONTEXT_IGNORE_SECURITY` and `CONTEXT_INCLUDE_CODE`.
      Such usage can lead to arbitrary code execution vulnerabilities, allowing malicious applications to gain elevated privileges.
    fix: |
      Avoid using `CONTEXT_IGNORE_SECURITY` and `CONTEXT_INCLUDE_CODE` flags together. Consider replacing the method with a safer alternative, such as:
      
      ```java
      $CTX.createPackageContext($PKG, 0);  // Avoid insecure flags
      ```
