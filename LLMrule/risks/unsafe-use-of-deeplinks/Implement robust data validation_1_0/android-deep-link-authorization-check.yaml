rules:
  - id: android-deep-link-authorization-check
    languages:
      - java
    message: Ensure that the authorization is checked before processing deep link parameters to prevent unauthorized actions.
    severity: ERROR
    patterns:
      - pattern: |
          @Override
          public boolean onNewIntent(Intent $INTENT) {
              String $DATA = $INTENT.getDataString();
              if ($DATA != null) {
                  if (!isAuthorized($USER, $ACTION)) {
                      return false;
                  }
                  // Continue processing the deep link parameters
              }
              ...
          }
      - pattern-not: |
          @Override
          public boolean onNewIntent(Intent $INTENT) {
              String $DATA = $INTENT.getDataString();
              if ($DATA != null) {
                  if (isAuthorized($USER, $ACTION)) {
                      // Continue processing the deep link parameters
                  }
              }
              ...
          }
    metavariable-type:
      - metavariable: $INTENT
        type: android.content.Intent
      - metavariable: $DATA
        type: String
    # Simplified comparison: only check if the data is not null
    metavariable-comparison:
      - metavariable: $DATA
        comparison: $DATA != null
