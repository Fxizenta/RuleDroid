rules:
  - id: SECURE_CLIPBOARD_SETTING
    languages:
      - java
    message: "\u526A\u8D34\u677F\u6570\u636E\u5FC5\u987B\u6807\u8BB0\u4E3A\u654F\u611F\u3002\u8BF7\u786E\u4FDD\u5728\u901A\u8FC7 setPrimaryClip \u6216 getDescription().setExtras \u5B58\u50A8\u526A\u8D34\u677F\u6570\u636E\u65F6\uFF0C\u8C03\u7528 putBoolean(...) \u8BBE\u7F6E ClipDescription.EXTRA_IS_SENSITIVE (\u6216 \"android.content.extra.IS_SENSITIVE\") \u4E3A true\u3002"
    metavariable-regex:
      $FLAG: "^(ClipDescription\\.EXTRA_IS_SENSITIVE|android\\.content\\.extra\\.IS_SENSITIVE)$"
    options:
      symbolic_propagation: true
    pattern-either:
      - pattern: "$CLIPBOARD_MANAGER.setPrimaryClip($CLIP)"
      - pattern: "$CLIP_DATA.getDescription().setExtras($EXTRAS)"
    pattern-not: "putBoolean($FLAG, true)"
    severity: INFO