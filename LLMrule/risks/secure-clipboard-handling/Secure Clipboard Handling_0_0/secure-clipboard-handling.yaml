rules:
- id: secure-clipboard-handling
  languages:
    - java
    - kotlin
  message: |
    Ensure sensitive data in clipboard is handled securely. 
    Use `ClipDescription.EXTRA_IS_SENSITIVE` for API level 33 or higher, and avoid leaving sensitive data in the clipboard.
  metadata:
    area: clipboard
    authors:
      - Your Name
    category: security
    references:
      - https://developer.android.com/reference/android/content/ClipDescription#EXTRA_IS_SENSITIVE
      - https://developer.android.com/reference/android/content/ClipboardManager
  severity: INFO
  patterns:
    # Match cases where sensitive data is added to clipboard without marking it as sensitive
    - pattern: |
        $CLIPDATA.getDescription().setExtras($EXTRAS);
    - metavariable-regex:
        metavariable: $EXTRAS
        regex: \.putBoolean\((ClipDescription.EXTRA_IS_SENSITIVE|"android.content.extra.IS_SENSITIVE"),\s*true\)
    # Match cases where clipboard is cleared
    - pattern: |
        $CLIPBOARD.clearPrimaryClip();
    # Match cases where clipboard is set to an empty value
    - pattern: |
        $CLIPBOARD.setPrimaryClip(ClipData.newPlainText("EmptyClipContent", ""));
  pattern-not: |
    // Ignore test cases or non-production code
    @Test
    public void test$FUNC() {
      ...
    }
  options:
    # Prevent overly broad matches
    generic_ellipsis_max_span: 0