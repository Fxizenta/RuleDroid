rules:
- id: intent-redirection-without-validation
  languages:
  - java
  - kotlin
  message: "\u76F4\u63A5\u4F7F\u7528\u4ECE getParcelableExtra(\"key\") \u83B7\u53D6\
    \u7684\u5D4C\u5957 intent \u8C03\u7528 startActivity\uFF0C \u800C\u672A\u5148\u4F7F\
    \u7528 resolveActivity \u68C0\u67E5\u76EE\u6807\u7EC4\u4EF6\u4FE1\u606F\u6216\u4F7F\
    \u7528 IntentSanitizer \u8FDB\u884C\u6D88\u6BD2\uFF0C \u53EF\u80FD\u5BFC\u81F4\
    \u610F\u56FE\u91CD\u5B9A\u5411\u653B\u51FB\u3002\u8BF7\u5728\u8C03\u7528 startActivity\
    \ \u524D\u5BF9\u5D4C\u5957 intent \u8FDB\u884C\u9A8C\u8BC1\u3002\n"
  metadata:
    cwe: CWE-927
    references:
    - https://developer.android.com/guide/components/intents-filters
    - https://developer.android.com/reference/kotlin/androidx/core/content/IntentSanitizer
  pattern-not:
  - pattern: '$INTENT.resolveActivity($PM)

      '
  - pattern: 'sanitizeByThrowing($INTENT)

      '
  patterns:
  - pattern: 'Intent $INTENT = (Intent)$OBJ.getParcelableExtra("key");

      '
  - pattern: 'startActivity($INTENT);

      '
  severity: ERROR
