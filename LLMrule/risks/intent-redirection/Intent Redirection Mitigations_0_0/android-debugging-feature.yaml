rules:
- id: android-debugging-feature
  languages:
  - java
  - kotlin
  message: |
    Enable StrictMode to detect unsafe intent launches for apps targeting Android
    12 or higher. This will help detect potential security risks related to
    unintentional intent leaks or unsafe operations.
  metadata:
    cwe: CWE-917
    owasp: M6
    references:
    - https://developer.android.com/reference/android/os/StrictMode
  severity: INFO
  patterns:
  - pattern: |
      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.S) {
          StrictMode.setVmPolicy(new StrictMode.VmPolicy.Builder()
              .detectUnsafeIntentLaunches()
              .penaltyLog()
              .build());
      }
  - pattern: |
      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.S) {
          StrictMode.setVmPolicy(StrictMode.VmPolicy.Builder()
              .detectUnsafeIntentLaunches()
              .penaltyLog()
              .build())
      }
  - pattern: |
      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
          StrictMode.setVmPolicy(StrictMode.VmPolicy.Builder()
              .detectUnsafeIntentLaunches()
              .penaltyLog()
              .build())
      }
  - pattern: |
      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.S) {
          StrictMode.setVmPolicy(new StrictMode.VmPolicy.Builder()
              .detectUnsafeIntentLaunches()
              .penaltyLog()
              .build())
      }
  description: |
    This rule checks if the app has enabled StrictMode for detecting unsafe
    intent launches, specifically for applications targeting Android 12 (API
    level 31) or higher. Enabling this feature helps prevent certain security risks
    related to unsafe intent operations.
  fix: |
    Ensure your application targets Android 12 (API level 31) or higher and add the following code to enable StrictMode:
    
    ```java
    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
        StrictMode.setVmPolicy(new StrictMode.VmPolicy.Builder()
            .detectUnsafeIntentLaunches()
            .penaltyLog()
            .build());
    }
    ```
  pattern-not: |
    // Make sure that the app is not missing StrictMode configuration for Android 12 or higher.
