rules:
  - id: unsafe_jackson_deserialization
    languages:
      - java
    message: |
      The application uses Jackson deserialization with default typing enabled.
      This can lead to unsafe deserialization and potential remote code execution.
      Consider disabling default typing or restricting acceptable types.
    metadata:
      cwe: CWE-502
      masvs: platform-8
      owasp-mobile: M1
      reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05h-Testing-Platform-Interaction.md#testing-object-persistence-mstg-platform-8
    patterns:
      - pattern-either:
          - pattern: $OBJ.enableDefaultTyping($ARG)
          - pattern: $OBJ.activateDefaultTyping($ARG)
    severity: ERROR