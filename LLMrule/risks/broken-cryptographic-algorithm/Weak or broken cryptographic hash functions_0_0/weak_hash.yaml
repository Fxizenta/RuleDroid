rules:
  - id: weak_hash
    patterns:
      - pattern-either:
          - pattern: 'MessageDigest.getInstance("=~/^(md5|md4|sha-1|sha1)$/i", ...)'
          - pattern: 'Files.hash(..., Hashing.md5());'
          - pattern: 'DigestUtils.md5Hex(...);'
          - pattern: 'DigestUtils.md5(...);'
          - pattern: 'DigestUtils.sha1Hex(...);'
          - pattern: 'DigestUtils.sha1(...);'
          - pattern: 'DigestUtils.sha(...);'
    message: "Use of a weak hash algorithm (MD5/MD4) has been detected, which may lead to collision attacks and data integrity issues. It is recommended to use a more secure hash algorithm such as SHA-2 or SHA-3."
    severity: ERROR
    languages:
      - java
    metadata:
      cwe: CWE-327
      masvs: CRYPTO-4
      owasp-mobile: M5
      reference: https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04g-Testing-Cryptography.md#identifying-insecure-andor-deprecated-cryptographic-algorithms-mstg-crypto-4