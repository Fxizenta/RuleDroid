rules:
- id: weak_hash_sha1
  languages:
  - java
  message: 'Weak Hash algorithm (SHA1) used. The SHA1 hash is known to have hash collisions.

    '
  metadata:
    cwe: cwe-327
    masvs: crypto-4
    owasp-mobile: m5
    reference: 'https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04g-Testing-Cryptography.md#identifying-insecure-andor-deprecated-cryptographic-algorithms-mstg-crypto-4

      '
  patterns:
  - pattern-either:
    - pattern: '$C.getInstance("SHA-1", ...);

        '
    - pattern: '$C.getInstance("sha1", ...);

        '
    - pattern: 'DigestUtils.sha1Hex(...);

        '
    - pattern: 'DigestUtils.sha1(...);

        '
    - pattern: 'DigestUtils.sha(...);

        '
  - pattern-not: '$C.getInstance("SHA-256", ...);

      '
  severity: ERROR
