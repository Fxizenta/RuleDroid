rules:
  - id: improper-contentprovider-filename-variable
    languages: [java, kotlin]
    message: >
      A filename obtained from a ContentProvider via getString() is assigned to
      a variable and later used in a File constructor without proper sanitization.
      This can allow an attacker to control the filename. Sanitize the filename or
      generate a unique name to mitigate file overwrite vulnerabilities.
    metadata:
      category: security
      cwe: CWE-73
      owasp-mobile: M3
    fix: |-
      Sanitize the filename (e.g., by wrapping it in a sanitizeFilename function)
      or generate a unique filename before using it in the File constructor.
    patterns:
      - pattern: |
          $FILENAME = $CURSOR.getString(...);
          ...
          new File(..., $FILENAME);
      - pattern-not: |
          $FILENAME = $CURSOR.getString(...);
          ...
          new File(..., sanitizeFilename($FILENAME));
    severity: ERROR