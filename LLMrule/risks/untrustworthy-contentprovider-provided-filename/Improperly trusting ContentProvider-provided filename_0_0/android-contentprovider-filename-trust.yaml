rules:
- id: android-contentprovider-filename-trust
  message: |
    Improperly trusting ContentProvider-provided filename. Ensure that filenames
    provided by ContentProviders are sanitized to prevent path traversal attacks.
    Use a sanitization function (e.g., `sanitizeFilename` or equivalent) to validate
    and clean filenames before using them in file operations.
  languages:
    - java
    - kotlin
  severity: ERROR
  metadata:
    cwe: CWE-73
    masvs: MSTG-STORAGE-6.1
    owasp-mobile: M1
    references:
      - https://cwe.mitre.org/data/definitions/73.html
      - https://owasp.org/www-project-mobile-security-testing-guide/stable/0x05d-Testing-Data-Storage.html
  mode: taint
  pattern-sources:
    - pattern: $FN = $CURSOR.getString($INDEX)
  pattern-sinks:
    - patterns:
        - pattern: |
            new File($DIR, $FN)
        - pattern: |
            new FileOutputStream($FP)
  sanitization:
    - patterns:
        # Allow common sanitization functions or path normalization logic
        - pattern: |
            $FN = sanitizeFilename(...)
        - pattern: |
            $FN = $FN.replaceAll("[^a-zA-Z0-9._-]", "")
        - pattern: |
            $FN = Paths.get($FN).normalize().toString()
  taint-tracking: true
  pattern-not:
    - pattern: |
        new File($DIR, "safe-filename.txt")
    - pattern: |
        new FileOutputStream("safe-file-path")
  fix: |
    // Ensure filenames are sanitized before using them in file operations.
    String sanitizedFilename = sanitizeFilename($FN);
    File safeFile = new File($DIR, sanitizedFilename);
