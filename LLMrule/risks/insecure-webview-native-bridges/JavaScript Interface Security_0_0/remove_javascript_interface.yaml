rules:
  - id: remove_javascript_interface
    languages:
      - java
      - kotlin
    message: Ensure that JavaScript interfaces are removed from WebView instances before loading untrusted content.
    metadata:
      cwe: cwe-749
      masvs: platform-7
      owasp-mobile: m1
    severity: ERROR
    patterns:
      - pattern-not: |
          $W.removeJavascriptInterface("")
      - pattern: |
          $W.removeJavascriptInterface($OBJ)
      - metavariable-type:
          metavariable: $W
          type: android.webkit.WebView