rules:
  - id: android-external-storage-scoped-storage
    languages:
      - xml
    message: >
      Avoid using `requestLegacyExternalStorage="true"` for applications targeting Android 10 or later.
      Use Scoped Storage instead.
    metadata:
      cwe: CWE-312
      owasp: 'M2: Insecure Data Storage'
      references:
        - https://developer.android.com/training/data-storage
        - https://developer.android.com/training/articles/security-tips.html#StoringData
    path: .*AndroidManifest\.xml
    severity: ERROR
    patterns:
      # 1. 检测应用清单文件中的 requestLegacyExternalStorage="true"
      - pattern: |
          <application
            android:requestLegacyExternalStorage="true" ...>

      # 2. 匹配 Android 10 或更高版本的 targetSdkVersion
      - pattern-inside: |
          <uses-sdk[\s\S]*android:targetSdkVersion="(29|30|[3-9][0-9]+)"[\s\S]*>

      # 3. 匹配 Android 11 (API 30) 及以上版本的 targetSdkVersion，确保没有使用 requestLegacyExternalStorage
      - pattern-inside: |
          <uses-sdk[\s\S]*android:targetSdkVersion="30"[\s\S]*>
      - pattern-inside: |
          <uses-sdk[\s\S]*android:targetSdkVersion="31"[\s\S]*>

    fix: |
      Remove `android:requestLegacyExternalStorage="true"` from your manifest file.
      Ensure your app uses Scoped Storage APIs as recommended in Android 10 and later.
