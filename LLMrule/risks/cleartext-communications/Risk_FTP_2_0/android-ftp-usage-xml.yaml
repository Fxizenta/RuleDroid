rules:
  - id: android-ftp-usage-xml
    languages:
      - xml
    message: >
      Insecure FTP protocol usage detected in an XML configuration file (e.g., AndroidManifest.xml or related XML resources).
      
      FTP transmits data without encryption, exposing sensitive information to potential interception. 
      It is strongly recommended to use SFTP or HTTPS to ensure secure data transmission.
    fix: >
      Replace all instances of the FTP protocol with SFTP or HTTPS in the XML configuration 
      to enhance communication security and align with best practices.
    metadata:
      info: >
        FTP URLs in XML configurations can cause sensitive data to be transmitted over unsecured networks, 
        leading to confidentiality and integrity risks. 
        To mitigate these risks, migrating to SFTP or HTTPS is advised.
      references:
        - https://developer.android.com/training/articles/security-config
      risk: "Risk: FTP protocol exposure in XML"
    name: "Risk: FTP Protocol Detected in XML"
    paths:
      include:
        - "**/AndroidManifest.xml"
        - "**/res/xml/**"
        - "**/xml/**"
    pattern-either:
      - pattern: "<$TAG ...>$URL</$TAG>"
      - pattern: '$ATTR="$VALUE"'
    metavariable-regex:
      - metavariable: $TAG
        regex: "(?i)^(server|endpoint|url|href|address|base|link|location|path|resource|ftpServer)$"
      - metavariable: $ATTR
        regex: "(?i)^(android:host|android:scheme|url|href|link|src|address|endpoint)$"
      - metavariable: $URL
        regex: "(?i)^ftp://(?!localhost|127\\.|192\\.168\\.|10\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.|.*(-->|<!)).*"
      - metavariable: $VALUE
        regex: "(?i)^ftp://(?!localhost|127\\.|192\\.168\\.|10\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.|.*(-->|<!)).*"
    pattern-not-inside: |
      <!--
        ...$URL...
      -->
    severity: ERROR
