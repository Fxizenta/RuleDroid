rules:
- id: cleartext-communication-android
  languages:
    - xml
  message: Cleartext traffic is permitted in the application. This can expose sensitive data to network attacks.
  paths:
    include:
      - '**/AndroidManifest.xml'
  patterns:
    - pattern: |
        <application ... android:usesCleartextTraffic="true" ... />
    - pattern-not: |
        <application ... android:usesCleartextTraffic="false" ... />
    - pattern-not: |
        <application ... android:usesCleartextTraffic="false"/>
  severity: ERROR
  metadata:
    remediation: |
      Set `android:usesCleartextTraffic="false"` in the `<application>` tag of your AndroidManifest.xml file to disable cleartext traffic and enhance security.