rules:
  - id: improper-fileprovider-root-path
    languages:
      - xml
    severity: ERROR
    message: "Using the <root-path> configuration may result in exposing the entire device file system. Please use the more restricted <files-path>, <cache-path>, etc. configuration instead."
    metadata:
      cwe: CWE-22
      owasp-mobile: MSTG-PLATFORM-2.4
      reference: https://developer.android.com/guide/topics/providers/content-provider-basics
    pattern-inside: |
      <paths>
        ...
      </paths>
    pattern: '<root-path ... path=$PATH ...>'
    # Optional: Add a metavariable-regex to further restrict the "path" attribute if needed
    # metavariable-regex:
    #   metavariable: $PATH
    #   regex: ^.+$