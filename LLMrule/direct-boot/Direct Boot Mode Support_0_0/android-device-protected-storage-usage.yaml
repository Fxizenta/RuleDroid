rules:
  - id: android-device-protected-storage-usage
    languages:
      - java
      - kotlin
    message: >
      The method createDeviceProtectedStorageContext() is being used to access
      device encrypted storage (for Direct Boot mode). Verify that only non-sensitive
      data (data that must be available during Direct Boot mode) is stored here.
    metadata:
      category: Android Security
      technology: Android
    severity: INFO
    patterns:
      - pattern-regex: \bcreateDeviceProtectedStorageContext\s*\(