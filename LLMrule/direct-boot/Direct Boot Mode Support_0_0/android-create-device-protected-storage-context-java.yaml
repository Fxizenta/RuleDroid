rules:
  - id: android-create-device-protected-storage-context-java
    languages:
      - java
    message: >
      Ensure that device encrypted storage is accessed correctly during Direct Boot mode in Java.
    metadata:
      cwe: 'CWE-312: Cleartext Storage of Sensitive Information'
      owasp: 'M5: Insufficient Cryptography'
    path: '*.java'
    severity: ERROR
    patterns:
      - pattern-either:
          # 检测 createDeviceProtectedStorageContext() 的不同调用方式
          - pattern: |
              Context $CTX = $APP.createDeviceProtectedStorageContext();
          - pattern: |
              Context $CTX = getApplicationContext().createDeviceProtectedStorageContext();
          - pattern: |
              Context $CTX = getBaseContext().createDeviceProtectedStorageContext();
      - pattern-either:
          # 检测不同的文件访问方式
          - pattern: |
              FileInputStream inStream = $CTX.openFileInput($FILENAME);
          - pattern: |
              File file = new File($CTX.getFilesDir(), $FILENAME);
          - pattern: |
              FileOutputStream outStream = $CTX.openFileOutput($FILENAME, ...);
          - pattern: |
              File dir = $CTX.getDir($DIRNAME, ...);
          # 检测数据库或 SharedPreferences 迁移
          - pattern: |
              $CTX.moveSharedPreferencesFrom($OTHER_CONTEXT, $PREF_NAME);
          - pattern: |
              $CTX.moveDatabaseFrom($OTHER_CONTEXT, $DB_NAME);
