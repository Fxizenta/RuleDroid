rules:
- id: android-keystore-key-pair-generation
  languages:
    - java
  message: Ensure that the key pair generation includes proper user authentication requirements and secure configurations.
  severity: ERROR
  patterns:
    - pattern: |
        KeyPairGenerator $GENERATOR = KeyPairGenerator.getInstance($ALGORITHM, "AndroidKeyStore");
        $GENERATOR.initialize(
            new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
                .setDigests($DIGEST)
                .setAlgorithmParameterSpec(new ECGenParameterSpec($SPEC))
                .setUserAuthenticationRequired($AUTH_REQUIRED)
                .build());
        $GENERATOR.generateKeyPair();
    - pattern-not: |
        $GENERATOR.initialize(
            new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
                .setUserAuthenticationRequired(false)
                .build());
    - pattern-not: |
        $GENERATOR.initialize(
            new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
                .build());
  metadata:
    references:
      - https://developer.android.com/training/articles/keystore
      - https://developer.android.com/reference/android/security/keystore/KeyGenParameterSpec.Builder
  fix: |
    Ensure that `setUserAuthenticationRequired(true)` is explicitly set when initializing the `KeyGenParameterSpec.Builder`. Avoid omitting this parameter or setting it to `false`. Additionally, validate other parameters like `setDigests` and `setPurpose` to ensure secure configurations.