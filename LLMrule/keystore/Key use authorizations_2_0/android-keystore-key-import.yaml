rules:
- id: android-keystore-key-import
  languages:
    - java
  message: Ensure that the key import includes proper authorization parameters in the AuthorizationList.
  severity: ERROR
  pattern-inside: |
    KeyDescription $KEY_DESCRIPTION = new KeyDescription(
        $KEY_FORMAT,
        new AuthorizationList($AUTHORIZATION_LIST)
    );
  patterns:
    # 匹配 KeyDescription 代码块中的 AuthorizationList
    - pattern: |
        new AuthorizationList($AUTHORIZATION_LIST);

  pattern-not:
    # 1. 避免误报: 空的 AuthorizationList
    - pattern: |
        new AuthorizationList()

    - pattern: |
        new AuthorizationList(/* empty */)

    # 2. 避免误报: AuthorizationList 仅包含部分授权参数但缺少关键安全参数
    - pattern: |
        new AuthorizationList(
            $PARTIAL_AUTHORIZATION_PARAMETERS
        );

  fix: |
    Ensure AuthorizationList includes required parameters such as `Purpose`, `UserAuthenticationRequired`, and `Algorithm`.
