rules:
- examples:
  - code: "KeyGenParameterSpec.Builder builder = new KeyGenParameterSpec.Builder(KEY_ALIAS,\
      \ KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)\n  .setBlockModes(KeyProperties.BLOCK_MODE_CBC)\n\
      \  .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_PKCS7)\n  .setUserAuthenticationRequired(true)\n\
      \  .setUserAuthenticationValidityDurationSeconds(30)\n  .build();\n"
    config:
    - key: KEY_ALIAS
    - purpose: KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT
    - block_mode: KeyProperties.BLOCK_MODE_CBC
    - padding: KeyProperties.ENCRYPTION_PADDING_PKCS7
    - duration: 30
  id: android-keystore-authentication-duration
  languages:
  - java
  message: Ensure user authentication is valid for a specific duration.
  metadata:
    cwe: 'CWE-287: Improper Authentication'
    owasp: 'M5: Insufficient Cryptography'
  patterns:
  - pattern: "new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)\n  .setBlockModes($BLOCK_MODE)\n\
      \  .setEncryptionPaddings($PADDING)\n  .setUserAuthenticationRequired(true)\n\
      \  .setUserAuthenticationValidityDurationSeconds($DURATION)\n"
  severity: INFO
