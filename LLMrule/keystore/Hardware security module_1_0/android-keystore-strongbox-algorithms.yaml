rules:
  - id: android-keystore-strongbox-algorithms
    languages:
      - java
    message: |
      Ensure that StrongBox-backed keys use secure and supported configurations:
      - Block modes: GCM
      - Padding: PKCS7 or NoPadding
      - Key size: At least 2048 bits for RSA
    metadata:
      references:
        - https://developer.android.com/training/articles/keystore#HardwareSecurityModule
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
                  .setBlockModes($BLOCK_MODE)
                  .setEncryptionPaddings($PADDING)
                  .setIsStrongBoxBacked(true)
                  .setKeySize($KEY_SIZE)
                  .build();
          - pattern: |
              KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
                  .setSignaturePaddings($SIGNATURE_PADDING)
                  .setIsStrongBoxBacked(true)
                  .setKeySize($KEY_SIZE)
                  .build();

      # 确保 StrongBox 被启用
      - pattern-not: |
          KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
              .setIsStrongBoxBacked(false)
              .build();

    metavariable-pattern:
      # 确保 $BLOCK_MODE 是 GCM
      $BLOCK_MODE: "^(?!GCM$).*"
      # 确保 $PADDING 是 PKCS7 或 NoPadding
      $PADDING: "^(?!PKCS7$|NoPadding$).*"
      # 确保 $SIGNATURE_PADDING 不是 PSS
      $SIGNATURE_PADDING: "^(?!PSS$).*"
      # 确保 $KEY_SIZE >= 2048
      $KEY_SIZE: "^(1\\d{3}|[1-9]\\d{0,2})$"
