rules:
  - id: android-keystore-strongbox-import
    languages:
      - java
    message: Ensure that StrongBox is used for key import in the Android KeyStore.
    metadata:
      references:
        - https://developer.android.com/training/articles/keystore#HardwareSecurityModule
    severity: INFO
    patterns:
      - pattern-either:
          # 匹配完整的KeyStore初始化和StrongBox-backed配置
          - pattern: |
              KeyStore keyStore = KeyStore.getInstance("AndroidKeyStore");
              keyStore.load(null);
              KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
                  .setBlockModes($BLOCK_MODE)
                  .setEncryptionPaddings($PADDING)
                  .setIsStrongBoxBacked(true)
                  .setKeySize($KEY_SIZE)
                  .build();
              keyStore.setEntry($KEY_ALIAS, new KeyStore.SecretKeyEntry($KEY), spec);
          # 支持不同的KeyStore初始化方式
          - pattern: |
              KeyStore keyStore = KeyStore.getInstance("AndroidKeyStore");
              keyStore.load(null);
              KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
                  .setBlockModes($BLOCK_MODE)
                  .setEncryptionPaddings($PADDING)
                  .setIsStrongBoxBacked(true)
                  .build();
              keyStore.setEntry($KEY_ALIAS, new KeyStore.SecretKeyEntry($KEY), spec);
          # 支持其他形式的KeyStore初始化
          - pattern: |
              KeyStore keyStore = KeyStore.getInstance("AndroidKeyStore");
              keyStore.load(null);
              KeyGenParameterSpec.Builder builder = new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
                  .setBlockModes($BLOCK_MODE)
                  .setEncryptionPaddings($PADDING)
                  .setIsStrongBoxBacked(true)
                  .setKeySize($KEY_SIZE);
              KeyGenParameterSpec spec = builder.build();
              keyStore.setEntry($KEY_ALIAS, new KeyStore.SecretKeyEntry($KEY), spec);
      - pattern-not: |
          KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder($KEY_ALIAS, $PURPOSE)
              .setBlockModes($BLOCK_MODE)
              .setEncryptionPaddings($PADDING)
              .setIsStrongBoxBacked(false)
              .build();
    metavariable-pattern:
      # 确保 $BLOCK_MODE 是 GCM
      $BLOCK_MODE: "^GCM$"
      # 确保 $PADDING 是 PKCS7 或 NoPadding
      $PADDING: "^(PKCS7|NoPadding)$"
      # 确保 $KEY_SIZE >= 2048
      $KEY_SIZE: "^(2048|[2-9]\\d{3,})$"
