rules:
  - id: android-debug-api
    languages:
      - java
    message: |
      The app uses the android.os.Debug API, which may access user data related to app info and performance.
      Ensure that sensitive data is not exposed and that the Debug API is not used in production builds.
    metadata:
      category: Android Security
      technology: Android
    severity: WARNING
    patterns:
      # Detect any usage of android.os.Debug object initialization or assignment
      - pattern: |
          android.os.Debug $X = $Y;
      # Detect method calls for sensitive Debug API functions
      - pattern-either:
          - pattern: |
              android.os.Debug.dumpHprofData($FILE);
          - pattern: |
              android.os.Debug.startMethodTracing($TRACE_NAME);
          - pattern: |
              android.os.Debug.stopMethodTracing();
      # Detect the use of Debug for stack traces or dumping data
      - pattern: |
          android.os.Debug.getStackTrace();
      - pattern: |
          android.os.Debug.isDebuggerConnected();
      # Detect checks for Debug API usage (stack traces or tracing methods)
      - pattern: |
          if ($CONDITION) { android.os.Debug.startMethodTracing($TRACE_NAME); }
      - pattern: |
          if ($CONDITION) { android.os.Debug.dumpHprofData($FILE); }
      # Exclude cases where Debug API is used for logging in non-production builds
      - pattern-not: |
          android.os.Debug.startMethodTracing("non-production");
      - pattern-not: |
          if (BuildConfig.DEBUG) {
              android.os.Debug.startMethodTracing("debug_trace");
          }
      - pattern-not: |
          if ($BUILD_TYPE == "debug") {
              android.os.Debug.startMethodTracing($TRACE_NAME);
          }
      - pattern-not: |
          if (BuildConfig.FLAVOR == "debug") {
              android.os.Debug.startMethodTracing($TRACE_NAME);
          }
      # Exclude Debug usage in test environments
      - pattern-not: |
          if ($ENV == "test") {
              android.os.Debug.startMethodTracing($TRACE_NAME);
          }
      # Exclude usage of Debug API in production environments with no debugging or test flag
      - pattern-not: |
          if (!BuildConfig.DEBUG && !BuildConfig.FLAVOR.equals("debug")) {
              android.os.Debug.startMethodTracing($TRACE_NAME);
          }
    fix: |
      Ensure that the android.os.Debug API is used only in development or testing environments, and never in production. 
      Consider removing or disabling this API in the production release to avoid exposing sensitive user data.
