rules:
- id: android-strictmode-api
  languages:
    - java
  message: |
    The app uses the StrictMode API, which may access user data related to app info and performance. 
    Ensure that StrictMode is used appropriately and does not expose sensitive user data.
  metadata:
    category: Android Security
    technology: Android
  severity: INFO
  patterns:
    - pattern-either:
        - pattern: StrictMode.setThreadPolicy($POLICY)
        - pattern: StrictMode.setVmPolicy($POLICY)
        - pattern: StrictMode $X = $Y;
  pattern-not: |
    StrictMode $X = null;