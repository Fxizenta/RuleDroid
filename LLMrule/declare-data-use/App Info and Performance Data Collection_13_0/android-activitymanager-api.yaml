rules:
- id: android-activitymanager-api
  languages:
    - java
  message: The app uses the ActivityManager API, which may access user data related to app info and performance.
  metadata:
    category: Android Security
    technology: Android
    cwe: CWE-200  # 信息暴露
    owasp: "M1: Improper Platform Usage"
  severity: ERROR
  patterns:
    # 检测 ActivityManager 变量定义
    - pattern: |
        ActivityManager $X = $Y;
    # 检测通过 getSystemService 获取 ActivityManager 实例
    - pattern: |
        (ActivityManager) $CTX.getSystemService(ActivityManager.class);
    - pattern: |
        (ActivityManager) $CTX.getSystemService("activity");
    # 重点检测高风险 API 调用
    - pattern-either:
        - pattern: |
            $X.getRunningAppProcesses();
        - pattern: |
            $X.getRunningTasks(...); 
        - pattern: |
            $X.getRunningServices(...); 
    # 规避误报（排除某些安全调用）
    - pattern-not:
        pattern-either:
          - pattern: |
              $X.getMemoryInfo(...);
          - pattern: |
              $X.isLowRamDevice();
          - pattern: |
              $X.clearApplicationUserData();
    - pattern-not: |
        $X = null;
