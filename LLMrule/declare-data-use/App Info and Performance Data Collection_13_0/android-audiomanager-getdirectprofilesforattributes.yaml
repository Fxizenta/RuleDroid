rules:
- id: android-audiomanager-getdirectprofilesforattributes
  languages:
  - java
  message: The app calls getDirectProfilesForAttributes() from the AudioManager API,
    which may access user data related to app info and performance.
  metadata:
    category: Android Security
    technology: Android
  patterns:
  - pattern: $X.getDirectProfilesForAttributes(...);
  - pattern-not: $X == null
  severity: INFO
