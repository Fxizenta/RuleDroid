rules:
  - id: google-shortcuts-integration
    languages:
      - java
      - kotlin
    message: "The Google Shortcuts integration library is used in the code. Please confirm that data collection and processing comply with user privacy protection requirements."
    metadata:
      category: Android Security
    severity: INFO
    pattern-either:
      - pattern: import com.google.android.libraries.shortcuts
      - pattern: import com.google.android.gms.shortcuts
      - pattern: com.google.android.libraries.shortcuts
      - pattern: com.google.android.gms.shortcuts