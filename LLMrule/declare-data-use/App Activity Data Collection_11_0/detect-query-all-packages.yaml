rules:
  - id: detect-query-all-packages
    languages:
      - xml
    message: QUERY_ALL_PACKAGES permission detected. Ensure it is necessary and not used to collect sensitive user data without consent.
    patterns:
      - pattern: |
          <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" ... />
      - pattern-not: |
          <!-- Justification: QUERY_ALL_PACKAGES is required for legitimate use case -->
    severity: INFO