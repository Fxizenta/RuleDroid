rules:
- id: detect-text-service
  languages:
  - java
  message: Usage of TextService detected. Ensure it is not used to collect sensitive
    user data without consent.
  patterns:
  - pattern: "class $CLASS extends android.inputmethodservice.InputMethodService {\n\
      \  ...\n}\n"
  - pattern-not: "@Override\npublic void onCreate() {\n  ...\n}\n"
  severity: INFO
