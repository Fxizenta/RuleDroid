rules:
- id: java-healthconnect-api-usage
  languages:
    - java
  message: "The use of Health Connect API has been detected. Please check whether the processing of health data complies with privacy protection requirements."
  metadata:
    category: data_privacy
    technology: android
  pattern-not-inside:
    - pattern: "//"
    - pattern: "/*"
  pattern-either:
    - pattern: "import androidx.health.connect"
    - pattern: "import android.health.connect"
  severity: INFO