rules:
- id: android-device-id-exposure
  languages:
    - xml
  message: >
    The Android manifest declares at least one permission that allows access to device or other IDs,
    potentially leading to privacy-sensitive data collection.
  metadata:
    category: privacy
    technology: android
  paths:
    include:
      - '**/AndroidManifest.xml'
  pattern-either:
    - pattern: '<uses-permission android:name="com.google.android.gms.permission.AD_ID" ...>'
    - pattern: '<uses-permission android:name="android.permission.READ_PRIVILEGED_PHONE_STATE" ...>'
    - pattern: '<uses-permission android:name="android.permission.READ_PHONE_STATE" ...>'
    - pattern: '<uses-permission android:name="android.permission.ACCESS_ADSERVICES_AD_ID" ...>'
  severity: INFO