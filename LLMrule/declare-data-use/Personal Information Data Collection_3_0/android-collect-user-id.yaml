rules:
- id: android-collect-user-id
  languages:
  - java
  message: The app collects user IDs, which are personal information.
  metadata:
    category: Personal Information Data Collection
  patterns:
  - pattern: 'String $USER_ID = $OBJ.getUserId();

      '
  - pattern-not: '// Ignore cases where the user ID is not related to personal information

      String $USER_ID = "exampleID";

      '
  severity: INFO
