rules:
- id: android-collect-phone-number
  languages:
  - java
  message: The app collects the user's phone number, which is personal information.
  metadata:
    category: Personal Information Data Collection
  patterns:
  - pattern: 'String $PHONE_NUMBER = $OBJ.getPhoneNumber();

      '
  - pattern-not: '// Ignore cases where the phone number is not related to personal
      information

      String $PHONE_NUMBER = "1234567890";

      '
  severity: INFO
