rules:
  - id: android-accountmanager-api
    languages:
      - java
    message: >
      The app uses the AccountManager API, which may access user data related to personal information.
      Ensure that its usage complies with privacy regulations.
    metadata:
      category: Personal Information Data Collection
      references:
        - "https://developer.android.com/reference/android/accounts/AccountManager"
        - "https://www.privacyinternational.org/learn/what-are-personal-data-and-sensitive-data"
      cwe: "CWE-359" # Exposure of Private Information
      remediation: >
        Ensure that the AccountManager API is used appropriately and complies with privacy regulations. Avoid unauthorized access to user data. 
        Use encrypted communication channels and avoid storing sensitive data in plain text.
    severity: INFO
    patterns:
      # Detect initialization of AccountManager
      - pattern: |
          AccountManager $AM = AccountManager.get($CTX);
      # Detect calls to getAccounts or getAccountsByType for fetching user accounts
      - pattern-either:
          - pattern: |
              Account[] $ACCOUNTS = $AM.getAccounts();
          - pattern: |
              Account[] $ACCOUNTS = $AM.getAccountsByType($TYPE);
      # Detect calls to getPassword and other sensitive account data retrieval
      - pattern: |
          String $PASSWORD = $AM.getPassword($ACCOUNT);
      - pattern: |
          String $PASSWORD = $AM.getUserData($ACCOUNT, $KEY);
      - pattern: |
          String $AUTH_TOKEN = $AM.peekAuthToken($ACCOUNT, $AUTH_TOKEN_TYPE);
      # Exclude cases where AccountManager is used for non-sensitive, public information
      - pattern-not: |
          // Ignore cases where AccountManager is used for non-sensitive data handling
          $AM.getAccounts();
      - pattern-not: |
          // Ignore cases where AccountManager is used for retrieving public account info
          $AM.getAccountsByType("com.example.public");
      # Exclude usage for mock data or non-production builds
      - pattern-not: |
          // Ignore mock usage in non-production builds
          $AM.getAccountsByType("com.example.mock");
    fix: |
      Ensure that the AccountManager API is used only for the retrieval of user data that is necessary for your app's functionality. 
      Always encrypt sensitive data and ensure that it is only accessed by authorized components.
    min-version: 1.31.0
