rules:
  - id: detect-ip-address-location
    languages:
      - java
    message: >
      Deriving location information from an IP address detected. Ensure that location data is handled securely, 
      anonymized, and complies with privacy policies.
    severity: INFO
    patterns:
      - pattern: |
          $X.getHostAddress()
      - pattern: |
          $X = $Y.getInetAddress();
      - pattern: |
          $X.getHostName()
      - pattern-not-inside: |
          // Ignore cases where IP address is used for logging or analytics
          Log.$METHOD($X.getHostAddress())
      - pattern-not-inside: |
          // Ignore cases where IP address is used for anonymization
          SecureDataHandler.anonymize($X.getHostAddress())
    metavariable-types:
      - metavariable: $X
        type: java.net.InetAddress
    metadata:
      references:
        - "https://developer.android.com/reference/java/net/InetAddress#getHostAddress()"
      remediation: >
        Ensure that IP address data is handled securely by anonymizing or encrypting location data,
        and obtain user consent before using or storing sensitive data.
    min-version: 1.31.0
