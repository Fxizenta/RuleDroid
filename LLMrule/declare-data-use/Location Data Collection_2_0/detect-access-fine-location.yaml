rules:
- id: detect-access-fine-location
  languages:
  - java
  message: Usage of ACCESS_FINE_LOCATION detected. Ensure that location data is handled
    securely.
  patterns:
  - pattern: "@RequiresPermission(ACCESS_FINE_LOCATION)\npublic $RET $METHOD($ARGS)\
      \ {\n  ...\n}\n"
  - pattern: '$X.requestPermissions(new String[]{ACCESS_FINE_LOCATION}, $Y)

      '
  - pattern-not: "@RequiresPermission(ACCESS_COARSE_LOCATION)\npublic $RET $METHOD($ARGS)\
      \ {\n  ...\n}\n"
  severity: INFO
