rules:
  - id: detect-access-point-name-location
    languages:
      - java
    message: >
      Deriving location information from an access point name (SSID) detected. Ensure that location data is handled securely
      and complies with privacy policies. Avoid collecting or exposing location data without explicit user consent.
    severity: INFO
    patterns:
      - pattern: |
          $X.getSSID()
      - pattern: |
          $X.getConnectionInfo().getSSID()
      - pattern-not-inside: |
          // Ignore cases where SSID is used for logging
          Log.$METHOD($X.getSSID())
      - pattern-not-inside: |
          // Ignore cases where SSID is used for analytics or diagnostics
          Analytics.$METHOD($X.getSSID())
      - pattern-not-inside: |
          // Ignore cases where SSID is used in a context where it is anonymized or encrypted
          SecureDataHandler.anonymize($X.getSSID())
    metavariable-comparison:
      - metavariable: $X
        comparison: |
          $X instanceof WifiManager || $X instanceof WifiInfo || $X instanceof SomeOtherRelevantClass
    metadata:
      references:
        - "https://developer.android.com/reference/android/net/wifi/WifiManager#getSSID()"
        - "https://developer.android.com/reference/android/net/wifi/WifiInfo#getSSID()"
      remediation: >
        Ensure that access point names (SSIDs) and related network information are treated as sensitive data.
        Encrypt or anonymize this data as necessary and obtain explicit user consent before collecting or processing location data.
    min-version: 1.31.0
