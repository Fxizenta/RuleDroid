rules:
- id: android-insecure-trustmanager-class-empty-checkserver
  languages:
  - java
  message: "\u4E0D\u5B89\u5168\u7684 TrustManager \u5B9E\u73B0\uFF1A\u7C7B\u4E2D\u7684\
    \ checkServerTrusted \u65B9\u6CD5\u4E3A\u7A7A\u6216\u4EC5\u5305\u542B\u6CE8\u91CA\
    \uFF0C \u8BF7\u4E0D\u8981\u4F7F\u7528\u7A7A\u5B9E\u73B0\u6765\u7ED5\u8FC7\u670D\
    \u52A1\u5668\u8BC1\u4E66\u6821\u9A8C\uFF0C\u800C\u5E94\u901A\u8FC7\u6B63\u786E\
    \u7684 Network Security Configuration \u914D\u7F6E\u81EA\u5B9A\u4E49 CA\u3002\n"
  pattern-not-inside:
  - "public void checkServerTrusted(...){\n    ... throw ...\n}\n"
  patterns:
  - pattern: "class $CLASS implements javax.net.ssl.X509TrustManager {\n    ...\n\
      \    public void checkServerTrusted(...){\n    }\n}\n"
  severity: ERROR
