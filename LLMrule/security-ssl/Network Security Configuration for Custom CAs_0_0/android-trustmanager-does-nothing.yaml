rules:
- id: android-trustmanager-does-nothing
  languages:
  - java
  message: >
    TrustManager that does nothing detected. This leaves users vulnerable to attacks.
    Use Network Security Configuration to trust custom CAs instead.
  metadata:
    cwe: CWE-295
    owasp: A6:2017-Security Misconfiguration
  severity: ERROR
  patterns:
  - pattern-either:
    # Match TrustManager with insecure checkClientTrusted and checkServerTrusted implementations
    - pattern: |
        new TrustManager[] {
          new X509TrustManager() {
            @Override
            public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            ...
            @Override
            public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              ...
            }
            ...
            @Override
            public X509Certificate[] getAcceptedIssuers() {
              return $RETURN_VALUE;
            }
          }
        }
    # Match variations where methods explicitly do nothing
    - pattern: |
        new TrustManager[] {
          new X509TrustManager() {
            @Override
            public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              // Do nothing
            }
            ...
            @Override
            public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
              // Do nothing
            }
            ...
            @Override
            public X509Certificate[] getAcceptedIssuers() {
              return new X509Certificate[] {};
            }
          }
        }
  - pattern-not: |
      @Override
      public void checkClientTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
        // Custom implementation
        ...
      }
  - pattern-not: |
      @Override
      public void checkServerTrusted(X509Certificate[] $CERTS, String $AUTH_TYPE) {
        // Custom implementation
        ...
      }
  - pattern-inside: |
      SSLContext $CTX = SSLContext.getInstance($PROTOCOL);
      $CTX.init($KEY_MANAGER, $TRUST_MANAGER, $SECURE_RANDOM);