rules:
- id: android-uses-permission
  languages:
    - xml
  message: Ensure that the requested permission is necessary and follows the Principle of Least Privilege.
  severity: WARNING
  patterns:
    - pattern: |
        <uses-permission android:name="$PERMISSION_NAME" />
    - pattern-not: |
        <uses-permission android:name="android.permission.$PERMISSION_NAME" />
  metavariable-regex:
    $PERMISSION_NAME: ^[a-zA-Z0-9_.]+$