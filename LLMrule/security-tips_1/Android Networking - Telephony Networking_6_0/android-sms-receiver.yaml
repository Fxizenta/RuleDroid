rules:
  - id: android-sms-receiver
    languages:
      - java
    message: |
      Handling SMS messages in broadcast receivers can be insecure. Ensure sensitive
      data is not processed or transmitted via SMS.
    metadata:
      cwe: 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp: 'M3: Insecure Communication'
    severity: WARNING
    patterns:
      # Match the SMS_RECEIVED action
      - pattern: |
          public void onReceive(Context context, Intent intent) {
              if (intent.getAction().equals("android.provider.Telephony.SMS_RECEIVED")) {
                  // Handle SMS
              }
          }
      # Match other related SMS actions like SENT, DELIVERED
      - pattern: |
          public void onReceive(Context context, Intent intent) {
              if (intent.getAction().equals("android.provider.Telephony.SMS_SENT") || 
                  intent.getAction().equals("android.provider.Telephony.SMS_DELIVERED")) {
                  // Handle SMS sent or delivered
              }
          }
      # Handle SMS_RECEIVED with intent checking for null or empty actions
      - pattern: |
          public void onReceive(Context context, Intent intent) {
              if (intent != null && intent.getAction() != null && 
                  intent.getAction().equals("android.provider.Telephony.SMS_RECEIVED")) {
                  // Handle SMS
              }
          }
      # Exclude patterns where secure handling or encryption is used
      - pattern-not: |
          public void onReceive(Context context, Intent intent) {
              if (intent.getAction().equals("android.provider.Telephony.SMS_RECEIVED")) {
                  secureHandleSms(intent); // Secure handling of SMS
              }
          }
      # Exclude case where SMS is handled through some authentication or encryption method
      - pattern-not: |
          public void onReceive(Context context, Intent intent) {
              if (intent.getAction().equals("android.provider.Telephony.SMS_RECEIVED")) {
                  encryptSmsData(intent); // Securely encrypt SMS data
              }
          }
    fix: |
      // Ensure SMS is handled securely or avoid processing sensitive data through SMS
      public void onReceive(Context context, Intent intent) {
          if (intent.getAction().equals("android.provider.Telephony.SMS_RECEIVED")) {
              // Secure handling of SMS data
              secureHandleSms(intent);
          }
      }
