rules:
- id: use-environment-specific-keys
  languages:
    - java
  message: Use environment-specific API keys for development, testing, and production.
  metadata:
    category: security
    technology: android
  patterns:
    - pattern-either:
      - pattern: |
          String apiKey = "$API_KEY";
      - pattern: |
          final String API_KEY = "$API_KEY";
  pattern-not-either:
    - pattern: |
        String apiKey = "example_key";
    - pattern: |
        String apiKey = "";
    - pattern: |
        String apiKey = null;
    - pattern: |
        final String API_KEY = "example_key";
    - pattern: |
        final String API_KEY = "";
    - pattern: |
        final String API_KEY = null;
  fix: |
    Consider using environment variables or a secure configuration management tool to inject environment-specific API keys.
  severity: ERROR
