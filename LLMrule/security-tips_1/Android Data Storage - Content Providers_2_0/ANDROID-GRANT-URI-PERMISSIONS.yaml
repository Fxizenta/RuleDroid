rules:
- id: ANDROID-GRANT-URI-PERMISSIONS
  languages:
  - xml
  message: Use `android:grantUriPermissions` attribute for more granular access control.
  metadata:
    category: security
    owasp-mobile: M3
    references:
    - https://developer.android.com/guide/topics/manifest/provider-element
    technology: android
  paths:
    include:
    - '**/AndroidManifest.xml'
  patterns:
  - pattern: <provider ... android:grantUriPermissions="true" ... />
  severity: ERROR
