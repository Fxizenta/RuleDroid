rules:
- id: ANDROID-CONTENT-PROVIDER-SIGNATURE-PERMISSION
  languages:
  - xml
  message: >
    For sharing data between your own apps securely, ensure `android:protectionLevel`
    is set to `signature`. Avoid using weaker protection levels like `normal`, `dangerous`,
    or `signatureOrSystem`.
  metadata:
    category: security
    owasp-mobile: M3
    references:
    - https://developer.android.com/guide/topics/manifest/provider-element
    technology: android
  paths:
    include:
    - '**/AndroidManifest.xml'
  patterns:
  - pattern-not: <permission ... android:protectionLevel="signature" ... />
  - pattern: <permission ... android:protectionLevel=... />
  severity: ERROR